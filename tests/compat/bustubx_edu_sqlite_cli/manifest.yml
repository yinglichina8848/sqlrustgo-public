# V312-57 BustubX EDU sqlite-style CLI test manifest
#
# See: openspec/changes/v312-57-sqlite-style-edu-cli/specs/sqlite-style-edu-cli/spec.md

version: 1
policy:
  stable_stderr_prefix: "sqlrustgo:error:"
  cli_binary: "sqlrustgo"

cases:
  # ─── Week 1: environment, first SQL, exit codes, stdin ───
  - case_id: week01_help_exit_zero
    week: week01
    sql_file: week01/week01_help.sql
    expected_exit_code: 0
    oracle_mode: golden
    golden_file: week01/week01_help.golden

  - case_id: week01_exit_code_on_error
    week: week01
    sql_file: week01/week01_bad_sql.sql
    expected_exit_code: 1
    oracle_mode: stderr_prefix
    expected_stderr_prefix: "sqlrustgo:error:parse:"

  - case_id: week01_stdin_batch
    week: week01
    sql_file: week01/week01_stdin.sql
    stdin_file: week01/week01_stdin.in
    expected_exit_code: 0
    oracle_mode: golden
    golden_file: week01/week01_stdin.golden

  - case_id: week01_continue_on_error
    week: week01
    sql_file: week01/week01_stdin.sql
    stdin_file: week01/week01_continue_on_error.in
    use_arg_continue_on_error: true
    expected_exit_code: 1
    oracle_mode: golden
    golden_file: week01/week01_continue.golden

  # ─── Week 2: CREATE / INSERT / SELECT, output modes ───
  - case_id: week02_create_insert_select
    week: week02
    sql_file: week02/week02_crud.sql
    expected_exit_code: 0
    oracle_mode: golden
    golden_file: week02/week02_crud.golden

  - case_id: week02_csv_output
    week: week02
    sql_file: week02/week02_csv.sql
    expected_exit_code: 0
    oracle_mode: golden
    golden_file: week02/week02_csv.golden

  - case_id: week02_list_output
    week: week02
    sql_file: week02/week02_list.sql
    expected_exit_code: 0
    oracle_mode: golden
    golden_file: week02/week02_list.golden

  - case_id: week02_json_output
    week: week02
    sql_file: week02/week02_json.sql
    expected_exit_code: 0
    oracle_mode: json_schema
    golden_file: week02/week02_json.golden

  # ─── Week 3: persistence, .tables meta-command ───
  - case_id: week03_persistence_setup
    week: week03
    sql_file: week03/week03_p1.sql
    expected_exit_code: 0
    oracle_mode: golden
    golden_file: week03/week03_p1.golden
    setup_for: week03_persistence_verify

  - case_id: week03_persistence_verify
    week: week03
    sql_file: week03/week03_p2.sql
    expected_exit_code: 0
    oracle_mode: golden
    golden_file: week03/week03_p2.golden
    depends_on: week03_persistence_setup

  - case_id: week03_dot_tables
    week: week03
    sql_file: week03/week03_dot_tables.sql
    expected_exit_code: 0
    oracle_mode: golden
    golden_file: week03/week03_dot_tables.golden

  # ─── Week 4: parser/binder/catalog errors, schema meta ───
  - case_id: week04_dot_schema
    week: week04
    sql_file: week04/week04_dot_schema.sql
    expected_exit_code: 0
    oracle_mode: golden
    golden_file: week04/week04_dot_schema.golden

  - case_id: week04_bind_error_stable_prefix
    week: week04
    sql_file: week04/week04_bind.sql
    expected_exit_code: 1
    oracle_mode: stderr_prefix
    expected_stderr_prefix: "sqlrustgo:error:bind:"

  - case_id: week04_continue_on_error_advanced
    week: week04
    sql_file: week04/week04_continue.sql
    use_arg_continue_on_error: true
    expected_exit_code: 1
    oracle_mode: golden
    golden_file: week04/week04_continue.golden

  # ─── Week 5: executor (CREATE/INSERT/SELECT/WHERE) ───
  - case_id: week05_exec_create_table
    week: week05
    sql_file: week05/week05_exec_create_table.sql
    expected_exit_code: 0
    oracle_mode: golden
    golden_file: week05/week05_exec_create_table.golden

  - case_id: week05_exec_filter
    week: week05
    sql_file: week05/week05_exec_filter.sql
    expected_exit_code: 0
    oracle_mode: golden
    golden_file: week05/week05_exec_filter.golden

  - case_id: week05_exec_aggregate
    week: week05
    sql_file: week05/week05_exec_aggregate.sql
    expected_exit_code: 0
    oracle_mode: golden
    golden_file: week05/week05_exec_aggregate.golden

  # ─── Week 6: JOIN + GROUP BY ───
  - case_id: week06_join_inner
    week: week06
    sql_file: week06/week06_join_inner.sql
    expected_exit_code: 0
    oracle_mode: golden
    golden_file: week06/week06_join_inner.golden

  - case_id: week06_aggregate_group
    week: week06
    sql_file: week06/week06_aggregate_group.sql
    expected_exit_code: 0
    oracle_mode: golden
    golden_file: week06/week06_aggregate_group.golden

  - case_id: week06_join_three_tables
    week: week06
    sql_file: week06/week06_join_three_tables.sql
    expected_exit_code: 0
    oracle_mode: golden
    golden_file: week06/week06_join_three_tables.golden