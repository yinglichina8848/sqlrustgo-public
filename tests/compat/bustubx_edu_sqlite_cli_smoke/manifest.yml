# V312-57 BustubX-EDU sqlite3-like CLI smoke fixtures
#
# Lightweight, golden-file-free complement to
# tests/compat/bustubx_edu_sqlite_cli/ (develop's golden-based suite).
# Each fixture is a self-asserting shell script that runs `sqlrustgo
# sqlite --batch <db> ...` and grep-asserts exit code + stdout
# substring. No .golden / .sql pair to maintain; runs anywhere the
# `sqlrustgo` binary is built.
#
# Gate runner: scripts/gate/check_bustubx_edu_cli_smoke_v312.sh

version: "v3.12.0"
source: "V312-57_SQLITE_STYLE_EDU_CLI_PLAN.md + develop HEAD #4373"
prerequisite: "build sqlrustgo-cli (cargo build -p sqlrustgo-cli --all-features)"
env:
  SQLRUSTGO_BIN: "absolute path to the built sqlrustgo binary"

fixtures:
  - week: "01"
    name: "01_help"
    path: "week01/01_help.sh"
    expect_exit_code: 0
    expect_stdout_contains: ["sqlite", "--mode", "--headers", "--batch", "--cmd", "--continue-on-error"]
    notes: "`sqlrustgo sqlite --help` 返回 0 + 含 sqlite + 5 个核心 flag (REPL .help 在 develop 是 no-op, 改用 --help flag)"
  - week: "01"
    name: "02_select_one"
    path: "week01/02_select_one.sh"
    expect_exit_code: 0
    expect_stdout_contains: ["^1$"]
    notes: "sqlrustgo sqlite <db> --cmd 'SELECT 1;' 返回 1"
  - week: "01"
    name: "03_stdin_script"
    path: "week01/03_stdin_script.sh"
    expect_exit_code: 0
    expect_stdout_contains: ["Hello"]
    notes: "cat script.sql | sqlrustgo sqlite --batch <db> 多语句批处理"
  - week: "01"
    name: "04_exit_code_success"
    path: "week01/04_exit_code_success.sh"
    expect_exit_code: 0
    notes: "正常查询退出码 = 0"
  - week: "01"
    name: "05_exit_code_parse_error"
    path: "week01/05_exit_code_parse_error.sh"
    expect_exit_code: 1
    expect_stderr_contains: ["Error:"]
    expect_stderr_excludes: ["panic"]
    notes: "parse 错误退出码 = 1 + Error: 前缀 (兼容 'sqlrustgo:error:')"

  - week: "02"
    name: "01_create_insert_select"
    path: "week02/01_create_insert_select.sh"
    expect_exit_code: 0
    expect_stdout_contains: ["Alice", "Bob"]
    notes: "CREATE TABLE + INSERT + SELECT (Alice + Bob 在 stdout)"
  - week: "02"
    name: "02_csv_output"
    path: "week02/02_csv_output.sh"
    expect_exit_code: 0
    expect_stdout_contains: ["id,name", "Alice"]
    notes: "--mode csv 输出含 header 'id,name' + Alice 值"
  - week: "02"
    name: "03_list_output"
    path: "week02/03_list_output.sh"
    expect_exit_code: 0
    expect_stdout_contains: ["2|Bob"]
    notes: "--mode list 输出管道分隔 '2|Bob'"

  - week: "03"
    name: "01_single_path_db"
    path: "week03/01_single_path_db.sh"
    expect_exit_code: 0
    expect_stdout_contains: ["42", "99", "7"]
    notes: "rel / abs / nested DB path 三种都能正常打开 (sentinel per variant: 42 / 99 / 7)"
  - week: "03"
    name: "02_cross_process_persistence"
    path: "week03/02_cross_process_persistence.sh"
    expect_exit_code: 0
    expect_stdout_contains: ["Alice"]
    notes: "进程 1 写入 → 进程 2 读取 (fresh pid)"
  - week: "03"
    name: "03_tables_meta"
    path: "week03/03_tables_meta.sh"
    expect_exit_code: 0
    expect_stdout_contains: ["users", "orders"]
    notes: ".tables (REPL) 列出 users + orders"

  - week: "04"
    name: "01_schema_meta"
    path: "week04/01_schema_meta.sh"
    expect_exit_code: 0
    expect_stdout_contains: ["users"]
    notes: ".schema users (REPL)"
  - week: "04"
    name: "02_stable_error_codes"
    path: "week04/02_stable_error_codes.sh"
    expect_exit_code: 1
    expect_stderr_contains: ["Error:"]
    expect_stderr_excludes: ["panic"]
    notes: "runtime 错误 (列不存在) exit 1 + stable Error: 前缀"
  - week: "04"
    name: "03_continue_on_error"
    path: "week04/03_continue_on_error.sh"
    expect_exit_code: 0
    expect_stdout_contains: ["1", "3"]
    notes: "--continue-on-error 让 3rd INSERT (在 parse 错误后) 仍执行"

  - week: "05"
    name: "01_explain_select_basic"
    path: "week05/01_explain_select_basic.sh"
    expect_exit_code: 0
    expect_stdout_contains: ["SeqScan", "Projection", "Filter"]
    notes: "EXPLAIN SELECT * 输出查询计划节点 (SeqScan/Projection/Filter)"
  - week: "05"
    name: "02_explain_select_filter"
    path: "week05/02_explain_select_filter.sh"
    expect_exit_code: 0
    expect_stdout_contains: ["Filter"]
    notes: "EXPLAIN SELECT ... WHERE 包含 Filter 节点"
  - week: "05"
    name: "03_explain_select_join"
    path: "week05/03_explain_select_join.sh"
    expect_exit_code: 0
    expect_stdout_contains: ["NestedLoopJoin", "HashJoin", "MergeJoin"]
    notes: "EXPLAIN SELECT ... JOIN 输出连接节点"
  - week: "05"
    name: "04_explain_unsupported"
    path: "week05/04_explain_unsupported.sh"
    expect_exit_code: 1
    expect_stderr_contains: ["Error:"]
    expect_stderr_excludes: ["panic"]
    notes: "EXPLAIN INSERT 触发稳定 Error: 前缀, 不 panic"

  - week: "06"
    name: "01_join_inner"
    path: "week06/01_join_inner.sh"
    expect_exit_code: 0
    notes: "INNER JOIN 2 表 row multiset 匹配 sqlite3 oracle"
  - week: "06"
    name: "02_aggregate_sum"
    path: "week06/02_aggregate_sum.sh"
    expect_exit_code: 0
    notes: "SUM(col) GROUP BY row multiset 匹配 sqlite3 oracle"
  - week: "06"
    name: "03_aggregate_count"
    path: "week06/03_aggregate_count.sh"
    expect_exit_code: 0
    notes: "COUNT(*) WHERE scalar 匹配 sqlite3 oracle"
  - week: "06"
    name: "04_group_by_order"
    path: "week06/04_group_by_order.sh"
    expect_exit_code: 0
    notes: "GROUP BY + ORDER BY ASC row multiset 匹配 sqlite3 oracle (DESC 路径有 V312-58 已知 bug)"
  - week: "06"
    name: "05_multi_join"
    path: "week06/05_multi_join.sh"
    expect_exit_code: 0
    notes: "3-way JOIN + ORDER BY row multiset 匹配 sqlite3 oracle"

closed_weeks:
  - week: "05"
    completed_in: "feat/v312-57-smoke-w5w6"
    notes: "EXPLAIN SELECT/EXPLAIN-JOIN smoke + EXPLAIN-INSERT 错误路径 (develop 不支持 EXPLAIN TABLE / EXPLAIN ANALYZE)"
  - week: "06"
    completed_in: "feat/v312-57-smoke-w5w6"
    notes: "JOIN/aggregate/GROUP-BY smoke + sqlite3 oracle 多集比对 (lib/sqlite_oracle.sh)"

deferred_weeks: []