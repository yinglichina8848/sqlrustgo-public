[package]
name = "sqlancer"
version = "0.1.0"
edition = "2021"
license.workspace = true

[lib]
path = "src/lib.rs"

[[bin]]
name = "sqlancer"
path = "src/bin/sqlancer.rs"

[dependencies]
rand = "0.8"
thiserror = "1.0"
log = "0.4"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sqlrustgo-parser = { path = "../parser" }

[dev-dependencies]
sqlrustgo = { path = "../.." }
sqlrustgo-parser = { path = "../parser" }
sqlrustgo-storage = { path = "../storage" }
serde_json = "1.0"
tempfile = "3.8"
