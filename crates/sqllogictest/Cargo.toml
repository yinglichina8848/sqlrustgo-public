[package]
name = "sqllogictest"
version = "0.1.0"
edition = "2021"
description = "SQLLogicTest runner for sqlrustgo — integrates SQLite SLT test suite"
license = "MIT"

[[bin]]
name = "sqlrustgo-sqllogictest"
path = "src/main.rs"

[dependencies]
regex = "1"
lazy_static = "1.4"
thiserror = "1"
anyhow = "1"
walkdir = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
parking_lot = "0.12"

# Workspace crate dependencies (no rusqlite — SQLite adapter needs
# libsqlite3-sys which requires a system SQLite install.
# To enable SQLite reference: cargo build -p sqllogictest --features sqlite
# and install SQLite dev headers.)
# Root crate (ExecutionEngine, MemoryStorage, etc.)
sqlrustgo = { path = "../.." }

# Workspace sub-crate dependencies
sqlrustgo-executor = { path = "../executor" }
sqlrustgo-parser = { path = "../parser" }
sqlrustgo-storage = { path = "../storage" }
sqlrustgo-types = { path = "../types" }

[dev-dependencies]
tempfile = "3"
