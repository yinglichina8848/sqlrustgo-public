[package]
name = "sqlrustgo-soak"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
description = "SQLRustGo SOAK test runner — real SQL stability testing with exec, repl, and soak subcommands"

[dependencies]
clap = { version = "4.0", features = ["derive"] }
sha1 = "0.11"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rustyline = "14.0"
chrono = { version = "0.4", default-features = false, features = ["clock", "std"] }
anyhow = "1.0"
thiserror = "2.0"

[lib]
name = "sqlrustgo_soak"
path = "src/lib.rs"

[[bin]]
name = "sqlrustgo-soak"
path = "src/main.rs"
