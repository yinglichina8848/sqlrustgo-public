[package]
name = "sqlrustgo-executor"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
sqlrustgo-common.workspace = true
sqlrustgo-types.workspace = true
sqlrustgo_gis = { path = "../gis" }
sqlrustgo-parser.workspace = true
regex.workspace = true
sqlrustgo-planner.workspace = true
sqlrustgo-storage.workspace = true
sqlrustgo-catalog.workspace = true
sqlrustgo-spill = { path = "../spill" }
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
parking_lot.workspace = true
# v4.1.0 Phase A: work-stealing scheduler primitives
crossbeam-deque.workspace = true
crossbeam-utils.workspace = true
tracing.workspace = true
reqwest = { version = "0.12", features = ["blocking", "json"] }
md5 = "0.8"
sha1 = "0.10"
sha2 = "0.10"

# v3.10.0 Issue #3703: intra-query parallel executor (scan/join/agg)
# Enabling this feature pulls in rayon and activates the parallel
# pipeline path. Default (feature off) = sequential, zero regression.
# See openspec/changes/issue-3703-intra-query-parallel-executor/.
rayon.workspace = true

[features]
# Parallel intra-query executor (Issue #3703).
# When enabled, the `parallel_executor` and `parallel_vector_executor`
# modules are activated and `LocalExecutor::execute_select_parallel`
# is wired into the production path. N>1 takes effect at runtime when
# the engine is built with `set_parallel_degree(N) > 1` (typically
# driven by `--executor-parallelism=N` CLI flag).
default = []
parallel-executor = []
# SIMD batch filter evaluation (Phase 5)
# Experimental - uses portable SIMD-like operations
simd = []
[dev-dependencies]
tempfile.workspace = true
sqlrustgo = { path = "../.." }
