[package]
name = "sqlrustgo-network"
version = "0.1.0"
edition = "2021"
license.workspace = true

[dependencies]
tonic = "0.12"
prost = "0.14"
tokio = { version = "1", features = ["full"] }
tower = "0.5"
serde = { version = "1", features = ["derive"] }
anyhow = "1"

[dev-dependencies]
prost = "0.14"

[build-dependencies]
tonic-build = "0.12"
http-body-util = "0.1"
