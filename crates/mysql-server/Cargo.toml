[package]
name = "sqlrustgo-mysql-server"
version = "0.1.0"
edition = "2021"

[dependencies]
sqlrustgo = { path = "../.." }
sqlrustgo-catalog = { path = "../catalog" }
sqlrustgo-parser = { path = "../parser" }
sqlrustgo-planner = { path = "../planner" }
sqlrustgo-executor = { path = "../executor" }
sqlrustgo-storage = { path = "../storage" }
sqlrustgo-types = { path = "../types" }
sqlrustgo-common = { path = "../common" }
sqlrustgo-tools = { path = "../tools" }
query-stats = { path = "../query-stats" }
byteorder = "1"
thiserror = "1"
parking_lot.workspace = true
crossbeam-channel = "0.5"
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
rustls = "0.23"
rcgen = "0.13"
flate2 = "1.0"
rand = "0.8"
sha1 = "0.10"
scopeguard = "1"
[lib]
name = "sqlrustgo_mysql_server"
path = "src/lib.rs"

[[bin]]
name = "sqlrustgo-mysql-server"
path = "src/main.rs"

[dev-dependencies]
sqlrustgo-mysql-client = { path = "../mysql-client" }
query-stats = { path = "../query-stats" }
tempfile = "3"
