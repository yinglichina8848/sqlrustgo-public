[package]
name = "sqlrustgo-storage"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[dependencies]
sqlrustgo-common.workspace = true
regex.workspace = true
sqlrustgo-types.workspace = true
sqlrustgo-parser.workspace = true
serde.workspace = true
serde_json.workspace = true
thiserror.workspace = true
log.workspace = true
async-trait.workspace = true
miniz_oxide.workspace = true
parking_lot.workspace = true
crc32c = "0.6"

[dev-dependencies]
sqlrustgo = { path = "../../" }
sqlrustgo-wal-verification = { path = "../wal-verification" }
tempfile.workspace = true
criterion = "0.8"
# #5515: the `fault_injection` module is gated behind
# `#[cfg(any(test, feature = "fault-injection"))]`. An **integration test is
# its own crate**, so `cfg(test)` does not apply to it — the module was
# compiled out and every integration test that imports it failed to compile:
#
#     error[E0432]: unresolved import `sqlrustgo_storage::fault_injection`
#        --> crates/storage/tests/fault_coordination.rs:36:24
#     note: found an item that was configured out
#
# Affected targets: `fault_coordination`, `crash_commit_fsync_b1`,
# `crash_wal_index_b1`, `a06_failpoint_reachability`.
#
# A self dev-dependency turns the feature on **only while the test targets
# are being built** (Cargo unifies the features of the package with those of
# its dev-dependency); a production `cargo build` keeps the feature off, so
# the hooks stay out of the shipped binary.
sqlrustgo-storage = { path = ".", features = ["fault-injection"] }

[features]
default = []
# B-1 (#5177): enables fault-injection hooks. Integration tests compile the
# library WITHOUT cfg(test), so a cfg(test) hook would silently vanish and
# the crash tests would hang waiting for a signal. OFF in production.
fault-injection = []
bin_storage_default = []
v313_3_profile = []   # V313.3 profiling experiments; test-only hooks; OFF by default

[[bench]]
name = "storage_benchmark"
harness = false

[[test]]
name = "memory_in_db_5057"
path = "tests/memory_in_db_5057.rs"

[[test]]
name = "memory_in_db_full_5057"
path = "tests/memory_in_db_full_5057.rs"

[[test]]
name = "file_scan_in_db_5057"
path = "tests/file_scan_in_db_5057.rs"

[[test]]
name = "memory_list_views_5433"
path = "tests/memory_list_views_5433.rs"

[[test]]
name = "memory_set_column_default_4154"
path = "tests/memory_set_column_default_4154.rs"
