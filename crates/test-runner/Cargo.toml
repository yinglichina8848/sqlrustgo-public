[package]
name = "test-runner"
version = "0.1.0"
edition = "2021"

[lib]
path = "src/lib.rs"

[[bin]]
name = "test-runner"
path = "src/bin/test-runner.rs"

[dependencies]
parking_lot = "0.12"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
chrono = { version = "0.4", features = ["serde"] }
tokio = { version = "1", features = ["process", "rt-multi-thread", "macros", "io-util", "sync", "time"] }
thiserror = "1.0"
num_cpus = "1.16"
test-registry = { path = "../test-registry" }
