# Test-runner manifest — 供 scripts/gate/check_anti_fabrication.sh 的
# CHECK 1.5 (V312-24 test infra artifacts) 使用。
#
# 每个 [[test]] 指定一个测试二进制（cargo test --release --no-run 产出，
# 路径通常为 target/release/<name>-<hash>）+ 传给它的参数。
# binary 路径相对仓库根解析。
#
# 字段含义见 `crates/test-registry/src/lib.rs` 的 `ManagedTest`。

[[test]]
name = "storage-lib"
binary = "target/release/sqlrustgo_storage"
args = ["--test-threads=1"]
timeout_ms = 900000
priority = "P1"
category = "Unit"

[[test]]
name = "tools-lib"
binary = "target/release/sqlrustgo_tools"
args = ["--test-threads=1"]
timeout_ms = 300000
priority = "P2"
category = "Unit"

[[test]]
name = "executor"
binary = "target/release/sqlrustgo_executor"
args = ["--test-threads=1"]
timeout_ms = 300000
priority = "P2"
category = "Unit"

[[test]]
name = "isolation-contract"
binary = "target/release/sqlrustgo_storage"
args = ["--test", "tx_isolation_and_escape_hatch_test", "--test-threads=1"]
timeout_ms = 120000
priority = "P1"
category = "Integration"

[[test]]
name = "scan-with-filter-contract"
binary = "target/release/sqlrustgo_storage"
args = ["--test", "scan_with_filter_contract_test", "--test-threads=1"]
timeout_ms = 120000
priority = "P1"
category = "Integration"
