        production_entries: [PE-01, PE-03, PE-04, PE-05]
        required_modules: [src/engine_select.rs, crates/parser, crates/planner, crates/catalog]
        observable_semantics: "row results, column names/types, row counts, error messages"
        work_packages: [A03, A04]
      - id: CD-01-C2
        statement: "TPC-H 22-query subset (16 full, 6 partial) produces correct results"
        source: "README.md §2 (DS-01)"
        source_freshness: stale
        production_entries: [PE-01, PE-03]
        required_modules: [src/engine_select.rs]
        observable_semantics: "TPC-H query result sets vs reference"
        work_packages: [A04]
      - id: CD-01-C3
        statement: "column metadata (name, type, NULL-ability) is correct in results"
        source: "RELEASE_NOTES.md SQL WP-A column-type metadata (DS-03); CORE_PATH_INVENTORY.md (DS-04)"
        source_freshness: fresh
        production_entries: [PE-01, PE-03, PE-04]
        required_modules: [src/execution_engine_methods.rs, crates/catalog]
