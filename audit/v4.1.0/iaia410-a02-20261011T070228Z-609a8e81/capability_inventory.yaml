      - id: CD-03-C1
        statement: "planner/optimizer produces the declared execution plans"
        source: "README.md (DS-01); CORE_PATH_INVENTORY.md F3 (DS-04)"
        source_freshness: stale+fresh
        production_entries: [PE-01, PE-03]   # via execution engine, not a direct user flag
        required_modules: [crates/planner/src/planner.rs, crates/planner/src/physical_plan.rs, crates/optimizer]
        observable_semantics: "plan structure (scan/join/order ops) reachable from a real query"
        work_packages: [A03]
      - id: CD-03-C2
        statement: "UnifiedCostModel cost-based optimization is production-reachable"
        source: "CORE_PATH_INVENTORY.md (DS-04)"
        source_freshness: fresh
        production_entries: [PE-01, PE-03]   # via src/engine_builder.rs (7 construction sites)
        required_modules: [crates/optimizer/src/unified_cost.rs, src/engine_builder.rs]
        observable_semantics: "cost model invoked during planning; stats-driven choices"
        work_packages: [A03, A05]
        note: >-
          UnifiedCostModel::default_model(0,0) constructed at src/engine_builder.rs
