[package]
name = "sqlrustgo-gate"
version = "0.1.0"
edition = "2021"
description = "SQLRustGo Release Gate Engine — machine-executable governance for Alpha/Beta/RC gates"

[[bin]]
name = "sqlrustgo-gate"
path = "src/main.rs"

[dependencies]
clap = { version = "4.5", features = ["derive"] }
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = "0.4"
thiserror = "1"