[package]
name = "sqlrustgo-gate"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "graph-gate"
path = "src/bin/graph-gate.rs"

[[bin]]
name = "graph-ingest"
path = "src/bin/graph-ingest.rs"

[dependencies]
evidence-graph = { path = "../../crates/evidence-graph" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
rusqlite = { version = "0.39", features = ["bundled"] }
anyhow = "1.0"
thiserror = "1.0"
chrono = { version = "0.4", features = ["serde"] }
dirs = "5.0"

[profile.release]
opt-level = 3