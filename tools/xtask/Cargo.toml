[package]
name = "xtask"
version = "0.1.0"
edition = "2021"

[dependencies]
walkdir = "2.0"
serde = { version = "1.0", features = ["derive"] }
serde_yaml = "0.9"
toml = "0.8"
regex = "1.0"
ignore = "0.4"

[[bin]]
name = "dead-modules"
path = "src/dead_modules.rs"

[[bin]]
name = "architecture-check"
path = "src/architecture_check.rs"