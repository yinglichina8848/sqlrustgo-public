[package]
name = "graph-cli"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "gate"
path = "src/main.rs"

[[bin]]
name = "ingest"
path = "src/ingest.rs"

[dependencies]
evidence-graph = { path = "../../crates/evidence-graph" }
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
anyhow = "1.0"
dirs = "5.0"
chrono = { version = "0.4", features = ["serde"] }

[profile.release]
opt-level = 3
