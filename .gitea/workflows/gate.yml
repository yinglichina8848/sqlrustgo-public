name: Evidence Graph Gate v4.1

on:
  push:
    branches:
      - develop
      - main
      - develop/v3.7.0
      - develop/v3.8.0
      - develop/v4.0.0
      - develop/v4.1.0
      - "develop/v4.*"
  pull_request:
    branches:
      - develop
      - main
      - develop/v4.0.0
      - develop/v4.1.0
      - "develop/v4.*"

env:
  CARGO_TERM_COLOR: always

jobs:
  evidence-graph-gate:
    runs-on: [hp-z6g4]
    steps:
      - name: Checkout
        run: |
          REPO="openclaw/sqlrustgo"
          SHA="${GITHUB_SHA:-${GITEA_SHA:-$(git rev-parse HEAD)}}"
          git clone --depth=1 "http://192.168.0.252:3000/$REPO" repo
          cd repo
          if [ -n "$SHA" ] && [ "$SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --depth=1 origin "$SHA" 2>/dev/null || true
            git checkout "$SHA" 2>/dev/null || git checkout HEAD
          else
            git checkout HEAD
          fi

      - name: Build graph-cli
        run: |
          cd repo
          # #5026: `graph-cli` (and its `evidence-graph` dependency) live
          # only under archive/v3.11/archived-crates/, which is not a
          # workspace member. `cargo build -p graph-cli` therefore always
          # failed with the opaque
          #   error: package ID specification `graph-cli` did not match
          #           any packages
          # Check for the package up front so the failure names the real
          # cause instead. Re-wiring this job requires moving the tool
          # back into the workspace — tracked separately.
          if ! cargo metadata --no-deps --format-version 1 2>/dev/null \
               | grep -q '"name":"graph-cli"'; then
            echo "::error::package 'graph-cli' is not a workspace member."
            echo "::error::It exists only at archive/v3.11/archived-crates/graph-cli"
            echo "::error::(v3.11+ never wired it in), so the evidence-graph"
            echo "::error::toolchain this job needs is absent from the tree."
            echo "::error::See the issue tracking re-wiring before trusting this gate."
            exit 1
          fi
          cargo build -p graph-cli --release

      - name: Initialize Evidence Graph
        run: |
          cd repo
          DB="/tmp/evidence-$(date +%s).db"
          echo "DB_PATH=$DB" >> $GITHUB_ENV
          ./target/release/ingest status --db "$DB" || true

      - name: Ingest Commit Event
        run: |
          cd repo
          SHA="${GITEA_SHA:0:40}"
          ./target/release/ingest commit "$SHA" "ci-system" "CI ingestion" --db "$DB_PATH"

      - name: Ingest CI Event
        run: |
          cd repo
          SHA_SHORT="${GITEA_SHA:0:8}"
          SHA_FULL="${GITEA_SHA:0:40}"
          RUN_ID="run_${GITEA_RUN_ID:-$SHA_SHORT}"
          ./target/release/ingest ci "$RUN_ID" "$SHA_FULL" PASS --db "$DB_PATH"

      - name: Ingest Artifact
        run: |
          cd repo
          RUN_ID="run_${GITEA_RUN_ID:-$(date +%s)}"
          ./target/release/ingest artifact "$RUN_ID" "$RUN_ID" "binary" "sha256-placeholder" --db "$DB_PATH" || true

      - name: Link Evidence Chain
        run: |
          cd repo
          SHA="${GITEA_SHA:0:8}"
          RUN_ID="run_${GITEA_RUN_ID:-$(date +%s)}"
          # Only link if we have a valid SHA
          if [ -n "$SHA" ] && [ "$SHA" != "0000000" ]; then
            ./target/release/ingest link "gate_test_$SHA" IMPLEMENTED_BY "commit_$SHA" --db "$DB_PATH" || true
            ./target/release/ingest link "ci_$RUN_ID" PRODUCES "artifact_$RUN_ID" --db "$DB_PATH" || true
          fi

      - name: Ingest Test Result
        run: |
          cd repo
          ./target/release/ingest task "gate_test_${GITEA_SHA:0:8}" "gate integration test" --db "$DB_PATH" || true

      - name: Graph Gate Evaluate
        id: gate
        run: |
          cd repo
          RESULT=$(./target/release/gate evaluate "gate_test_${GITEA_SHA:0:8}" --db "$DB_PATH" 2>&1)
          echo "Gate result: $RESULT"
          echo "$RESULT" | grep -q '"result":"PASS"' && GATE_PASS=1 || GATE_PASS=0
          echo "GATE_PASS=$GATE_PASS" >> $GITHUB_ENV
          echo "$RESULT"

      - name: Publish Evidence Graph Report
        if: always()
        run: |
          cd repo
          ./target/release/ingest status --db "$DB_PATH" 2>/dev/null || echo "Graph stats unavailable"

      - name: Gate Decision
        run: |
          if [ "$GATE_PASS" = "1" ]; then
            echo "✅ Evidence Graph Gate: PASS"
            exit 0
          else
            echo "❌ Evidence Graph Gate: FAIL"
            exit 1
          fi

  # Parallel: legacy shell gate (for comparison)
  legacy-gate:
    runs-on: [hp-z6g4]
    steps:
      - name: Checkout
        run: |
          REPO="openclaw/sqlrustgo"
          SHA="${GITHUB_SHA:-${GITEA_SHA:-$(git rev-parse HEAD)}}"
          git clone --depth=1 "http://192.168.0.252:3000/$REPO" repo
          cd repo
          if [ -n "$SHA" ] && [ "$SHA" != "0000000000000000000000000000000000000000" ]; then
            git fetch --depth=1 origin "$SHA" 2>/dev/null || true
            git checkout "$SHA" 2>/dev/null || git checkout HEAD
          else
            git checkout HEAD
          fi

      - name: Run Legacy Gate
        run: |
          cd repo
          # #5026: the script lives under scripts/gate/legacy/, not
          # scripts/gate/. The wrong path made `chmod` fail, and because
          # the runner uses `bash -e -o pipefail` that exited the step
          # before the `|| true` below could ever apply — so the job
          # reported a failure that had nothing to do with the gate.
          GATE="scripts/gate/legacy/check_alpha.sh"
          if [ ! -f "$GATE" ]; then
            echo "::error::legacy gate script not found at $GATE"
            exit 1
          fi
          chmod +x "$GATE"
          bash "$GATE" 2>&1 || true
