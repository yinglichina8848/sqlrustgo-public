name: Evidence Graph Gate v4.1

on:
  push:
    branches:
      - develop
      - main
      - develop/v3.7.0
      - develop/v3.8.0
      - develop/v4.0.0
      - develop/v4.1.0
      - "develop/v4.*"
  pull_request:
    branches:
      - develop
      - main
      - develop/v4.0.0
      - develop/v4.1.0
      - "develop/v4.*"

concurrency:
  # #5550 — this workflow has its **own** group, separate from `ci.yml`'s
  # `sqlrustgo-ci-pipeline`.
  #
  # Reason (measured on Gitea 28.1.0, 2026-10-23): when a new run joins a
  # concurrency group, Gitea **cancels the runs in that group that have not
  # started yet** — `cancel-in-progress: false` only protects the one that
  # is already running. Two workflows sharing one group therefore kill
  # each other: on the same PR, `ci.yml` (run 8997) and `gate.yml`
  # (run 8998) were created in the same second with the same group, and
  # 8997 was cancelled in that same second.
  #
  # ⇒ one group **per workflow file**. Cross-branch serialization (the
  # thing that actually protects the host) is preserved because each
  # workflow still has a single, fixed group.
  #
  # The measurement behind the whole change: four concurrent runs drove the
  # host to load average 147.8 and a kernel panic (2026-10-22 22:57:32
  # CST). See the `concurrency` block in `.gitea/workflows/ci.yml`.
  # 同样的 Blocked 连累缺陷（见 ci.yml 的注释）⇒ 同样换新组名解开。
  group: sqlrustgo-gate-v2
  cancel-in-progress: false

env:
  CARGO_TERM_COLOR: always
  # #5451 / #5533 —— crates.io 是 CI 的**第三个**外部依赖（另两个是
  # github.com 与 index.crates.io 背后的同一片网络）。
  #
  # 实测（CI run 8348，根包 `test` job 的 Build 步骤）：
  #
  #   error: failed to get `chrono` as a dependency of package
  #          `evidence-graph v0.1.0`
  #   Caused by: failed to download from
  #              `https://index.crates.io/ch/ro/chrono`
  #   Caused by: [28] Timeout was reached (Operation too slow.
  #              Less than 10 bytes/sec transferred the last 30 seconds)
  #
  # 锁文件里的 crate 必须取到，下载本身不是可选项；但**网络抖动**不该
  # 让整个 job 死掉。cargo 自带重试，只是默认次数太少、低速阈值太高。
  # 这里只调**重试与超时**，不动 CARGO_HOME / RUSTUP_HOME（见上面的 NOTE）。
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_LOW_SPEED_LIMIT: "1"
  # #5550 — same bound as `ci.yml`: cargo defaults to one rustc per core,
  # and the host has 80 cores shared by three concurrent CI jobs.
  CARGO_BUILD_JOBS: "16"

jobs:
  evidence-graph-gate:
    runs-on: [hp-z6g4]
    steps:
      - name: Checkout
        # #5448 / #5532 — the checkout is done against the **Gitea instance**
        # itself.  The runner used to download `actions/checkout` from GitHub
        # **once per job**, so a GitHub outage turned the whole pipeline red
        # for a reason that had nothing to do with this repository (observed:
        # `unexpected EOF`, `TLS handshake timeout`).
        #
        # The commit this run was created for is discovered from the remote
        # refs and then **verified**: a checkout that is not that commit is a
        # hard error, never a silent "some other tree was checked out".
        #
        # `scripts/gate/check_ci_checkout_consistency.sh` asserts that every
        # gated workflow embeds this exact body — one rule, one implementation.
        env:
          CI_CHECKOUT_DIR: "repo"
        run: |
          set -euo pipefail
          REPO_URL="${CI_REPO_URL:-http://192.168.0.252:3000/openclaw/sqlrustgo.git}"
          DEPTH="${CI_DEPTH:-1}"
          SHA="${GITHUB_SHA:-${GITEA_SHA:-}}"
          DIR="${CI_CHECKOUT_DIR:-.}"
          if [ -z "$SHA" ]; then
            echo "FATAL: neither GITHUB_SHA nor GITEA_SHA is set - refusing to guess which commit to check out" >&2
            exit 1
          fi
          mkdir -p "$DIR"
          cd "$DIR"
          git init -q -b main .
          git remote add origin "$REPO_URL"
          if [ "$DEPTH" = "0" ]; then
            git fetch --no-tags --prune --no-recurse-submodules origin "+$SHA"
          else
            git fetch --no-tags --prune --no-recurse-submodules --depth="$DEPTH" origin "+$SHA"
          fi
          git checkout -q FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "FATAL: checked out $(git rev-parse HEAD) but this run is for $SHA" >&2
            exit 1
          fi

      - name: Build graph-cli
        run: |
          cd repo
          # #5026: `graph-cli` and its `evidence-graph` dependency used to
          # live only under archive/, outside the workspace, so
          # `cargo build -p graph-cli` failed with
          #   error: package ID specification `graph-cli` did not match
          #           any packages
          # Both crates are now workspace members again. The check stays so
          # that losing them again produces a named cause rather than an
          # opaque package-ID error.
          if ! cargo metadata --no-deps --format-version 1 2>/dev/null \
               | grep -q '"name":"graph-cli"'; then
            echo "::error::package 'graph-cli' is not a workspace member."
            echo "::error::It was re-wired into the workspace in #5026;"
            echo "::error::if this fired, the crate was removed again."
            exit 1
          fi
          cargo build -p graph-cli --release

      - name: Initialize Evidence Graph
        run: |
          cd repo
          DB="/tmp/evidence-$(date +%s).db"
          # Resolve one identity up front. GITEA_SHA and GITEA_RUN_ID are absent
          # under act_runner, so a bare ${GITEA_SHA:0:8} silently yields "" and
          # every node id degenerates to a bare prefix ("commit_", "gate_test_").
          SHA="${GITHUB_SHA:-${GITEA_SHA:-}}"
          if [ -z "$SHA" ] || [ "${SHA//0/}" = "" ]; then
            SHA="$(git rev-parse HEAD)"
          fi
          SHA="${SHA:0:40}"
          SHA_SHORT="${SHA:0:8}"
          RUN_ID="run_${GITEA_RUN_ID:-$SHA_SHORT}"
          {
            echo "DB_PATH=$DB"
            echo "EV_SHA=$SHA"
            echo "EV_SHA_SHORT=$SHA_SHORT"
            echo "EV_RUN_ID=$RUN_ID"
          } >> $GITHUB_ENV
          echo "resolved SHA=$SHA RUN_ID=$RUN_ID"
          ./target/release/ingest status --db "$DB" || true

      - name: Ingest Commit Event
        run: |
          cd repo
          ./target/release/ingest commit "$EV_SHA" "ci-system" "CI ingestion" --db "$DB_PATH"

      - name: Verify the checked-out tree (real check → CI result)
        run: |
          cd repo
          # #5447: this job used to ingest the **literal** `PASS` as the CI
          # result and then read its verdict back out of the graph it had
          # just written — the job graded its own homework, and a green
          # `gate.yml` said nothing whatsoever about the tree.
          #
          # The result now comes from a real check of this checkout.
          # `check_path_casefold_conflict.sh` is pure shell and costs
          # milliseconds; it detects tracked paths that differ only by case,
          # which break checkout on case-insensitive volumes.
          if bash scripts/gate/check_path_casefold_conflict.sh; then
            EV_RESULT=PASS
          else
            EV_RESULT=FAIL
          fi
          echo "EV_RESULT=$EV_RESULT" >> $GITHUB_ENV
          echo "tree verification: $EV_RESULT"

      - name: Ingest CI Event
        run: |
          cd repo
          ./target/release/ingest ci "$EV_RUN_ID" "$EV_SHA" "$EV_RESULT" --db "$DB_PATH"

      - name: Ingest Artifact
        run: |
          cd repo
          # #5447: the artifact hash used to be the literal string
          # "sha256-placeholder". Use the real hash of the binary this job
          # actually built.
          ARTIFACT_SHA="$(sha256sum ./target/release/ingest 2>/dev/null | awk '{print $1}')"
          if [ -z "$ARTIFACT_SHA" ]; then
            ARTIFACT_SHA="$(shasum -a 256 ./target/release/ingest 2>/dev/null | awk '{print $1}')"
          fi
          ARTIFACT_SHA="${ARTIFACT_SHA:-unknown}"
          echo "artifact sha256=$ARTIFACT_SHA"
          ./target/release/ingest artifact "$EV_RUN_ID" "$EV_RUN_ID" "binary" "$ARTIFACT_SHA" --db "$DB_PATH"

      - name: Ingest Test Result
        run: |
          cd repo
          ./target/release/ingest task "gate_test_$EV_SHA_SHORT" "gate integration test" --db "$DB_PATH"

      - name: Link Evidence Chain
        run: |
          cd repo
          # Every node must exist before it is linked: `ingest link` resolves
          # both endpoints and fails with "Node not found" otherwise.
          ./target/release/ingest link "gate_test_$EV_SHA_SHORT" IMPLEMENTED_BY "commit_$EV_SHA_SHORT" --db "$DB_PATH"
          ./target/release/ingest link "commit_$EV_SHA_SHORT" VERIFIED_BY "ci_$EV_RUN_ID" --db "$DB_PATH"
          ./target/release/ingest link "ci_$EV_RUN_ID" PRODUCES "artifact_$EV_RUN_ID" --db "$DB_PATH"

      - name: Graph Gate Evaluate
        id: gate
        run: |
          cd repo
          RESULT=$(./target/release/gate evaluate "gate_test_$EV_SHA_SHORT" --db "$DB_PATH" 2>&1)
          echo "Gate result: $RESULT"
          # `gate evaluate` emits pretty-printed JSON, so the key is spaced:
          # `"result": "PASS"`. The previous '"result":"PASS"' pattern could
          # never match, which turned every PASS into a gate FAIL.
          echo "$RESULT" | grep -qE '"result"[[:space:]]*:[[:space:]]*"PASS"' && GATE_PASS=1 || GATE_PASS=0
          echo "GATE_PASS=$GATE_PASS" >> $GITHUB_ENV
          echo "$RESULT"

      - name: Publish Evidence Graph Report
        if: always()
        run: |
          cd repo
          ./target/release/ingest status --db "$DB_PATH" 2>/dev/null || echo "Graph stats unavailable"

      - name: Gate Decision
        run: |
          if [ "$GATE_PASS" = "1" ]; then
            echo "✅ Evidence Graph Gate: PASS"
            exit 0
          else
            echo "❌ Evidence Graph Gate: FAIL"
            exit 1
          fi

  # Parallel: the current version's Alpha gate
  legacy-gate:
    runs-on: [hp-z6g4]
    # #5447: this job used to run `scripts/gate/legacy/check_alpha.sh` — the
    # v2.9.0-era script — and then discard its exit code with `|| true`.
    # Two independent defects in one step: the green signal was unrelated to
    # the tree, and the script ran the **entire** test suite unbounded, which
    # is what pinned the single runner `hp-z6g4` for 2.5 h and queued every
    # other job behind it.
    #
    # `docs/governance/STAGE_CONFIG.yaml`'s ALPHA stage says explicitly:
    # "v2.9.0's check_alpha.sh is hardcoded with v2.9.0 paths and references
    # crates that no longer exist ... Each version provides its own
    # check_alpha_v{VER}.sh that references the version's own worktree paths
    # and gate set." This job now runs the current version's real, bounded
    # gate: `scripts/gate/check_alpha_v410.sh`.
    timeout-minutes: 45
    steps:
      - name: Checkout
        # #5448 / #5532 — the checkout is done against the **Gitea instance**
        # itself.  The runner used to download `actions/checkout` from GitHub
        # **once per job**, so a GitHub outage turned the whole pipeline red
        # for a reason that had nothing to do with this repository (observed:
        # `unexpected EOF`, `TLS handshake timeout`).
        #
        # The commit this run was created for is discovered from the remote
        # refs and then **verified**: a checkout that is not that commit is a
        # hard error, never a silent "some other tree was checked out".
        #
        # `scripts/gate/check_ci_checkout_consistency.sh` asserts that every
        # gated workflow embeds this exact body — one rule, one implementation.
        env:
          CI_CHECKOUT_DIR: "repo"
        run: |
          set -euo pipefail
          REPO_URL="${CI_REPO_URL:-http://192.168.0.252:3000/openclaw/sqlrustgo.git}"
          DEPTH="${CI_DEPTH:-1}"
          SHA="${GITHUB_SHA:-${GITEA_SHA:-}}"
          DIR="${CI_CHECKOUT_DIR:-.}"
          if [ -z "$SHA" ]; then
            echo "FATAL: neither GITHUB_SHA nor GITEA_SHA is set - refusing to guess which commit to check out" >&2
            exit 1
          fi
          mkdir -p "$DIR"
          cd "$DIR"
          git init -q -b main .
          git remote add origin "$REPO_URL"
          if [ "$DEPTH" = "0" ]; then
            git fetch --no-tags --prune --no-recurse-submodules origin "+$SHA"
          else
            git fetch --no-tags --prune --no-recurse-submodules --depth="$DEPTH" origin "+$SHA"
          fi
          git checkout -q FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "FATAL: checked out $(git rev-parse HEAD) but this run is for $SHA" >&2
            exit 1
          fi

      - name: Run the current version's Alpha gate
        run: |
          cd repo
          # #5026: the script lives under scripts/gate/, not
          # scripts/gate/legacy/ — the wrong path made `chmod` fail, and
          # because the runner uses `bash -e -o pipefail` that exited the
          # step before any `|| true` could ever apply — so the job
          # reported a failure that had nothing to do with the gate.
          #
          # #5446: the gate was hardcoded to `check_alpha_v410.sh`. On a
          # v4.0.0 checkout that runs the **v4.1.0** gate — the mirror
          # image of the postcheck defect (which ran the v3.8.0 gate on
          # v4.1.0). Both call sites now resolve the gate through the same
          # two scripts, so the naming rule has exactly one implementation.
          VER="$(bash scripts/gate/resolve_release_version.sh)"
          echo "release version: ${VER}"
          set +e
          GATE="$(bash scripts/gate/resolve_alpha_gate.sh "$VER")"
          RC=$?
          set -e
          if [ "$RC" -eq 3 ]; then
            # No gate script exists for this release line. That is a
            # configuration gap, not a pass: it is recorded as NOT-RUN with
            # a reason code rather than as a green result.
            echo "NOT-RUN: reason=ALPHA_GATE_NOT_FOUND (no check_alpha_v*.sh serves version ${VER})"
            exit 0
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::alpha gate resolution failed (rc=${RC})"
            exit "$RC"
          fi
          echo "alpha gate: ${GATE}"
          chmod +x "$GATE"
          # #5447: the exit code is no longer discarded. A gate that cannot
          # fail is not a gate.
          bash "$GATE"
