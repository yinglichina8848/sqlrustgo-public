name: Hermes Pipeline
run-name: ${{ gitea.ref_name }} - ${{ gitea.sha }}

on:
  push:
    branches:
      - develop/v2.8.0
      - develop/v3.8.0
      - develop/v3.10.0
      - develop/v3.11.0
      - develop/v3.12.0
      - beta/v2.8.0
      - ci/gitea-compat
      - ci/v3.8.0-*
  pull_request:
    branches:
      - develop/v3.7.0
      - develop/v3.8.0
      - develop/v3.9.0
      - develop/v3.10.0
      - develop/v3.11.0
      - develop/v3.12.0
      - beta/v2.8.0
      - ci/gitea-compat
      - ci/v3.8.0-*

env:
  CARGO_TERM_COLOR: always
  CARGO_HOME: ${{ runner.temp }}/.cargo
  RUSTUP_HOME: ${{ runner.temp }}/.rustup

# Combined lint + build: share one clone, build once
jobs:
  lint-build:
    runs-on: [hp-z6g4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Format check
        run: cargo fmt --check --all
      - name: Build
        run: cargo build --all-features

  test:
    runs-on: [hp-z6g4]
    needs: [lint-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build
        run: cargo build --all-features
      - name: Run tests
        run: |
          cargo test --all-features 2>&1 | tee test_report.log
      - name: Test summary
        if: always()
        run: |
          PASS=$(grep -c 'test result: ok' test_report.log 2>/dev/null || echo "0")
          FAIL=$(grep -c 'test result: FAILED' test_report.log 2>/dev/null || echo "0")
          echo "Tests: passed=$PASS failed=$FAIL"
          if [ "$FAIL" -gt 0 ]; then exit 1; fi
      - name: Gate G1 — TPC-H 22/22 baseline (issue #3186)
        if: github.event_name == 'pull_request' || contains(github.ref, 'develop/v3.9.0')
        run: |
          chmod +x scripts/gate/check_g1_tpch_baseline.sh
          bash scripts/gate/check_g1_tpch_baseline.sh 2>&1 | tee g1_report.log
        # NOTE: this step currently fails by design until the baseline hash in
        # tests/tpch_hashes_v380.json is filled in (see the OpenSpec change
        # g1-tpch-baseline). Once filled, this step is the single source of
        # truth for "did anything change in TPC-H output?".

  ga3-security-scan:
    # Issue #4532 — GA-3 SC-1 cargo audit: pre-install cargo-audit + pre-fetch
    # advisory DB. Without pre-install, `cargo audit` would take 4m46s to
    # compile cargo-audit from source on every CI run, and the advisory DB
    # fetch would fail in the hermes-runner env (no network access for
    # https://github.com/RustSec/advisory-db.git during postcheck). This
    # dedicated job gives SC-1 its own slot so it can `cargo install` once
    # and `cargo audit --json` to populate the advisory DB before running
    # check_security_scan_v312.sh.
    #
    # The advisory DB lives at $CARGO_HOME/advisory-db. On the self-hosted
    # hp-z6g4 runner, $CARGO_HOME = ${{ runner.temp }}/.cargo is ephemeral
    # (one-shot per job), so we re-fetch inside this job. cargo-audit itself
    # is installed with --locked (deterministic version pin).
    runs-on: [hp-z6g4]
    if: contains(github.ref, 'develop/v3.12.0') || contains(github.ref, 'ci/v3.12.0-')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Install cargo-audit (skip if cached on PATH)
        # 4m46s to compile from source on first run; cached in $CARGO_HOME
        # which lives in runner.temp so it gets re-installed each CI run,
        # but only once per job. --locked pins transitive deps to exactly
        # the versions in the lockfile.
        run: |
          set -euo pipefail
          # Ensure cargo is on PATH
          if ! command -v cargo >/dev/null 2>&1; then
            if [ -x "$HOME/.cargo/bin/cargo" ]; then
              export PATH="$HOME/.cargo/bin:$PATH"
            fi
          fi
          if cargo audit --version >/dev/null 2>&1; then
            echo "cargo-audit already installed: $(cargo audit --version)"
          else
            echo "Installing cargo-audit (4m46s first-time build)..."
            cargo install cargo-audit --locked --version 0.22.1
          fi
          cargo audit --version
      - name: Pre-fetch advisory DB
        # Runs `cargo audit --json > /dev/null` which triggers the advisory
        # DB clone + fetch into $CARGO_HOME/advisory-db. We don't care about
        # the audit result here — just want the DB populated so the next
        # step's `cargo audit` runs deterministic and offline-tolerant.
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME"
          # --no-fetch on a non-existent DB fails; deliberately omit it
          # so the first run clones the advisory DB.
          echo "Pre-fetching advisory DB to $CARGO_HOME/advisory-db..."
          cargo audit --json >/dev/null 2>&1 || true
          if [ -d "$CARGO_HOME/advisory-db" ]; then
            echo "advisory DB present: $(du -sh "$CARGO_HOME/advisory-db" | cut -f1)"
            cd "$CARGO_HOME/advisory-db"
            git log --oneline -1 || true
            cd -
          else
            echo "WARNING: advisory DB not populated (network may be restricted)"
          fi
      - name: Run GA-3 security scan
        # check_security_scan_v312.sh runs SC-1..SC-4 and writes
        # docs/releases/v3.12.0/evidence/v312-59/GA3_SECURITY_SCAN_REPORT.md
        # plus per-check artifacts. This is the SC-1 fresh-audit source of
        # truth for GA promotion — without this job, SC-1 falls back to
        # baseline-acknowledged PASS even on fresh advisories.
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_security_scan_v312.sh
          bash scripts/gate/check_security_scan_v312.sh 2>&1 | tee ga3_security_scan.log
          RC=${PIPESTATUS[0]}
          echo "GA-3 security scan exit=$RC"
          if [ "$RC" -ne 0 ]; then
            echo "GA-3 security scan FAILED — see ga3_security_scan.log"
            exit "$RC"
          fi
      - name: Upload GA-3 evidence
        if: always()
        run: |
          mkdir -p artifacts/ga3/v3.12.0
          cp docs/releases/v3.12.0/evidence/v312-59/GA3_SECURITY_SCAN_REPORT.md artifacts/ga3/v3.12.0/ 2>/dev/null || true
          cp docs/releases/v3.12.0/evidence/v312-59/cargo_audit_v312.json artifacts/ga3/v3.12.0/ 2>/dev/null || true
          cp docs/releases/v3.12.0/evidence/v312-59/cargo_audit_v312.txt artifacts/ga3/v3.12.0/ 2>/dev/null || true
          cp ga3_security_scan.log artifacts/ga3/v3.12.0/ 2>/dev/null || true
          ls -la artifacts/ga3/v3.12.0/

  test-soak-detach:
    # Issue #4595 — Regression guard for run_soak_loop.sh self-detach block
    # (P-1 fix from PR #4591 commit 66dac1aab2). Without this test, future
    # refactors of run_soak_loop.sh could silently regress the
    # setsid+nohup+disown protection, re-introducing the parent-shell reap
    # bug that killed sqlrustgo mid-SOAK (7h28m evidence salvage).
    #
    # Issue #4597 — Chaos drills unit test (T8). Verifies chaos_drills.sh
    # has all 4 drill functions, dispatcher subcommands, EUID root guards
    # for netem/clock drills, and SOAK_NO_MAIN guard on run_soak_loop.sh
    # (so chaos_drills can source functions without triggering main).
    #
    # This job runs the STATIC check only (~1s, no binary required). The
    # behavioral sub-test (SIGKILL parent + verify child survives) lives in
    # `bash scripts/soak/test_run_soak_loop_detach.sh --behavioral` and is
    # invoked manually on hp-z6g4 (too slow for PR CI gate). Same applies
    # to `bash scripts/soak/chaos_drills.sh smoke` (drill-1 SIGKILL+restart)
    # which requires the release binary (~5min build) and ~60s wall-clock.
    #
    # Branches: v3.12.0 line only (SOAK scripts are v3.12.0+). Fast enough
    # that we run on EVERY branch, not just v3.12.0 — but skip if branch is
    # develop/v3.11.x or earlier (the file may not even exist there).
    runs-on: [hp-z6g4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Verify scripts/soak/run_soak_loop.sh exists
        run: |
          if [[ ! -f scripts/soak/run_soak_loop.sh ]]; then
            echo "SKIP: scripts/soak/run_soak_loop.sh not present on this branch"
            exit 0
          fi
      - name: Run static detach regression check
        run: bash scripts/soak/test_run_soak_loop_detach.sh
      - name: Run static chaos drills regression check (#4597)
        run: bash scripts/soak/test_chaos_drills.sh

  postcheck:
    runs-on: [hp-z6g4]
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Version detection
        id: version
        run: |
          # Detect version from branch or VERSION file
          VERSION="v3.7.0"
          if git rev-parse --verify origin/develop/v3.8.0 &>/dev/null; then
            VERSION="v3.8.0"
          elif git rev-parse --verify origin/develop/v3.7.0 &>/dev/null; then
            VERSION="v3.7.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Gate L1 — Code Quality
        run: |
          chmod +x gate/gate.sh
          bash gate/gate.sh "${version}" 2>&1 | tee gate_report.log
      - name: Gate L1 — Coverage
        run: |
          bash scripts/gate/check_coverage.sh 2>&1 | tee coverage_report.log
      - name: Auto env:blocked (SPEC-021)
        run: |
          set -euo pipefail
          chmod +x scripts/gate/auto_env_blocker.sh
          bash scripts/gate/auto_env_blocker.sh v3.8.0 2>&1 | tee auto_env_block.log
      - name: Evidence Binding Check
        run: |
          set -euo pipefail
          mkdir -p gate/evidence_binding_out
          bash scripts/gate/check_evidence_binding.sh "${version}" "gate/evidence_binding_out/" 2>&1 | tee evidence_binding.log
      - name: Anti-Fabrication Check (AFP v3.8.0+) — FIX 2026-06-26 Hermes / pipefail
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_anti_fabrication.sh
          bash scripts/gate/check_anti_fabrication.sh 2>&1 | tee anti_fabrication.log
      - name: Doc Completeness Check (v3.8.0 mandatory docs) — FIX 2026-06-26 Hermes / pipefail
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_docs_consistency.sh
          bash scripts/gate/check_docs_consistency.sh 2>&1 | tee docs_consistency.log
      - name: Doc Completeness Check (dedicated, v3.8.0+) [Issue #2941 supplement] — FIX 2026-06-26 Hermes / pipefail
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_document_completeness.sh
          mkdir -p artifacts/gate/v3.8.0/document_completeness
          bash scripts/gate/check_document_completeness.sh v3.8.0 artifacts/gate/v3.8.0/document_completeness/ 2>&1 | tee document_completeness.log
      - name: Alpha Gate (SPEC-021)
        run: |
          set -euo pipefail
          mkdir -p artifacts/gate/v3.8.0
          bash scripts/gate/check_alpha_v380.sh 2>&1 | tee alpha_gate.log
      - name: RC/GA Gate — Unified 6-Dim (Issue #2882)
        run: |
          bash scripts/gate/check_rc_ga_gate.sh ga 2>&1 | tee rc_ga_gate.log
      - name: V312-19 Release Gates (Issue #3906) — SQL corpus + R2 + signoff freshness
        if: contains(github.ref, 'develop/v3.12.0') || contains(github.ref, 'ci/v3.12.0-')
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_v312_19_release_gates.sh
          bash scripts/gate/check_v312_19_release_gates.sh 2>&1 | tee v312_19_release_gates.log
          # V312-19 strict-close condition: artifacts must be present and fresh.
          # Drift (exit 2) is acceptable but tracked; fail (exit 1) blocks merge.
          RC_V312_19=$(cat v312_19_release_gates.log | tail -1 | grep -oE 'exit [0-9]+' | tail -1 | awk '{print $2}' || echo "0")
          if [ "$RC_V312_19" = "1" ]; then
            echo "V312-19 release gates FAILED (artifacts missing or stale) — blocking PR merge"
            exit 1
          fi
        run: |
          set -euo pipefail
          mkdir -p artifacts/audit/v3.8.0
          bash scripts/gate/audit_testing.sh v3.8.0 ga artifacts/audit/v3.8.0 2>&1 | tee audit_testing.log
      - name: "D9 Full Gate Verification (8 dim: D1-D8 + cross-version + test plan + PR template)"
        run: |
          set -euo pipefail
          bash scripts/gate/check_full_gate_verification.sh 2>&1 | tee full_gate_verification.log
      - name: 6 Meta-Gate Hard Block (P11-P16, FIX 2026-06-26 Hermes) — blocks PR merge
        if: always()
        run: |
          set -euo pipefail
          FAILED=0
          for g in check_gate_self_verification check_ignore_count \
                   check_test_count_monotonic check_drift_not_pass \
                   check_oracle_present check_gate_test_integrity; do
              echo "=== $g ==="
              chmod +x scripts/gate/$g.sh
              if bash scripts/gate/$g.sh 2>&1 | tail -10; then
                  echo "  ✅ PASS: $g"
              else
                  echo "  ❌ FAIL: $g (meta-gate hard block, P0 2026-06-26)"
                  FAILED=$((FAILED+1))
              fi
          done
          if [ $FAILED -gt 0 ]; then
              echo ""
              echo "=== META-GATE HARD BLOCK: $FAILED/6 meta-gate(s) FAILED ==="
              echo "=== PR cannot merge until meta-gate fix ==="
              exit 1
          fi
          echo "=== 6/6 META-GATES PASS ==="
      - name: Gate summary
        if: always()
        run: |
          GATE_FAIL=$(grep -c '\[FAIL\]' gate_report.log 2>/dev/null || echo "0")
          COVERAGE_FAIL=$(grep -c 'FAIL\|failed' coverage_report.log 2>/dev/null || echo "0")
          EVIDENCE_FAIL=$(grep -c 'FAIL\|failed\|error' evidence_binding.log 2>/dev/null || echo "0")
          AFP_FAIL=$(grep -c 'FAIL\|failed\|error' anti_fabrication.log 2>/dev/null || echo "0")
          DOCS_FAIL=$(grep -c 'FAIL\|failed\|error' docs_consistency.log 2>/dev/null || echo "0")
          ALPHA_FAIL=$(grep -c '❌ FAIL' alpha_gate.log 2>/dev/null || echo "0")
          RC_GA_FAIL=$(grep -c '❌ FAIL\|blocker' rc_ga_gate.log 2>/dev/null || echo "0")
          AUDIT_FAIL=$(grep -c 'RESULT: FAIL' audit_testing.log 2>/dev/null || echo "0")
          D9_FAIL=$(grep -c '❌ FAIL\|exit 1' full_gate_verification.log 2>/dev/null || echo "0")
          V312_19_FAIL=0
          if [ -f v312_19_release_gates.log ]; then
            V312_19_FAIL=$(grep -c 'V312-19 release gates FAILED\|blockers: [^0]' v312_19_release_gates.log 2>/dev/null || echo "0")
          fi
          echo "Gate: failed=$GATE_FAIL coverage=$COVERAGE_FAIL evidence=$EVIDENCE_FAIL alpha_gate=$ALPHA_FAIL rc_ga=$RC_GA_FAIL audit=$AUDIT_FAIL d9=$D9_FAIL v312_19=$V312_19_FAIL"
          if [ "$GATE_FAIL" -gt 0 ] || [ "$COVERAGE_FAIL" -gt 0 ] || [ "$EVIDENCE_FAIL" -gt 0 ] || [ "$AFP_FAIL" -gt 0 ] || [ "$DOCS_FAIL" -gt 0 ] || [ "$ALPHA_FAIL" -gt 0 ] || [ "$RC_GA_FAIL" -gt 0 ] || [ "$AUDIT_FAIL" -gt 0 ] || [ "$D9_FAIL" -gt 0 ] || [ "$V312_19_FAIL" -gt 0 ]; then
            echo "L1 gate failed (incl. AFP / doc completeness / evidence binding / alpha gate / rc-ga gate / audit_testing / D9 full gate / V312-19 release gates)"
            exit 1
