name: Hermes Pipeline
run-name: ${{ gitea.ref_name }} - ${{ gitea.sha }}

on:
  push:
    branches:
      - develop/v2.8.0
      - develop/v3.8.0
      - develop/v3.10.0
      - develop/v3.11.0
      - develop/v3.12.0
      - develop/v4.0.0
      - develop/v4.1.0
      - "develop/v4.*"
      - beta/v2.8.0
      - ci/gitea-compat
      - ci/v3.8.0-*
      - "ci/v4.*"
  pull_request:
    branches:
      - develop/v3.7.0
      - develop/v3.8.0
      - develop/v3.9.0
      - develop/v3.10.0
      - develop/v3.11.0
      - develop/v3.12.0
      - develop/v4.0.0
      - develop/v4.1.0
      - "develop/v4.*"
      - beta/v2.8.0
      - ci/gitea-compat
      - ci/v3.8.0-*
      - "ci/v4.*"

concurrency:
  # #5550 — **one CI run at a time for this workflow**, and **CI only counts
  # the newest run**.
  #
  # Why this has to be a repository-wide group and not a per-ref one:
  #
  # The CI container has **no cargo cache** (#5451 — still open), so every
  # job rebuilds the whole workspace from scratch: a `cargo build` of this
  # tree takes ~7m30s of *CPU-bound* compilation. The runner pool has three
  # `hp-z6g4` runners, so the server was compiling three workspaces
  # concurrently, each cargo defaulting to **all 80 cores** of the host —
  # 240 rustc processes on 80 cores.
  #
  # Measured on the host on 2026-10-22: four runs were pushed at once
  # (runs 8914–8921, four branches). The load average reached **147.8** and
  # the host **kernel-panicked** at 22:57:32 CST (kdump-tools wrote a
  # vmcore to /var/crash/202610222257). Every CI container died with the
  # host, so all nine jobs of those runs were reported as failed with no
  # test result at all — an infrastructure red, not a code red.
  #
  # ---- Gitea 28.1.0 的 concurrency 语义（与 GitHub 不同，两次实测） ----
  #
  # (1) **新 run 加入 group 时，会把同 group 里「尚未开始」的 run 取消掉**。
  #     实测：同一 PR 的两个 run 在同一秒创建、共用一个 group
  #     （8997=ci.yml / 8998=gate.yml）：
  #
  #         8997 | status=cancelled | started=0 | stopped=创建同秒
  #         8998 | status=blocked
  #
  #     ⇒ 两个 workflow **不能**共用一个 group，否则同一 PR 上必然有一个被
  #     取消，PR 上出现 cancelled 的 required check ⇒ 永远合不进去。
  #     所以本仓库按 **workflow 文件** 分组：`ci.yml` 一个组、`gate.yml`
  #     另一个组。跨分支的串行化（真正保护宿主机的那一条）仍然成立 ——
  #     每个 workflow 的 group 依然是**固定串**。
  #
  # (2) **卡死的 run 会永久占着并发组**。实测：一个 run 的 task 卡死在一台
  #     **远端** runner 上（`sqlrustgo-ci-01`，act_runner v0.5.0，日志停止
  #     增长、runner 心跳却正常），run 永远停在 Running，同组的后续 run
  #     全部卡在 Blocked；`POST …/cancel` 返回 409（库里已经是 cancelled，
  #     进程内状态却还是 running）。
  #
  #     ⇒ `cancel-in-progress: true`：**下一次推送**直接取消这个卡死的 run
  #     ⇒ 槽位立刻释放，不需要人工去动 Gitea 的库。
  #
  # 代价（明确接受）：往一个正在跑的分支上再推一次，前一次的 run 会被取消，
  # PR 上那个 check 显示 cancelled —— 但**最新**那次 run 会给出新的 check，
  # 而我们要的证据本来就必须绑定在**最终**那次 run 上。
  #
  # 并发上限本来是由 runner 池决定的（3 台 `hp-z6g4`），配合
  # `CARGO_BUILD_JOBS=16` ⇒ 最多 3 × 16 = 48 个 rustc 抢 80 核。
  #
  # ---- group 名的 `-v2` 后缀（实测绕过，不是设计） ----------------------
  #
  # Gitea 28.1.0 的 concurrency 实现还有一个更隐蔽的坑：
  # **一个卡在 Blocked 的 run 会连累它的后继** —— 后继加入同组时先取消
  # 前一个，自己却因为「组里还有没结束的 run」而被判为 Blocked。
  # 观测到的序列（`action_run` 表）：
  #
  #     8999 running(卡在远端 runner) → 9001 blocked → 9003 blocked
  #     → 9007 blocked → … 每一次新 run 都取消前一个、自己又被判 Blocked
  #
  # ⇒ **换一个全新的 group 名**才能解开（组里没有任何历史 run ⇒ 不会被判
  # Blocked）。这是对 Gitea 实现的绕过，语义不变：**同一个 workflow 的 run
  # 仍然一次只跑一个**。
  group: sqlrustgo-ci-pipeline-v2
  cancel-in-progress: true

# NOTE: do NOT override CARGO_HOME / RUSTUP_HOME here.
# `${{ runner.temp }}` is evaluated to the literal string `/tmp` by act_runner
# (the expression log shows `%!t(string=/tmp/.rustup)`), so these overrides
# pointed rustup at an empty toolchain store and every job on the
# rustup-based runner image died with:
#   error: rustup could not choose a version of cargo to run, because one
#   wasn't specified explicitly, and no default is configured.
# The runner images already ship a working default toolchain and registry
# cache under their own CARGO_HOME/RUSTUP_HOME; leaving those intact is what
# gate.yml does and why its jobs build fine.
env:
  CARGO_TERM_COLOR: always
  # #5451 / #5533 —— crates.io 是 CI 的**第三个**外部依赖（另两个是
  # github.com 与 index.crates.io 背后的同一片网络）。
  #
  # 实测（CI run 8348，根包 `test` job 的 Build 步骤）：
  #
  #   error: failed to get `chrono` as a dependency of package
  #          `evidence-graph v0.1.0`
  #   Caused by: failed to download from
  #              `https://index.crates.io/ch/ro/chrono`
  #   Caused by: [28] Timeout was reached (Operation too slow.
  #              Less than 10 bytes/sec transferred the last 30 seconds)
  #
  # 锁文件里的 crate 必须取到，下载本身不是可选项；但**网络抖动**不该
  # 让整个 job 死掉。cargo 自带重试，只是默认次数太少、低速阈值太高。
  # 这里只调**重试与超时**，不动 CARGO_HOME / RUSTUP_HOME（见上面的 NOTE）。
  CARGO_NET_RETRY: "10"
  CARGO_HTTP_TIMEOUT: "120"
  CARGO_HTTP_LOW_SPEED_LIMIT: "1"
  # #5550 — bound the **per-container** compile parallelism.
  #
  # cargo defaults to one rustc per core. The host has 80 cores and the
  # runner pool runs three `hp-z6g4` jobs at a time, so the default meant
  # up to 240 concurrent rustc processes on 80 cores — the state the host
  # was in when it kernel-panicked (see the `concurrency` block above).
  #
  # 16 keeps the three concurrent jobs inside the host's real capacity
  # (3 × 16 = 48 ≤ 80) while still using it: the workspace is far too
  # large to compile serially, and a build that takes 7m30s on 80 cores
  # takes ~10m on 16 — an acceptable price for a machine that stays up.
  CARGO_BUILD_JOBS: "16"

# Combined lint + build: share one clone, build once
jobs:
  lint-build:
    runs-on: [hp-z6g4]
    steps:
      - name: Checkout
        # #5448 / #5532 — the checkout is done against the **Gitea instance**
        # itself.  The runner used to download `actions/checkout` from GitHub
        # **once per job**, so a GitHub outage turned the whole pipeline red
        # for a reason that had nothing to do with this repository (observed:
        # `unexpected EOF`, `TLS handshake timeout`).
        #
        # The commit this run was created for is discovered from the remote
        # refs and then **verified**: a checkout that is not that commit is a
        # hard error, never a silent "some other tree was checked out".
        #
        # `scripts/gate/check_ci_checkout_consistency.sh` asserts that every
        # gated workflow embeds this exact body — one rule, one implementation.
        run: |
          set -euo pipefail
          REPO_URL="${CI_REPO_URL:-http://192.168.0.252:3000/openclaw/sqlrustgo.git}"
          DEPTH="${CI_DEPTH:-1}"
          SHA="${GITHUB_SHA:-${GITEA_SHA:-}}"
          DIR="${CI_CHECKOUT_DIR:-.}"
          if [ -z "$SHA" ]; then
            echo "FATAL: neither GITHUB_SHA nor GITEA_SHA is set - refusing to guess which commit to check out" >&2
            exit 1
          fi
          mkdir -p "$DIR"
          cd "$DIR"
          git init -q -b main .
          git remote add origin "$REPO_URL"
          if [ "$DEPTH" = "0" ]; then
            git fetch --no-tags --prune --no-recurse-submodules origin "+$SHA"
          else
            git fetch --no-tags --prune --no-recurse-submodules --depth="$DEPTH" origin "+$SHA"
          fi
          git checkout -q FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "FATAL: checked out $(git rev-parse HEAD) but this run is for $SHA" >&2
            exit 1
          fi
      - name: Clippy
        # #5465: this used to be
        #     cargo clippy --all-features -- -D warnings
        # which checks the library and the binaries but **not** the 446 test
        # targets. Every lint in `tests/` was therefore invisible to the gate.
        #
        # That blindness had a concrete cost: a deny-by-default false
        # positive (`clippy::approx_constant` in
        # `tests/integration/sql/v312_62_issue_batch_test.rs`) sat in the tree
        # unnoticed, and — worse — a *compile error* introduced by PR #5493
        # (`super::bin_resolver::…` in `tests/common/tpch_cli_harness.rs`,
        # which is a cargo target of its own) meant that target never
        # compiled and therefore never ran. Neither was visible to a gate
        # that does not build the test targets.
        #
        # The test tree's lint backlog (55 warnings across 25 lint names)
        # was paid down in the same change, so `--all-targets` can be turned
        # on outright instead of being papered over with an allowance.
        run: cargo clippy --all-features --all-targets -- -D warnings
      - name: Test-target lint budget (issue #5465)
        # Quantifies the lint debt of the test targets and compares it with
        # the recorded baseline. With the backlog at zero this is a no-op
        # today; its value is that it answers "how much do we owe?" with a
        # number, and that a re-baseline is an explicit, reviewable act
        # (`--update`) rather than a side effect of a CI run.
        run: bash scripts/gate/check_test_target_lint_budget.sh
      - name: Workspace lint budget (issue #5508)
        # The Clippy step above covers the **root package** only. In a
        # workspace whose root is also a package, cargo's default members
        # are that one package — so the 44 `crates/*` members (301 test
        # targets among them) were never linted by any gate. That blindness
        # had a concrete cost: `crates/server/benches/scheduler_bench.rs`
        # used `criterion` without declaring it, `crates/storage/benches/
        # storage_benchmark.rs` had an un-inferrable closure, and a dozen
        # vacuous assertions (`x >= 0` on a `usize`) sat in the tree — none
        # of them visible to a gate that does not build those targets.
        #
        # Turning the whole workspace into `-D warnings` is not an option:
        # it would stop the pipeline over a debt nobody can act on in one
        # change. The **same rule** the root scope uses is therefore applied
        # to the workspace scope — it must compile (a target that does not
        # compile is a target nobody runs), and no lint name may exceed its
        # recorded baseline. One implementation, two scopes.
        run: bash scripts/gate/check_test_target_lint_budget.sh --scope workspace
      - name: Workflow expression gate (issue #5517)
        # #5517: a workflow whose expression template the platform cannot
        # parse is **ignored entirely** — no job is ever created, so the run
        # fails instantly with zero jobs and nothing in the repo says why.
        # The trigger was a step-output template written inside a *comment* of
        # a `run:` block: the platform scans the whole scalar, comments
        # included, and the angle brackets of a documentation placeholder are
        # not legal expression symbols.
        #
        # (This very comment is an example of the discipline: the template is
        # *described*, never written out.)
        #
        # This gate is static and costs nothing: it refuses an expression that
        # carries angle brackets, and refuses anything richer than a plain
        # dotted path inside a comment.
        run: bash scripts/gate/check_workflow_expressions.sh
      - name: Process-global env mutation gate (issue #5423)
        # The root lib test binary runs its ~160 unit tests concurrently in
        # ONE process. A test that mutates the process environment table is
        # visible to every sibling test running at the same moment, which
        # turned one default-value assertion into a ~1-in-3 random CI red.
        #
        # The rule is scoped to the root package on purpose: `crates/*` are
        # separate test binaries and carry their own locking discipline.
        #
        # (This comment names the mechanism, never a code pattern the
        # platform might scan — see the workflow expression gate above.)
        run: bash scripts/gate/check_no_process_env_mutation.sh
      - name: Hardcoded credential gate (issues #5381 / #5520)
        # The repository is mirrored to a **public** GitHub repository, so any
        # credential-shaped string in a tracked file is world-readable. Five
        # such strings were found (all of them already revoked); they lived in
        # markdown as often as in scripts, which is why the scan covers docs
        # too and not just the executable code.
        #
        # The gate is static, costs nothing, and can be pointed at any tree
        # with --repo-root — that is how the leftovers on a *branch* were
        # found, since they are invisible to a scan of the checked-out one.
        run: bash scripts/gate/check_no_hardcoded_secrets.sh
      - name: Format check
        run: cargo fmt --check --all
      - name: Build
        run: cargo build --all-features

  test:
    runs-on: [hp-z6g4]
    # ── #5533 — `needs: [lint-build]` made this job **never run**. ──────────
    #
    # On this Gitea (28.1.0) a job that declares a non-empty `needs:` stays
    # in status **Waiting** and is never handed to a runner.  Measured on the
    # server's own job table (`action_run_job`, `needs` non-empty):
    #
    #   needs=["lint-build"]  →  success:   0   failure:  29
    #                            cancelled: 643  skipped:  779  waiting: 1
    #
    # ⇒ the job that actually runs the test suite had **never once** reached
    # a green conclusion.  Every "CI is green" claim in this repository was
    # therefore made **without the test suite ever running**: the run was
    # green because the job was *skipped*, not because the tests passed.
    #
    # The two jobs that carry the `needs:` (this one and `test-crates`) are
    # the two that matter most, and they are exactly the two that were
    # dead.  The dependency is therefore expressed the way this repository
    # already expresses it elsewhere (`mutation`, `postcheck`): an empty
    # `needs` plus `if: always()`.  The cost is that the test suite now
    # starts in parallel with `lint-build` instead of after it; the benefit
    # is that the test suite runs **at all**.
    needs: []
    if: always()
    steps:
      - name: Checkout
        # #5448 / #5532 — the checkout is done against the **Gitea instance**
        # itself.  The runner used to download `actions/checkout` from GitHub
        # **once per job**, so a GitHub outage turned the whole pipeline red
        # for a reason that had nothing to do with this repository (observed:
        # `unexpected EOF`, `TLS handshake timeout`).
        #
        # The commit this run was created for is discovered from the remote
        # refs and then **verified**: a checkout that is not that commit is a
        # hard error, never a silent "some other tree was checked out".
        #
        # `scripts/gate/check_ci_checkout_consistency.sh` asserts that every
        # gated workflow embeds this exact body — one rule, one implementation.
        run: |
          set -euo pipefail
          REPO_URL="${CI_REPO_URL:-http://192.168.0.252:3000/openclaw/sqlrustgo.git}"
          DEPTH="${CI_DEPTH:-1}"
          SHA="${GITHUB_SHA:-${GITEA_SHA:-}}"
          DIR="${CI_CHECKOUT_DIR:-.}"
          if [ -z "$SHA" ]; then
            echo "FATAL: neither GITHUB_SHA nor GITEA_SHA is set - refusing to guess which commit to check out" >&2
            exit 1
          fi
          mkdir -p "$DIR"
          cd "$DIR"
          git init -q -b main .
          git remote add origin "$REPO_URL"
          if [ "$DEPTH" = "0" ]; then
            git fetch --no-tags --prune --no-recurse-submodules origin "+$SHA"
          else
            git fetch --no-tags --prune --no-recurse-submodules --depth="$DEPTH" origin "+$SHA"
          fi
          git checkout -q FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "FATAL: checked out $(git rev-parse HEAD) but this run is for $SHA" >&2
            exit 1
          fi
      - name: Build
        # `cargo build` inside a workspace that has a **root package** builds
        # ONLY that root package — the member packages' binaries are never
        # produced. Several test targets spawn a real server binary and abort
        # when it is missing; `tests/e2e/e2e_canonical_subprocess.rs:68` says
        # so verbatim ("canonical binary not found at …; run `cargo build -p
        # sqlrustgo-mysql-server` first") and 14 of its tests failed on that
        # assertion alone in CI run 8031.
        #
        # The root package `sqlrustgo` has no `src/main.rs` at all, so even
        # `target/debug/sqlrustgo` comes from the member package
        # `crates/sqlrustgo-cli` — it is missing for the same reason.
        #
        # These builds are the *same* crates the test step compiles anyway
        # (in the test profile); this only adds their dev-profile artifacts.
        #
        # `--all-features` is deliberately **not** used for the member packages:
        # it would activate `sqlrustgo-mysql-server/jemalloc-prof`, which
        # requires `JEMALLOC_SYS_WITH_MALLOC_CONF` at build time and is not
        # what the test step builds either (at the workspace root, cargo
        # selects the root package only, so the member's features are not
        # activated there either). The command is the one the failing test
        # itself prescribes: "run `cargo build -p sqlrustgo-mysql-server` first".
        run: |
          cargo build --all-features
          cargo build -p sqlrustgo-mysql-server -p sqlrustgo-cli
      - name: Prepare TPC-H fixture (issue #5379)
        # The TPC-H fixture used to be a symlink into /tmp that resolved on
        # exactly one machine, so every fixture-dependent test panicked here
        # and the `test` job was permanently red.
        #
        # The fixture is now generated at run time: the repository forbids
        # committing *.tbl (see .gitignore and the user rule of 2026-09-11),
        # and CI cannot build dbgen (nothing is vendored, and the hermes
        # runner has no GitHub egress). The generator is deterministic
        # (seed 42), so the same bytes are produced on every run.
        run: |
          bash scripts/gate/prepare_tpch_fixture.sh --out "${RUNNER_TEMP:-/tmp}/tpch-fixture" --sf 0.01 --seed 42
          echo "TPCH_DATA_DIR=${RUNNER_TEMP:-/tmp}/tpch-fixture" >> "$GITHUB_ENV"
          echo "TPCH_NOT_RUN_FILE=${RUNNER_TEMP:-/tmp}/tpch_not_run.log" >> "$GITHUB_ENV"
      - name: Run tests
        run: |
          set -o pipefail
          # --no-fail-fast is required by AGENTS.md §7. Without it the run
          # stopped at the first failing target: on CI run 7613 only 64 of
          # the 446 declared test targets ever executed, while the summary
          # still printed "passed=70 failed=1" and hid the other 382.
          #
          # The timeout bounds the blast radius of a hanging test: with
          # fail-fast gone, one stuck test would otherwise block the whole
          # job until the 3 h container limit. On timeout the run is cut
          # short, the summary reports the partial result and the execution
          # accounting gate below names the targets that never ran.
          #
          # `timeout` must wrap the **redirect**, not a pipeline. With
          # `timeout … cargo test | tee …`, `tee` sits outside the process
          # group `timeout` signals, so it keeps the step's stdout pipe open
          # long after cargo is gone — the step never ends and the runner
          # holds the container until somebody kills it by hand. Measured on
          # CI run 8031: `harness_validation_test` hung at 05:59:01Z, the
          # 9000 s deadline passed at ~07:28Z, and the job was still
          # "in progress" at 08:45Z with its log frozen — 1 h 47 m past the
          # deadline. `timeout` signals the child's whole process group, so
          # without the pipe the hung test binary is killed too and the step
          # returns.
          #
          # 9000 s (2.5 h) rather than 7200 s (2 h): the fixture became
          # reachable in this PR, so the ~31 fixture-dependent targets now
          # do real work instead of silently running against empty tables.
          # Measured on the CI runner (run 7837): the slowest single target
          # (`_q15_q16_check`, which loads ~100k rows one INSERT at a time
          # in a debug build) already needs > 20 min. The budget arithmetic
          # for the 3 h container limit is: checkout + `cargo build
          # --all-features` + fixture generation + the summary/gate steps
          # ≈ 20 min, which leaves ≈ 2.5 h for the test run itself.
          #
          # The mutation gate used to live in this job and needed 4 more
          # cargo runs (each rebuilding the engine crate). It now has its
          # own job so that its cost does not eat into this budget, and so
          # that the two do not compete for the runner's CPU and memory.
          timeout -k 30 9000 cargo test --all-features --no-fail-fast > test_report.log 2>&1
          status=$?
          echo "cargo test exited with status ${status}"
          # Keep the tail of the run in the job log: on a timeout it names
          # the target that was stuck.
          tail -n 200 test_report.log || true
          exit ${status}
      - name: Test summary
        if: always()
        run: |
          # `grep -c` prints 0 AND exits 1 when there is no match, so
          # `grep -c ... || echo 0` appends a second 0 and yields the two-line
          # value "0\n0" — which then breaks the integer test below. Taking
          # the first line keeps this a single number.
          #
          # Two granularities are reported on purpose (ADR-008 §Policy 1:
          # a PASS claim must state how many tests actually ran):
          #   * per test binary  — "test result: ok" lines
          #   * per test function — "test <name> ... ok" lines
          # The old summary only counted binaries, which is how 382 unexecuted
          # targets could hide behind a near-green line.
          BIN_OK=$(grep -c 'test result: ok' test_report.log 2>/dev/null | head -1)
          BIN_FAIL=$(grep -c 'test result: FAILED' test_report.log 2>/dev/null | head -1)
          BIN_OK=${BIN_OK:-0}
          BIN_FAIL=${BIN_FAIL:-0}
          TEST_OK=$(grep -cE '^test .* \.\.\. ok$' test_report.log 2>/dev/null | head -1)
          TEST_FAIL=$(grep -cE '^test .* \.\.\. FAILED$' test_report.log 2>/dev/null | head -1)
          TEST_IGNORED=$(grep -cE '^test .* \.\.\. ignored$' test_report.log 2>/dev/null | head -1)
          TEST_OK=${TEST_OK:-0}
          TEST_FAIL=${TEST_FAIL:-0}
          TEST_IGNORED=${TEST_IGNORED:-0}
          # Tests that could not run (no fixture, or a fixture whose scale
          # profile does not match the one their expectations were calibrated
          # against) report themselves through the TPCH-NOT-RUN marker, which
          # is collected in TPCH_NOT_RUN_FILE. They are disclosed and are
          # NOT counted as passed (AGENTS.md §8 #5).
          NOT_RUN=0
          NOT_RUN_RECORDS=0
          if [ -n "${TPCH_NOT_RUN_FILE:-}" ] && [ -f "${TPCH_NOT_RUN_FILE}" ]; then
            # NOT-RUN 计数：**逐条切分 + 去重**后计数，两个数都打印。
            #   - `grep -o 'TPCH-NOT-RUN:.*'` 逐条输出 ⇒ 即使某条记录丢了换行
            #     （多个测试二进制并发写同一文件时可能发生），也能被逐条数出来；
            #     行数口径（`grep -c`）会把这样的粘连记录少算一条。
            #   - `sort -u` 折叠**逐字相同**的重复记录：`regression_test` 这个
            #     meta 套件用子进程重跑目标，同一批 NOT-RUN 记录会被写两遍。
            # 实测 run 8185：原始 114 条记录里有 83 条是单元测试的合成记录，
            # 去重后只剩 20 条真实条目 ⇒ 旧口径的 `not_run=113` 虚高 3.6 倍，
            # 并让下面的 `PASSED=$((TEST_OK - NOT_RUN))` 少报 82 个 passed。
            NOT_RUN_RECORDS=$(grep -o 'TPCH-NOT-RUN:.*' "${TPCH_NOT_RUN_FILE}" 2>/dev/null | wc -l | tr -d '[:space:]')
            NOT_RUN=$(grep -o 'TPCH-NOT-RUN:.*' "${TPCH_NOT_RUN_FILE}" 2>/dev/null | sort -u | wc -l | tr -d '[:space:]')
            NOT_RUN=${NOT_RUN:-0}
            NOT_RUN_RECORDS=${NOT_RUN_RECORDS:-0}
            echo "--- not-run tests (disclosed; NOT counted as passed) ---"
            cat "${TPCH_NOT_RUN_FILE}"
          fi
          PASSED=$((TEST_OK - NOT_RUN))
          if [ "$PASSED" -lt 0 ]; then PASSED=0; fi
          echo "Tests: passed=$PASSED failed=$TEST_FAIL not_run=$NOT_RUN not_run_records=$NOT_RUN_RECORDS ignored=$TEST_IGNORED"
          echo "Test binaries: ok=$BIN_OK failed=$BIN_FAIL"
          if [ "$TEST_FAIL" -gt 0 ]; then exit 1; fi
          if [ "$((BIN_OK + BIN_FAIL))" -eq 0 ]; then
            echo "No 'test result' lines in test_report.log — the test run did not complete."
            echo "Treating as failure rather than as a clean run."
            exit 1
          fi
      - name: Test target execution accounting (issue #5379)
        if: always()
        run: |
          # Every [[test]] target declared in Cargo.toml must actually have
          # run. This is the gate that makes a silently truncated test run
          # impossible: on CI run 7613, 382 of 446 declared targets never
          # executed and nothing reported it.
          bash scripts/gate/check_test_target_execution.sh --cargo-toml Cargo.toml --scope root --log test_report.log
      - name: Test manifest honesty (issue #5449)
        if: always()
        run: |
          # #5449: the gate above compares the *declared* targets against the
          # *executed* ones. It cannot see a file that is neither declared nor
          # executed — and that is exactly how 6 sub-directory test files
          # (63 `#[test]` functions) and 1 top-level file that cargo silently
          # drops (name collision) never ran in this repository's history.
          #
          # This gate is static: every test-bearing file under tests/ must be a
          # declared [[test]] target or reachable from one, every top-level
          # file must have its own declaration, and the declared count must
          # equal the number of test targets cargo actually builds.
          bash scripts/gate/check_test_manifest_honesty.sh
      - name: Gate — CLI binary names (issue #5405)
        if: always()
        run: |
          # #5405: `tests/e2e/sqlrustgo_cli_soak_e2e_test.rs` looked for
          # `target/debug/sqlrustgo-cli` — a name no bin has. `sqlrustgo-cli`
          # is the **package** name of `crates/sqlrustgo-cli`; that package's
          # `[[bin]] name` is `sqlrustgo`.
          #
          # The typo was the symptom. The disease was that "what is this binary
          # called" had two answers (the package name and the bin name) and the
          # test tree was free to pick either. This gate makes the manifest the
          # only source of a bin name and cross-checks everything else against
          # it: duplicate [[bin]] names, CARGO_BIN_EXE references borrowed from
          # another package, `target/<profile>/<name>` literals that name
          # nothing, and resolver candidate lists that drifted.
          bash scripts/gate/check_cli_binary_names.sh
      - name: Gate — TPC-H known-difference registry (issue #5379)
        if: always()
        run: |
          # A difference between the engine and the independent SQLite
          # oracle is only acceptable when it is *registered*: an issue to
          # track it, a named owner, a date, and a description of what
          # actually differs. The gate also refuses a difference that no
          # longer differs (same row count on both sides for a
          # `row_count` entry), and caps the registry so it cannot grow
          # silently.
          bash scripts/gate/check_tpch_known_differences.sh
      - name: Gate G1 — TPC-H 22/22 baseline (issue #3186)
        if: always() && (github.event_name == 'pull_request' || contains(github.ref, 'develop/v3.9.0'))
        run: |
          # This gate needs a real dbgen SF=1 fixture. CI cannot produce one:
          # dbgen is not vendored, the hermes runner has no GitHub egress to
          # fetch it, and the runner carries no SF=1 dataset. When the
          # fixture is absent the step reports NOT RUN — explicitly neither
          # PASS nor FAIL — instead of pretending the scale layer ran.
          #
          # Where the SF=1 layer IS enforced today (verified 2026-10-20, issue
          # #5379 iteration 4):
          #   - this step, when a runner does carry $TPCH_SF1_DIR;
          #   - the manual z6g4-tpch-sf1-cell-diff.yml workflow.
          # It is NOT enforced by scripts/gate/check_stage.sh: that driver
          # contains zero TPC-H references, and STAGE_CONFIG.yaml's
          # required_gates for ALPHA/BETA/RC/GA never list
          # scripts/gate/check_g1_tpch_baseline.sh (G1) — that script is
          # invoked from this workflow only. A previous comment here claimed
          # check_stage.sh was the release-promotion backstop; it was not,
          # so this comment states only what is actually true.
          # Issue #5387 tracks wiring the SF=1 scale layer into CI.
          SF1_DIR="${TPCH_SF1_DIR:-/var/tmp/tpch-sf1}"
          if [ ! -f "$SF1_DIR/lineitem.tbl" ]; then
            echo "TPC-H SF=1 scale gate: NOT RUN — no dbgen SF=1 fixture at $SF1_DIR on this runner."
            echo "STATUS: NOT RUN (not PASS, not FAIL) — tracked by issue #5387"
            printf 'STATUS: NOT RUN\nreason: no SF=1 fixture at %s\n' "$SF1_DIR" > g1_report.log
            exit 0
          fi
          chmod +x scripts/gate/check_g1_tpch_baseline.sh
          # #5443: without `pipefail` the step's exit code came from `tee`
          # (always 0), so the baseline check could never turn this step
          # red — the comment below claimed the opposite.
          set -euo pipefail
          bash scripts/gate/check_g1_tpch_baseline.sh 2>&1 | tee g1_report.log
        # NOTE: this step fails hard when the SF=1 fixture IS present and the
        # baseline check does not pass. The earlier comment claimed it "fails
        # by design until the baseline hash in tests/tpch_hashes_v380.json is
        # filled in" — that hash has been filled in since 545814c3d1, and the
        # real blocker is the missing SF=1 fixture, not the hash.

  # The **member packages** get their OWN job (issue #5515).
  #
  # Why a separate job:
  #   * `cargo test` at the workspace root selects the **root package only**
  #     (the workspace root is itself a package), so the **301** test targets
  #     under `crates/*` never ran in CI — and nothing reported it;
  #   * the root package's own run already needs **86-147 min** on the runner
  #     (measured over CI runs 8113 / 8117 / 8031 / 8342 / 8264 / 8185) and
  #     the runner's container limit is **3 h** ⇒ the two cannot share one
  #     job: the root run alone can consume 147 of the 180 minutes;
  #   * a separate job also means a separate log, and the execution-accounting
  #     gate then checks each job against **the slice it is responsible for**
  #     (`--scope root` / `--scope crates`). One comparison rule, two scopes.
  #
  # The job runs **after** `lint-build` (a clippy failure is a P0 stop, and
  # the runner has a single worker — running the crates' tests on top of a
  # known-red clippy would only burn the queue).
  test-crates:
    runs-on: [hp-z6g4]
    # #5533 — same defect as the root `test` job: a non-empty `needs:` never
    # leaves status Waiting on this Gitea, so this job would have been dead
    # on arrival.  See the long explanation on the root `test` job.
    needs: []
    if: always()
    steps:
      - name: Checkout
        # #5448 / #5532 — the checkout is done against the **Gitea instance**
        # itself.  The runner used to download `actions/checkout` from GitHub
        # **once per job**, so a GitHub outage turned the whole pipeline red
        # for a reason that had nothing to do with this repository (observed:
        # `unexpected EOF`, `TLS handshake timeout`).
        #
        # The commit this run was created for is discovered from the remote
        # refs and then **verified**: a checkout that is not that commit is a
        # hard error, never a silent "some other tree was checked out".
        #
        # `scripts/gate/check_ci_checkout_consistency.sh` asserts that every
        # gated workflow embeds this exact body — one rule, one implementation.
        run: |
          set -euo pipefail
          REPO_URL="${CI_REPO_URL:-http://192.168.0.252:3000/openclaw/sqlrustgo.git}"
          DEPTH="${CI_DEPTH:-1}"
          SHA="${GITHUB_SHA:-${GITEA_SHA:-}}"
          DIR="${CI_CHECKOUT_DIR:-.}"
          if [ -z "$SHA" ]; then
            echo "FATAL: neither GITHUB_SHA nor GITEA_SHA is set - refusing to guess which commit to check out" >&2
            exit 1
          fi
          mkdir -p "$DIR"
          cd "$DIR"
          git init -q -b main .
          git remote add origin "$REPO_URL"
          if [ "$DEPTH" = "0" ]; then
            git fetch --no-tags --prune --no-recurse-submodules origin "+$SHA"
          else
            git fetch --no-tags --prune --no-recurse-submodules --depth="$DEPTH" origin "+$SHA"
          fi
          git checkout -q FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "FATAL: checked out $(git rev-parse HEAD) but this run is for $SHA" >&2
            exit 1
          fi
      - name: Build member binaries
        # Same reason as the root job's Build step: several member test
        # targets spawn a real server binary and abort when it is missing
        # ("canonical binary not found at ...").
        #
        # `sqlrustgo-mysql-server/fault-injection` is **required**, not
        # optional: the crash tests in `crates/storage/tests/` arm a fault
        # point and wait for the server to announce it. The hooks live behind
        # `#[cfg(any(test, feature = "fault-injection"))]`, so a binary built
        # without the feature **silently never reaches the boundary** and the
        # test fails with "server never reached fault point after_commit_fsync
        # within 60s".
        #
        # These tests never ran in CI before (#5515) — the whole `crates/*`
        # suite was invisible to CI — which is exactly why this wiring bug
        # survived: the test's own message says "Build it with `cargo build -p
        # sqlrustgo-mysql-server --all-features`", and CI never did that.
        run: |
          cargo build -p sqlrustgo-mysql-server -p sqlrustgo-cli \
            --features sqlrustgo-mysql-server/fault-injection
      - name: Prepare TPC-H fixture (issue #5379)
        # The member packages have TPC-H-dependent targets too, and the
        # fixture is generated at run time (the repository forbids committing
        # *.tbl). Same generator, same seed => same bytes as the root job.
        run: |
          bash scripts/gate/prepare_tpch_fixture.sh --out "${RUNNER_TEMP:-/tmp}/tpch-fixture" --sf 0.01 --seed 42
          echo "TPCH_DATA_DIR=${RUNNER_TEMP:-/tmp}/tpch-fixture" >> "$GITHUB_ENV"
          echo "TPCH_NOT_RUN_FILE=${RUNNER_TEMP:-/tmp}/tpch_not_run.log" >> "$GITHUB_ENV"
      - name: Run member-package tests (issue #5515)
        run: |
          set -o pipefail
          # `--exclude sqlrustgo` drops the root package: it has its own job
          # above. Every other workspace member runs here.
          #
          # `--all-features` is deliberately **not** used at workspace scope:
          # it would activate `sqlrustgo-mysql-server/jemalloc-prof`, whose
          # build runs jemalloc's `configure` + `make` — and the CI image
          # (Alpine/musl) does not ship `make`. The root job's `--all-features`
          # never applied to the member packages either (cargo selects the
          # root package only there), so this is **not** a coverage loss:
          # what runs here is each member package's own test suite, with its
          # default features — exactly what `cargo test -p <crate>` does.
          #
          # 5400 s (1.5 h) instead of the root job's 9000 s: the member
          # targets are individually much smaller than the root package's
          # fixture-heavy ones, and this job has the 3 h container limit to
          # itself.
          timeout -k 30 5400 cargo test --workspace --exclude sqlrustgo --no-fail-fast > test_report.log 2>&1
          status=$?
          echo "cargo test exited with status ${status}"
          # Keep the tail of the run in the job log: on a timeout it names
          # the target that was stuck.
          tail -n 200 test_report.log || true
          exit ${status}
      - name: Test summary
        if: always()
        run: |
          # `grep -c` prints 0 AND exits 1 when there is no match, so
          # `grep -c ... || echo 0` appends a second 0 and yields the two-line
          # value "0\n0" — which then breaks the integer test below. Taking
          # the first line keeps this a single number.
          #
          # Two granularities are reported on purpose (ADR-008 §Policy 1:
          # a PASS claim must state how many tests actually ran):
          #   * per test binary  — "test result: ok" lines
          #   * per test function — "test <name> ... ok" lines
          # The old summary only counted binaries, which is how 382 unexecuted
          # targets could hide behind a near-green line.
          BIN_OK=$(grep -c 'test result: ok' test_report.log 2>/dev/null | head -1)
          BIN_FAIL=$(grep -c 'test result: FAILED' test_report.log 2>/dev/null | head -1)
          BIN_OK=${BIN_OK:-0}
          BIN_FAIL=${BIN_FAIL:-0}
          TEST_OK=$(grep -cE '^test .* \.\.\. ok$' test_report.log 2>/dev/null | head -1)
          TEST_FAIL=$(grep -cE '^test .* \.\.\. FAILED$' test_report.log 2>/dev/null | head -1)
          TEST_IGNORED=$(grep -cE '^test .* \.\.\. ignored$' test_report.log 2>/dev/null | head -1)
          TEST_OK=${TEST_OK:-0}
          TEST_FAIL=${TEST_FAIL:-0}
          TEST_IGNORED=${TEST_IGNORED:-0}
          # Tests that could not run (no fixture, or a fixture whose scale
          # profile does not match the one their expectations were calibrated
          # against) report themselves through the TPCH-NOT-RUN marker, which
          # is collected in TPCH_NOT_RUN_FILE. They are disclosed and are
          # NOT counted as passed (AGENTS.md §8 #5).
          NOT_RUN=0
          NOT_RUN_RECORDS=0
          if [ -n "${TPCH_NOT_RUN_FILE:-}" ] && [ -f "${TPCH_NOT_RUN_FILE}" ]; then
            # NOT-RUN 计数：**逐条切分 + 去重**后计数，两个数都打印。
            #   - `grep -o 'TPCH-NOT-RUN:.*'` 逐条输出 ⇒ 即使某条记录丢了换行
            #     （多个测试二进制并发写同一文件时可能发生），也能被逐条数出来；
            #     行数口径（`grep -c`）会把这样的粘连记录少算一条。
            #   - `sort -u` 折叠**逐字相同**的重复记录：`regression_test` 这个
            #     meta 套件用子进程重跑目标，同一批 NOT-RUN 记录会被写两遍。
            # 实测 run 8185：原始 114 条记录里有 83 条是单元测试的合成记录，
            # 去重后只剩 20 条真实条目 ⇒ 旧口径的 `not_run=113` 虚高 3.6 倍，
            # 并让下面的 `PASSED=$((TEST_OK - NOT_RUN))` 少报 82 个 passed。
            NOT_RUN_RECORDS=$(grep -o 'TPCH-NOT-RUN:.*' "${TPCH_NOT_RUN_FILE}" 2>/dev/null | wc -l | tr -d '[:space:]')
            NOT_RUN=$(grep -o 'TPCH-NOT-RUN:.*' "${TPCH_NOT_RUN_FILE}" 2>/dev/null | sort -u | wc -l | tr -d '[:space:]')
            NOT_RUN=${NOT_RUN:-0}
            NOT_RUN_RECORDS=${NOT_RUN_RECORDS:-0}
            echo "--- not-run tests (disclosed; NOT counted as passed) ---"
            cat "${TPCH_NOT_RUN_FILE}"
          fi
          PASSED=$((TEST_OK - NOT_RUN))
          if [ "$PASSED" -lt 0 ]; then PASSED=0; fi
          echo "Tests: passed=$PASSED failed=$TEST_FAIL not_run=$NOT_RUN not_run_records=$NOT_RUN_RECORDS ignored=$TEST_IGNORED"
          echo "Test binaries: ok=$BIN_OK failed=$BIN_FAIL"
          if [ "$TEST_FAIL" -gt 0 ]; then exit 1; fi
          if [ "$((BIN_OK + BIN_FAIL))" -eq 0 ]; then
            echo "No 'test result' lines in test_report.log — the test run did not complete."
            echo "Treating as failure rather than as a clean run."
            exit 1
          fi
      - name: Test target execution accounting (issue #5379 / #5515)
        if: always()
        run: |
          # This job is responsible for the **member packages'** targets.
          # `--scope crates` is the only difference from the root job's
          # invocation — the comparison rule is one implementation.
          bash scripts/gate/check_test_target_execution.sh --cargo-toml Cargo.toml --scope crates --log test_report.log

  # The mutation gate gets its OWN job (issue #5379).
  #
  # It injects three defects into the ENGINE implementation (never into the
  # test code) and requires the new TPC-H assertions to catch each one.
  #
  # Why a separate job:
  #   * the script needs 4 cargo runs (2 baselines for the two reference
  #     targets + 3 mutations) and every mutation rebuilds the engine crate;
  #     inside the `test` job that cost ate into the 3 h container budget
  #     that the 446-target run already needs;
  #   * `needs: [test]` + `if: always()` makes it run *after* the test job,
  #     so the two never compete for the runner's CPU and memory (the
  #     fixture-dependent targets are memory-hungry);
  #   * it still produces its evidence when the test job fails, which is
  #     when the mutation evidence matters most.
  #
  # The script restores the mutated engine file byte-for-byte after every
  # mutation and verifies the SHA-256 of the restored file; the workspace
  # stays clean, and nothing is committed.
  mutation:
    runs-on: [hp-z6g4]
    # #5455: `needs: [test]` masked this job too — the `test` job has never
    # succeeded, so the mutation analysis never ran once. It is a
    # post-test criterion, so it must not be gated behind the test job.
    needs: []
    if: always()
    steps:
      - name: Checkout
        # #5448 / #5532 — the checkout is done against the **Gitea instance**
        # itself.  The runner used to download `actions/checkout` from GitHub
        # **once per job**, so a GitHub outage turned the whole pipeline red
        # for a reason that had nothing to do with this repository (observed:
        # `unexpected EOF`, `TLS handshake timeout`).
        #
        # The commit this run was created for is discovered from the remote
        # refs and then **verified**: a checkout that is not that commit is a
        # hard error, never a silent "some other tree was checked out".
        #
        # `scripts/gate/check_ci_checkout_consistency.sh` asserts that every
        # gated workflow embeds this exact body — one rule, one implementation.
        run: |
          set -euo pipefail
          REPO_URL="${CI_REPO_URL:-http://192.168.0.252:3000/openclaw/sqlrustgo.git}"
          DEPTH="${CI_DEPTH:-1}"
          SHA="${GITHUB_SHA:-${GITEA_SHA:-}}"
          DIR="${CI_CHECKOUT_DIR:-.}"
          if [ -z "$SHA" ]; then
            echo "FATAL: neither GITHUB_SHA nor GITEA_SHA is set - refusing to guess which commit to check out" >&2
            exit 1
          fi
          mkdir -p "$DIR"
          cd "$DIR"
          git init -q -b main .
          git remote add origin "$REPO_URL"
          if [ "$DEPTH" = "0" ]; then
            git fetch --no-tags --prune --no-recurse-submodules origin "+$SHA"
          else
            git fetch --no-tags --prune --no-recurse-submodules --depth="$DEPTH" origin "+$SHA"
          fi
          git checkout -q FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "FATAL: checked out $(git rev-parse HEAD) but this run is for $SHA" >&2
            exit 1
          fi
      - name: Mutation test — the new TPC-H assertions really kill defects (issue #5379)
        if: always() && github.event_name == 'pull_request'
        run: |
          bash scripts/gate/mutate_tpch_oracle_tests.sh

  ga3-security-scan:
    # Issue #4532 — GA-3 SC-1 cargo audit: pre-install cargo-audit + pre-fetch
    # advisory DB. Without pre-install, `cargo audit` would take 4m46s to
    # compile cargo-audit from source on every CI run, and the advisory DB
    # fetch would fail in the hermes-runner env (no network access for
    # https://github.com/RustSec/advisory-db.git during postcheck). This
    # dedicated job gives SC-1 its own slot so it can `cargo install` once
    # and `cargo audit --json` to populate the advisory DB before running
    # check_security_scan_v312.sh.
    #
    # The advisory DB lives at $CARGO_HOME/advisory-db. On the self-hosted
    # hp-z6g4 runner, $CARGO_HOME = ${{ runner.temp }}/.cargo is ephemeral
    # (one-shot per job), so we re-fetch inside this job. cargo-audit itself
    # is installed with --locked (deterministic version pin).
    runs-on: [hp-z6g4]
    # #5424: the condition only matched `develop/v3.12.0` / `ci/v3.12.0-`,
    # so on the v4.x line the job was **skipped** and the GA Security
    # criterion had never been executed by CI on this branch.
    if: contains(github.ref, 'develop/v4.') || contains(github.ref, 'release/v4.') || contains(github.ref, 'develop/v3.12.0') || contains(github.ref, 'ci/v3.12.0-')
    steps:
      - name: Checkout
        # #5448 / #5532 — the checkout is done against the **Gitea instance**
        # itself.  The runner used to download `actions/checkout` from GitHub
        # **once per job**, so a GitHub outage turned the whole pipeline red
        # for a reason that had nothing to do with this repository (observed:
        # `unexpected EOF`, `TLS handshake timeout`).
        #
        # The commit this run was created for is discovered from the remote
        # refs and then **verified**: a checkout that is not that commit is a
        # hard error, never a silent "some other tree was checked out".
        #
        # `scripts/gate/check_ci_checkout_consistency.sh` asserts that every
        # gated workflow embeds this exact body — one rule, one implementation.
        run: |
          set -euo pipefail
          REPO_URL="${CI_REPO_URL:-http://192.168.0.252:3000/openclaw/sqlrustgo.git}"
          DEPTH="${CI_DEPTH:-1}"
          SHA="${GITHUB_SHA:-${GITEA_SHA:-}}"
          DIR="${CI_CHECKOUT_DIR:-.}"
          if [ -z "$SHA" ]; then
            echo "FATAL: neither GITHUB_SHA nor GITEA_SHA is set - refusing to guess which commit to check out" >&2
            exit 1
          fi
          mkdir -p "$DIR"
          cd "$DIR"
          git init -q -b main .
          git remote add origin "$REPO_URL"
          if [ "$DEPTH" = "0" ]; then
            git fetch --no-tags --prune --no-recurse-submodules origin "+$SHA"
          else
            git fetch --no-tags --prune --no-recurse-submodules --depth="$DEPTH" origin "+$SHA"
          fi
          git checkout -q FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "FATAL: checked out $(git rev-parse HEAD) but this run is for $SHA" >&2
            exit 1
          fi
      - name: Install cargo-audit (skip if cached on PATH)
        # 4m46s to compile from source on first run; cached in $CARGO_HOME
        # which lives in runner.temp so it gets re-installed each CI run,
        # but only once per job. --locked pins transitive deps to exactly
        # the versions in the lockfile.
        run: |
          set -euo pipefail
          # Ensure cargo is on PATH
          if ! command -v cargo >/dev/null 2>&1; then
            if [ -x "$HOME/.cargo/bin/cargo" ]; then
              export PATH="$HOME/.cargo/bin:$PATH"
            fi
          fi
          if cargo audit --version >/dev/null 2>&1; then
            echo "cargo-audit already installed: $(cargo audit --version)"
          else
            echo "Installing cargo-audit (4m46s first-time build)..."
            cargo install cargo-audit --locked --version 0.22.1
          fi
          cargo audit --version
      - name: Pre-fetch advisory DB
        # Runs `cargo audit --json > /dev/null` which triggers the advisory
        # DB clone + fetch into $CARGO_HOME/advisory-db. We don't care about
        # the audit result here — just want the DB populated so the next
        # step's `cargo audit` runs deterministic and offline-tolerant.
        run: |
          set -euo pipefail
          mkdir -p "$CARGO_HOME"
          # --no-fetch on a non-existent DB fails; deliberately omit it
          # so the first run clones the advisory DB.
          echo "Pre-fetching advisory DB to $CARGO_HOME/advisory-db..."
          cargo audit --json >/dev/null 2>&1 || true
          if [ -d "$CARGO_HOME/advisory-db" ]; then
            echo "advisory DB present: $(du -sh "$CARGO_HOME/advisory-db" | cut -f1)"
            cd "$CARGO_HOME/advisory-db"
            git log --oneline -1 || true
            cd -
          else
            echo "WARNING: advisory DB not populated (network may be restricted)"
          fi
      - name: Run GA-3 security scan
        # check_security_scan_v312.sh runs SC-1..SC-4 and writes
        # docs/releases/v3.12.0/evidence/v312-59/GA3_SECURITY_SCAN_REPORT.md
        # plus per-check artifacts. This is the SC-1 fresh-audit source of
        # truth for GA promotion — without this job, SC-1 falls back to
        # baseline-acknowledged PASS even on fresh advisories.
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_security_scan_v312.sh
          bash scripts/gate/check_security_scan_v312.sh 2>&1 | tee ga3_security_scan.log
          RC=${PIPESTATUS[0]}
          echo "GA-3 security scan exit=$RC"
          if [ "$RC" -ne 0 ]; then
            echo "GA-3 security scan FAILED — see ga3_security_scan.log"
            exit "$RC"
          fi
      - name: Upload GA-3 evidence
        if: always()
        run: |
          mkdir -p artifacts/ga3/v3.12.0
          cp docs/releases/v3.12.0/evidence/v312-59/GA3_SECURITY_SCAN_REPORT.md artifacts/ga3/v3.12.0/ 2>/dev/null || true
          cp docs/releases/v3.12.0/evidence/v312-59/cargo_audit_v312.json artifacts/ga3/v3.12.0/ 2>/dev/null || true
          cp docs/releases/v3.12.0/evidence/v312-59/cargo_audit_v312.txt artifacts/ga3/v3.12.0/ 2>/dev/null || true
          cp ga3_security_scan.log artifacts/ga3/v3.12.0/ 2>/dev/null || true
          ls -la artifacts/ga3/v3.12.0/

  test-soak-detach:
    # Issue #4595 — Regression guard for run_soak_loop.sh self-detach block
    # (P-1 fix from PR #4591 commit 66dac1aab2). Without this test, future
    # refactors of run_soak_loop.sh could silently regress the
    # setsid+nohup+disown protection, re-introducing the parent-shell reap
    # bug that killed sqlrustgo mid-SOAK (7h28m evidence salvage).
    #
    # Issue #4597 — Chaos drills unit test (T8). Verifies chaos_drills.sh
    # has all 4 drill functions, dispatcher subcommands, EUID root guards
    # for netem/clock drills, and SOAK_NO_MAIN guard on run_soak_loop.sh
    # (so chaos_drills can source functions without triggering main).
    #
    # Issue #4598 — Tier-3 unit test (T11..T15). Verifies send_alert + curl
    # payload, parse_thread_ramp validation, run_thread_ramp wiring + per-level
    # CSV output + ALERT_PREV_SB_QPS reset between levels, and the SOP doc
    # presence/INDEX update. Behavioral sub-test (T12 sources send_alert
    # directly with stub log()) — no binary / root / network needed.
    #
    # This job runs the STATIC check only (~1s, no binary required). The
    # behavioral sub-test (SIGKILL parent + verify child survives) lives in
    # `bash scripts/soak/test_run_soak_loop_detach.sh --behavioral` and is
    # invoked manually on hp-z6g4 (too slow for PR CI gate). Same applies
    # to `bash scripts/soak/chaos_drills.sh smoke` (drill-1 SIGKILL+restart)
    # which requires the release binary (~5min build) and ~60s wall-clock.
    #
    # Branches: v3.12.0 line only (SOAK scripts are v3.12.0+). Fast enough
    # that we run on EVERY branch, not just v3.12.0 — but skip if branch is
    # develop/v3.11.x or earlier (the file may not even exist there).
    runs-on: [hp-z6g4]
    steps:
      - name: Checkout
        # #5448 / #5532 — the checkout is done against the **Gitea instance**
        # itself.  The runner used to download `actions/checkout` from GitHub
        # **once per job**, so a GitHub outage turned the whole pipeline red
        # for a reason that had nothing to do with this repository (observed:
        # `unexpected EOF`, `TLS handshake timeout`).
        #
        # The commit this run was created for is discovered from the remote
        # refs and then **verified**: a checkout that is not that commit is a
        # hard error, never a silent "some other tree was checked out".
        #
        # `scripts/gate/check_ci_checkout_consistency.sh` asserts that every
        # gated workflow embeds this exact body — one rule, one implementation.
        run: |
          set -euo pipefail
          REPO_URL="${CI_REPO_URL:-http://192.168.0.252:3000/openclaw/sqlrustgo.git}"
          DEPTH="${CI_DEPTH:-1}"
          SHA="${GITHUB_SHA:-${GITEA_SHA:-}}"
          DIR="${CI_CHECKOUT_DIR:-.}"
          if [ -z "$SHA" ]; then
            echo "FATAL: neither GITHUB_SHA nor GITEA_SHA is set - refusing to guess which commit to check out" >&2
            exit 1
          fi
          mkdir -p "$DIR"
          cd "$DIR"
          git init -q -b main .
          git remote add origin "$REPO_URL"
          if [ "$DEPTH" = "0" ]; then
            git fetch --no-tags --prune --no-recurse-submodules origin "+$SHA"
          else
            git fetch --no-tags --prune --no-recurse-submodules --depth="$DEPTH" origin "+$SHA"
          fi
          git checkout -q FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "FATAL: checked out $(git rev-parse HEAD) but this run is for $SHA" >&2
            exit 1
          fi
      - name: Verify scripts/soak/run_soak_loop.sh exists
        run: |
          if [[ ! -f scripts/soak/run_soak_loop.sh ]]; then
            echo "SKIP: scripts/soak/run_soak_loop.sh not present on this branch"
            exit 0
          fi
      - name: Run static detach regression check
        run: bash scripts/soak/test_run_soak_loop_detach.sh
      - name: Run static chaos drills regression check (#4597)
        run: bash scripts/soak/test_chaos_drills.sh
      - name: Run static Tier-3 regression check (#4598)
        # v312-59-d / #4598 P-11/P-8/P-12: alerting webhook + thread ramp + SOP doc.
        # Static + light behavioral (T12 sources send_alert with stub log()).
        # Does NOT require binary / root / network.
        run: bash scripts/soak/test_run_soak_loop_tier3.sh

  postcheck:
    runs-on: [hp-z6g4]
    # #5455: `needs: [test]` completely masked this job. The `test` job has
    # never succeeded (0 success / 8 fail / 16 cancel / 1 skip over 50 CI
    # cycles), so postcheck's 18 steps — the last set of criteria before a
    # release — **never executed once**. A post-release check has to run on
    # a branch that is already known to be red; otherwise it does not exist.
    needs: []
    steps:
      - name: Checkout
        # #5448 / #5532 — the checkout is done against the **Gitea instance**
        # itself.  The runner used to download `actions/checkout` from GitHub
        # **once per job**, so a GitHub outage turned the whole pipeline red
        # for a reason that had nothing to do with this repository (observed:
        # `unexpected EOF`, `TLS handshake timeout`).
        #
        # The commit this run was created for is discovered from the remote
        # refs and then **verified**: a checkout that is not that commit is a
        # hard error, never a silent "some other tree was checked out".
        #
        # `scripts/gate/check_ci_checkout_consistency.sh` asserts that every
        # gated workflow embeds this exact body — one rule, one implementation.
        env:
          CI_DEPTH: "0"
        run: |
          set -euo pipefail
          REPO_URL="${CI_REPO_URL:-http://192.168.0.252:3000/openclaw/sqlrustgo.git}"
          DEPTH="${CI_DEPTH:-1}"
          SHA="${GITHUB_SHA:-${GITEA_SHA:-}}"
          DIR="${CI_CHECKOUT_DIR:-.}"
          if [ -z "$SHA" ]; then
            echo "FATAL: neither GITHUB_SHA nor GITEA_SHA is set - refusing to guess which commit to check out" >&2
            exit 1
          fi
          mkdir -p "$DIR"
          cd "$DIR"
          git init -q -b main .
          git remote add origin "$REPO_URL"
          if [ "$DEPTH" = "0" ]; then
            git fetch --no-tags --prune --no-recurse-submodules origin "+$SHA"
          else
            git fetch --no-tags --prune --no-recurse-submodules --depth="$DEPTH" origin "+$SHA"
          fi
          git checkout -q FETCH_HEAD
          if [ "$(git rev-parse HEAD)" != "$SHA" ]; then
            echo "FATAL: checked out $(git rev-parse HEAD) but this run is for $SHA" >&2
            exit 1
          fi
      - name: Version detection
        id: version
        run: |
          set -euo pipefail
          # Detect the release line this checkout belongs to.
          #
          # #5446: the previous implementation only ever chose between
          # `origin/develop/v3.8.0` and `origin/develop/v3.7.0`, and the
          # checkout uses `fetch-depth: 1` — so neither remote branch exists
          # and the detection was **v3.7.0 on every branch**, v4.1.0
          # included. Every version-sensitive gate in this job then ran
          # against the v3.7.0 contract. The old default (`v3.7.0`) is gone:
          # a wrong-but-plausible version is worse than a visible failure,
          # because it makes a gate check a release line nobody asked about.
          #
          # The rule now lives in **one** script, shared with gate.yml, so
          # the two workflows cannot drift apart again.
          chmod +x scripts/gate/resolve_release_version.sh
          VER="$(bash scripts/gate/resolve_release_version.sh)"
          echo "detected version: ${VER}"
          echo "version=${VER}" >> "$GITHUB_OUTPUT"
      - name: Gate L1 — Code Quality
        run: |
          # #5443: without `pipefail` the step's exit code came from `tee`
          # (always 0), so this gate could never turn the step red.
          set -euo pipefail
          chmod +x gate/gate.sh
          # #5444: `"${version}"` was a **bash variable that is never set**
          # — a step output has to be read through the steps-output reference
          # (steps / step id / outputs / output name), not as a bash variable.
          #
          # ⚠️ #5517: **不要**把表达式模板原样写进注释。Gitea 扫描的是整个
          # `run:` 标量里的表达式占位符 —— **包括注释里的**。占位符里的尖括号
          # 不是合法的表达式符号 ⇒ 整个 workflow 解析失败 ⇒ 一个 job 都建不出来。
          # 这里因此只写「形状」不写「模板」。
          # With `set -u` (added by #5443) the unbound variable aborted the
          # step outright, and without it the gate silently ran against the
          # script's own default version.
          bash gate/gate.sh "${{ steps.version.outputs.version }}" 2>&1 | tee gate_report.log
      - name: Gate L1 — Coverage (real gate — #5444)
        run: |
          set -euo pipefail
          # #5444: this step used to call `scripts/gate/check_coverage.sh`,
          # a 288-byte **deprecated stub** whose whole body is
          # "deprecated" + `exit 2`. The real gate is
          # `check_coverage_v312.sh` — the very script STAGE_CONFIG.yaml's
          # GA `required_gates` lists. Coverage was neither measured nor
          # reported.
          #
          # `check_coverage_v312.sh` drives `cargo llvm-cov` over 8 crates,
          # so it needs the `cargo-llvm-cov` subcommand. When the runner
          # does not have it, that is an **environment blocker**, not a
          # code failure: it is recorded as NOT-RUN with a controlled
          # reason code rather than silently passing.
          if ! cargo llvm-cov --version >/dev/null 2>&1; then
            echo "NOT-RUN: reason=COVERAGE_TOOL_MISSING (cargo-llvm-cov is not installed on this runner)" \
              | tee coverage_report.log
            exit 0
          fi
          bash scripts/gate/check_coverage_v312.sh 2>&1 | tee coverage_report.log
      - name: Auto env:blocked (SPEC-021)
        run: |
          set -euo pipefail
          chmod +x scripts/gate/auto_env_blocker.sh
          # #5446: the version was hardcoded to `v3.8.0`, so on every other
          # branch this step tagged a 2024 release line's documents while
          # claiming to tag the current one.
          #
          # #5403: this script is a **pre-commit helper that rewrites
          # files**. Running the write mode inside CI rewrote the runner's
          # working tree (92 .md files under docs/releases/v4.1.0) — the
          # rewrite was never committed and the modified files then fed the
          # later steps. It also aborted half-way on a heading-less document:
          # `grep -n "^# " <file> | head -1` returns 1 under `pipefail` when
          # the file has no H1, so `set -e` killed the script before it
          # reached its own "no H1" branch. `--check` is read-only and does
          # not have that defect.
          bash scripts/gate/auto_env_blocker.sh --check "${{ steps.version.outputs.version }}" 2>&1 | tee auto_env_block.log
      - name: Evidence Binding Check
        run: |
          set -euo pipefail
          mkdir -p gate/evidence_binding_out
          # #5444: same unbound-variable defect as the "Gate L1 — Code
          # Quality" step: this step already had `set -euo pipefail`, so
          # `"${version}"` aborted it with "version: unbound variable" —
          # the step had been failing all along, unnoticed because
          # postcheck never executed (#5455).
          bash scripts/gate/check_evidence_binding.sh "${{ steps.version.outputs.version }}" "gate/evidence_binding_out/" 2>&1 | tee evidence_binding.log
      - name: Anti-Fabrication Check (AFP v3.8.0+) — FIX 2026-06-26 Hermes / pipefail
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_anti_fabrication.sh
          bash scripts/gate/check_anti_fabrication.sh 2>&1 | tee anti_fabrication.log
      # PR #5354 follow-up: wire check_agent_harness.sh into CI.
      # Validates root AGENTS.md / CLAUDE.md + docs/agent-harness/ + version
      # facts. Shell-only, ~1s, no cargo build required. Mirrors the pattern
      # used by V312-19 below: capture PIPESTATUS, fail on rc=1, surface rc=2
      # as a named DRIFT entry rather than a hard block. Defensive skip when
      # the script is absent (older branches pre-dating #5354).
      # PR #5355: the gate now ignores CLAUDE.md when .gitignore excludes it,
      # so a fresh checkout is structurally valid.
      - name: Agent Harness structural gate (D-AgentHarness, #5354+#5355)
        run: |
          set -euo pipefail
          if [ ! -f scripts/gate/check_agent_harness.sh ]; then
            echo "SKIP: scripts/gate/check_agent_harness.sh not present on this branch (pre-#5354)"
            exit 0
          fi
          chmod +x scripts/gate/check_agent_harness.sh
          bash scripts/gate/check_agent_harness.sh 2>&1 | tee agent_harness_gate.log
          RC=${PIPESTATUS[0]}
          echo "D-AgentHarness exit=$RC"
          if [ "$RC" -eq 2 ]; then
            echo "D-AgentHarness: DRIFT (exit 2) — recorded, not blocking"
          elif [ "$RC" -ne 0 ]; then
            echo "D-AgentHarness gate FAILED — see agent_harness_gate.log"
            exit "$RC"
          fi
      # Issue #5197: tracked paths differing only by case are one file on
      # macOS/Windows, so checkout breaks there while CI (Linux) stays
      # green. Detected over the index, since on a case-insensitive volume
      # the working tree has already lost one of the pair.
      - name: Path casefold conflict check
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_path_casefold_conflict.sh
          bash scripts/gate/check_path_casefold_conflict.sh
      # Issue #5500: C6 covers "no home-rooted absolute path"; this is the
      # **separate** criterion for the other machine-specific shape — an
      # absolute path under an install root (`/opt/homebrew/…`) and a
      # literal credential for an external database client. A test tree
      # that pins one machine's homebrew prefix and one machine's user name
      # silently degrades to "the external client was never there".
      # The gate's own `--selftest` proves it can still tell a violation
      # from a clean sample.
      - name: External-tool path check (#5500, C7)
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_test_external_tool_paths.sh
          bash scripts/gate/check_test_external_tool_paths.sh --selftest
          bash scripts/gate/check_test_external_tool_paths.sh
      # Issue #5499: a documentation pointer that reads like evidence but
      # does not resolve (`Full report: `docs/…/MISSING.md``) is a broken
      # link that the markdown-link checker cannot see, because it only
      # looks at `[text](path)` syntax. This gate covers the release line
      # being shipped: no **new** broken pointer, and the recorded debt is
      # enumerated with a reason for each entry.
      - name: Documentation pointer-path check (#5499)
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_docs_pointer_paths.sh
          bash scripts/gate/check_docs_pointer_paths.sh --selftest
          bash scripts/gate/check_docs_pointer_paths.sh --scope docs/releases/v4.1.0
      # Issues #5437 / #5438: `docs/governance/STAGE_CONFIG.yaml` calls itself
      # the single source of truth for the stage framework, but it contradicted
      # itself — the same G number meant three different things in three files,
      # and five G numbers pointed at scripts that had nothing to do with what
      # the G number names (Soak -> the full-gate aggregator, Crash -> the
      # drift detector, Upgrade -> the cross-version debt ledger, Audit Log ->
      # the anti-fabrication check, Savepoint -> the architecture semantic-debt
      # gate). "GA has N gates" was therefore unauditable: a reviewer counting
      # gates got a different number depending on which document they trusted.
      #
      # This gate checks the SSOT against itself: every path it names exists,
      # every G alias names a script that *declares that G number* and is
      # recognisable from the G's own name, and every artifact entry is a
      # path rather than a path with an annotation glued on. The gate's
      # `--selftest` proves it can still tell a violation from a clean sample.
      - name: Stage-config consistency gate (#5437, #5438)
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_stage_config_consistency.sh
          bash scripts/gate/check_stage_config_consistency.sh --selftest
          bash scripts/gate/check_stage_config_consistency.sh
      # Issue #5440: `scripts/gate/check_stage.sh` was the SSOT's only
      # executor and **no CI job ever called it** — the stage framework was a
      # declarative document with nobody consuming it. This step makes the SSOT
      # executable in CI: the driver resolves the current stage's gate list
      # and artifact list from `STAGE_CONFIG.yaml` and reports what it would
      # run. `--dry-run` is used on purpose — the *full* stage gate is
      # executed at promotion time, not on every push, because a gate list
      # that must run on every commit is a gate list that is always red.
      - name: Stage driver resolves the SSOT (#5440)
        run: |
          set -euo pipefail
          bash scripts/gate/check_stage.sh --version v4.1.0 --dry-run
      # Issue #5542: `scripts/gate/verify_pr_dag.sh` is the executable criterion
      # behind BE5 / B-F5 (docs/governance/GATE_CONDITIONS.md:103/129), but its
      # default base ref (`origin/develop/v4.1.0`) could not be resolved in
      # EITHER environment: this repository has no `origin` remote, and the CI
      # checkout fetches a single SHA, which creates no remote-tracking branch.
      # The gate therefore answered DRIFT (exit 2) everywhere — the criterion
      # was never executable, and the five regression cases in
      # tests/integration/gate/gate_criterion_existence_test.rs failed on every
      # CI run. The base ref is now a release LINE resolved through a
      # deterministic chain; its `--selftest` proves the chain still tells a
      # resolvable checkout from an unresolvable one, and that an explicitly
      # requested base is never silently replaced.
      #
      # The gate itself is NOT run here: on the runner's shallow checkout it
      # correctly refuses to judge (DRIFT), and BE5 / B-F5 are release-time
      # criteria — the same arrangement as `check_stage.sh --dry-run` above.
      - name: PR-DAG gate base-ref resolution (#5542)
        run: |
          set -euo pipefail
          bash scripts/gate/verify_pr_dag.sh --selftest
      # Issue #5439: v4.1.0 was missing 4 of the 5 GA `required_files` and
      # 4 of the 6 GA `doc_artifacts`, and **nothing noticed** — the
      # evidence-binding gate only walks the `.md` files that exist, and
      # `doc_artifacts` were never read by any code at all. This gate is the
      # missing "required document list": it reads the same list the driver
      # reads and fails when an artifact of the current stage is missing. It
      # also *discloses* what the later stages still need, so "we are nowhere
      # near GA" is a fact somebody can read instead of a fact that has to be
      # re-derived by hand.
      - name: Release-artifact presence gate (#5439)
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_release_artifacts.sh
          bash scripts/gate/check_release_artifacts.sh --selftest
          bash scripts/gate/check_release_artifacts.sh --version v4.1.0
      # Issue #5193 option C: `planner`/`executor` are declared not to be on
      # the production execution path. This gate is what keeps that
      # declaration honest — it fails if one of them is referenced from a
      # production engine module without going back through the audit, and
      # it fails if the exclusion registry itself goes stale. Without it in
      # CI the declaration is a comment nobody checks.
      - name: Off-production-path registry check (#5193 option C)
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_off_production_path_registry.sh
          bash scripts/gate/check_off_production_path_registry.sh
      # Issue #5199 item 3 (F6): a correctness test green on a non-production
      # storage proves nothing about production. The server's production
      # storage-selection block must keep its default file-backed and must not
      # introduce MemoryStorage. Without this in CI the "tests cover the
      # production config" invariant is a comment nobody checks.
      - name: Production storage default check (#5199 item 3)
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_correctness_tests_production_storage.sh
          bash scripts/gate/check_correctness_tests_production_storage.sh
      # Issue #5192: a storage wrapper that fails to forward a
      # database-scoped StorageEngine method silently answers for the current
      # database. Nine such omissions were each found after a separate
      # investigation; this makes the tenth a CI failure instead.
      - name: Storage DB-scope coverage check (#5192)
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_storage_db_scope_coverage.sh
          bash scripts/gate/check_storage_db_scope_coverage.sh
      - name: Fix-PR Test Registry Check (v4.1.0+) — every fix PR's test file must exist + compile
        if: contains(github.ref, 'develop/v4.1.0') || contains(github.ref, 'develop/v4.') || contains(github.ref, 'release/v4.')
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_fix_pr_test_registry.sh
          bash scripts/gate/check_fix_pr_test_registry.sh 2>&1 | tee fix_pr_test_registry.log
      - name: Doc Completeness Check (v3.8.0 mandatory docs) — FIX 2026-06-26 Hermes / pipefail
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_docs_consistency.sh
          bash scripts/gate/check_docs_consistency.sh 2>&1 | tee docs_consistency.log
      - name: Doc Completeness Check (dedicated, v3.8.0+) [Issue #2941 supplement] — FIX 2026-06-26 Hermes / pipefail
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_document_completeness.sh
          # #5446: this step hardcoded `v3.8.0` — the script reads
          # `docs/releases/$VERSION/`, so on the v4.1.0 branch it was checking
          # a 2024 release line's documents while claiming to check the
          # current one. The version comes from the detection step now.
          mkdir -p "artifacts/gate/${{ steps.version.outputs.version }}/document_completeness"
          bash scripts/gate/check_document_completeness.sh "${{ steps.version.outputs.version }}" "artifacts/gate/${{ steps.version.outputs.version }}/document_completeness/" 2>&1 | tee document_completeness.log
      - name: Alpha Gate (SPEC-021)
        run: |
          set -euo pipefail
          # #5446: this step ran `check_alpha_v380.sh` — the **v3.8.0** alpha
          # gate — no matter which branch the workflow ran on. The gate
          # scripts are named per version and the spelling is not uniform
          # (`check_alpha_v410.sh` vs `check_alpha_v3.12.0.sh`).
          #
          # The naming rule now lives in one script, shared with gate.yml,
          # so the two workflows cannot drift apart again.
          VER="${{ steps.version.outputs.version }}"
          set +e
          GATE="$(bash scripts/gate/resolve_alpha_gate.sh "$VER")"
          RC=$?
          set -e
          if [ "$RC" -eq 3 ]; then
            # No gate script exists for this release line. That is a
            # configuration gap, not a pass: it is recorded as NOT-RUN with
            # a reason code rather than as a green result.
            echo "NOT-RUN: reason=ALPHA_GATE_NOT_FOUND (no check_alpha_v*.sh serves version ${VER})"
            exit 0
          fi
          if [ "$RC" -ne 0 ]; then
            echo "::error::alpha gate resolution failed (rc=${RC})"
            exit "$RC"
          fi
          echo "alpha gate: ${GATE}"
          mkdir -p "artifacts/gate/${VER}"
          bash "$GATE" 2>&1 | tee alpha_gate.log
      - name: RC/GA Gate — Unified 6-Dim (Issue #2882)
        run: |
          # #5443: without `pipefail` the step's exit code came from `tee`
          # (always 0) — a hard D3 failure could not turn this step red.
          set -euo pipefail
          bash scripts/gate/check_rc_ga_gate.sh ga 2>&1 | tee rc_ga_gate.log
      - name: V312-19 Release Gates (Issue #3906) — SQL corpus + R2 + signoff freshness
        if: contains(github.ref, 'develop/v3.12.0') || contains(github.ref, 'ci/v3.12.0-')
        run: |
          set -euo pipefail
          chmod +x scripts/gate/check_v312_19_release_gates.sh
          bash scripts/gate/check_v312_19_release_gates.sh 2>&1 | tee v312_19_release_gates.log
          # V312-19 strict-close condition: artifacts must be present and fresh.
          # Drift (exit 2) is acceptable but tracked; fail (exit 1) blocks merge.
          RC_V312_19=$(cat v312_19_release_gates.log | tail -1 | grep -oE 'exit [0-9]+' | tail -1 | awk '{print $2}' || echo "0")
          if [ "$RC_V312_19" = "1" ]; then
            echo "V312-19 release gates FAILED (artifacts missing or stale) — blocking PR merge"
            exit 1
          fi
      # restored step: the "- name:" line of this block was lost in an earlier
      # edit, fusing its `run:` onto the V312-19 step above. Two `run:` keys in
      # one step is a duplicate YAML mapping key, which Gitea's strict workflow
      # parser rejects — every push/PR to this repo failed with
      # "Invalid workflow file" before this fix (run #6575 et al.).
      - name: Test Plan Audit (Issue #2881 → mandatory via #2882)
        run: |
          set -euo pipefail
          # #5446: the version was hardcoded to `v3.8.0`; the script reads
          # `docs/releases/$VERSION/`, so on any other branch it audited the
          # wrong release line.
          mkdir -p "artifacts/audit/${{ steps.version.outputs.version }}"
          bash scripts/gate/audit_testing.sh "${{ steps.version.outputs.version }}" ga "artifacts/audit/${{ steps.version.outputs.version }}" 2>&1 | tee audit_testing.log
      - name: "D9 Full Gate Verification (8 dim: D1-D8 + cross-version + test plan + PR template)"
        run: |
          set -euo pipefail
          bash scripts/gate/check_full_gate_verification.sh 2>&1 | tee full_gate_verification.log
      - name: 6 Meta-Gate Hard Block (P11-P16, FIX 2026-06-26 Hermes) — blocks PR merge
        if: always()
        run: |
          set -euo pipefail
          FAILED=0
          for g in check_gate_self_verification check_ignore_count \
                   check_test_count_monotonic check_drift_not_pass \
                   check_oracle_present check_gate_test_integrity; do
              echo "=== $g ==="
              chmod +x scripts/gate/$g.sh
              if bash scripts/gate/$g.sh 2>&1 | tail -10; then
                  echo "  ✅ PASS: $g"
              else
                  echo "  ❌ FAIL: $g (meta-gate hard block, P0 2026-06-26)"
                  FAILED=$((FAILED+1))
              fi
          done
          if [ $FAILED -gt 0 ]; then
              echo ""
              echo "=== META-GATE HARD BLOCK: $FAILED/6 meta-gate(s) FAILED ==="
              echo "=== PR cannot merge until meta-gate fix ==="
              exit 1
          fi
          echo "=== 6/6 META-GATES PASS ==="
      - name: Gate summary
        if: always()
        run: |
          set -uo pipefail
          # #5456: `grep -c` prints the count **and exits 1 on zero matches**.
          # The old `|| echo "0"` therefore appended a *second* 0, so the
          # variable became the two-line string "0\n0"; `[ "0\n0" -gt 0 ]`
          # could not parse it, returned 2, and an `if` treats 2 as false.
          # In other words: in the only normal case (zero failures) all ten
          # counters were skipped through a parse error, and every run left
          # ten lines of "integer expression expected" in the job log.
          #
          # #5483: the `if` block was never closed — the whole step body was
          # a bash syntax error and always exited 2, so this summary had
          # never judged anything at all.
          #
          # count_matches() normalises all three cases (0 matches / missing
          # file / N matches) into exactly one integer.
          count_matches() {
            local n
            n="$(grep -c -- "$1" "$2" 2>/dev/null | head -1 || true)"
            printf '%s' "${n:-0}"
          }
          # The canonical failure marker is the ASCII token `[FAIL]`, which
          # `gate/gate.sh` already emits and which the three gate scripts
          # below now emit too (#5443: the visual ❌/✗ variants drifted apart
          # and the CI greps matched a different code point than the scripts
          # printed, so the counters were structurally 0).
          GATE_FAIL=$(count_matches '\[FAIL\]' gate_report.log)
          COVERAGE_FAIL=$(count_matches 'FAIL\|failed' coverage_report.log)
          EVIDENCE_FAIL=$(count_matches 'FAIL\|failed\|error' evidence_binding.log)
          AFP_FAIL=$(count_matches 'FAIL\|failed\|error' anti_fabrication.log)
          DOCS_FAIL=$(count_matches 'FAIL\|failed\|error' docs_consistency.log)
          ALPHA_FAIL=$(count_matches '\[FAIL\]' alpha_gate.log)
          RC_GA_FAIL=$(count_matches '\[FAIL\]\|blocker' rc_ga_gate.log)
          AUDIT_FAIL=$(count_matches 'RESULT: FAIL' audit_testing.log)
          D9_FAIL=$(count_matches '\[FAIL\]' full_gate_verification.log)
          V312_19_FAIL=0
          if [ -f v312_19_release_gates.log ]; then
            V312_19_FAIL=$(count_matches 'V312-19 release gates FAILED\|blockers: [^0]' v312_19_release_gates.log)
          fi
          echo "Gate: failed=$GATE_FAIL coverage=$COVERAGE_FAIL evidence=$EVIDENCE_FAIL alpha_gate=$ALPHA_FAIL rc_ga=$RC_GA_FAIL audit=$AUDIT_FAIL d9=$D9_FAIL v312_19=$V312_19_FAIL"
          if [ "$GATE_FAIL" -gt 0 ] || [ "$COVERAGE_FAIL" -gt 0 ] || [ "$EVIDENCE_FAIL" -gt 0 ] || [ "$AFP_FAIL" -gt 0 ] || [ "$DOCS_FAIL" -gt 0 ] || [ "$ALPHA_FAIL" -gt 0 ] || [ "$RC_GA_FAIL" -gt 0 ] || [ "$AUDIT_FAIL" -gt 0 ] || [ "$D9_FAIL" -gt 0 ] || [ "$V312_19_FAIL" -gt 0 ]; then
            echo "L1 gate failed (incl. AFP / doc completeness / evidence binding / alpha gate / rc-ga gate / audit_testing / D9 full gate / V312-19 release gates)"
            exit 1
          fi
