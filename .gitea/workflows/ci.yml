name: Hermes Pipeline
run-name: ${{ gitea.ref_name }} - ${{ gitea.sha }}

on:
  push:
    branches:
      - develop/v2.8.0
      - develop/v3.7.0
      - develop/v3.8.0
      - beta/v2.8.0
      - ci/gitea-compat
      - ci/v2.8.0-*
      - ci/v3.8.0-*
  pull_request:
    branches:
      - develop/v2.8.0
      - develop/v3.7.0
      - develop/v3.8.0
      - develop/v3.9.0
      - beta/v2.8.0
      - ci/gitea-compat
      - ci/v2.8.0-*
      - ci/v3.8.0-*

env:
  CARGO_TERM_COLOR: always
  # P0 (P0 P1 cap on runner — auto-derived from runner.temp):
  CARGO_HOME: ${{ runner.temp }}/.cargo
  RUSTUP_HOME: ${{ runner.temp }}/.rustup

# Combined lint + build: share one clone, build once
jobs:
  lint-build:
    runs-on: [hp-z6g4]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Clippy
        run: cargo clippy --all-features -- -D warnings
      - name: Format check
        run: cargo fmt --check --all
      - name: Build
        run: cargo build --all-features

  test:
    runs-on: [hp-z6g4]
    needs: [lint-build]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Build
        run: cargo build --all-features
      - name: Run tests
        run: |
          cargo test --all-features 2>&1 | tee test_report.log
      - name: Test summary
        if: always()
        run: |
          PASS=$(grep -c 'test result: ok' test_report.log 2>/dev/null || echo "0")
          FAIL=$(grep -c 'test result: FAILED' test_report.log 2>/dev/null || echo "0")
          echo "Tests: passed=$PASS failed=$FAIL"
          if [ "$FAIL" -gt 0 ]; then exit 1; fi
      - name: Gate G1 — TPC-H 22/22 baseline (issue #3186)
        if: github.event_name == 'pull_request' || contains(github.ref, 'develop/v3.9.0')
        run: |
          chmod +x scripts/gate/check_g1_tpch_baseline.sh
          bash scripts/gate/check_g1_tpch_baseline.sh 2>&1 | tee g1_report.log
        # NOTE: this step currently fails by design until the baseline hash in
        # tests/tpch_hashes_v380.json is filled in (see the OpenSpec change
        # g1-tpch-baseline). Once filled, this step is the single source of
        # truth for "did anything change in TPC-H output?".

  # P2-3: 5-min integration smoke test (only on develop/v3.9.0 branch).
  # Validates the sqlrustgo-mysql-server actually serves real wire protocol
  # traffic under a hard memory cap (P0 fix). Catches regressions that
  # cargo test alone misses (e.g. in-process shortcuts that bypass the
  # wire protocol stack).
  stability-smoke:
    runs-on: [hp-z6g4]
    needs: [lint-build]
    if: contains(github.ref, 'develop/v3.9.0')
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Setup
        run: |
          chmod +x scripts/stability/run_soak.sh
          chmod +x scripts/stability/test_integration_5min.sh
          # Verify binary exists (P0: required to skip build time for 5min run)
          ls -la target/release/sqlrustgo-mysql-server 2>/dev/null || \
            cargo build --release --bin sqlrustgo-mysql-server
      - name: P0 enforce + 5min integration smoke
        # P0 defaults: ulimit -v 8GB, FD 1024, RSS absolute watchdog.
        # P1: port auto-alloc, registry, STATUS.md dashboard.
        # P2-2: notify on completion (logs only, no email/webhook in CI).
        run: |
          NOTIFY_REPORT=0 \
            bash scripts/stability/run_soak.sh 5min 2>&1 | tee smoke.log
      - name: Verify STABILITY_REPORT.md generated
        if: always()
        run: |
          if [ ! -f test_results/*/STABILITY_REPORT.md ] && \
             [ ! -f $HOME/sqlrustgo-integration-test-*/STABILITY_REPORT.md ]; then
            echo "FAIL: no STABILITY_REPORT.md generated"
            cat smoke.log | tail -50
            exit 1
          fi
          # Find the report
          REPORT=$(find . $HOME -name 'STABILITY_REPORT.md' -mmin -10 2>/dev/null | head -1)
          echo "Report: $REPORT"
          # Check verdict
          VERDICT=$(grep -oE '\*\*(PASS|FAIL|NEEDS REVIEW)\*\*' "$REPORT" 2>/dev/null | head -1)
          echo "Verdict: $VERDICT"
          if [ "$VERDICT" = "**FAIL**" ] || [ "$VERDICT" = "**NEEDS REVIEW**" ]; then
            echo "FAIL: smoke test verdict is $VERDICT"
            exit 1
          fi
      - name: Archive smoke report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: stability-smoke-report
          path: |
            test_results/**/STABILITY_REPORT.md
            $HOME/sqlrustgo-integration-test-*/STABILITY_REPORT.md
            smoke.log
          if-no-files-found: ignore
          retention-days: 30

  postcheck:
    runs-on: [hp-z6g4]
    needs: [test]
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - name: Version detection
        id: version
        run: |
          # Detect version from branch or VERSION file
          VERSION="v3.7.0"
          if git rev-parse --verify origin/develop/v3.8.0 &>/dev/null; then
            VERSION="v3.8.0"
          elif git rev-parse --verify origin/develop/v3.7.0 &>/dev/null; then
            VERSION="v3.7.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Gate L1 — Code Quality
        run: |
          chmod +x gate/gate.sh
          bash gate/gate.sh "${version}" 2>&1 | tee gate_report.log
      - name: Gate L1 — Coverage
        run: |
          bash scripts/gate/check_coverage.sh 2>&1 | tee coverage_report.log
      - name: Auto env:blocked (SPEC-021)
        run: |
          chmod +x scripts/gate/auto_env_blocker.sh
          bash scripts/gate/auto_env_blocker.sh v3.8.0 2>&1 | tee auto_env_block.log || true
      - name: Evidence Binding Check
        run: |
          mkdir -p gate/evidence_binding_out
          bash scripts/gate/check_evidence_binding.sh "${version}" "gate/evidence_binding_out/" 2>&1 | tee evidence_binding.log
      - name: Anti-Fabrication Check (AFP v3.8.0+)
        run: |
          chmod +x scripts/gate/check_anti_fabrication.sh
          bash scripts/gate/check_anti_fabrication.sh 2>&1 | tee anti_fabrication.log
      - name: Doc Completeness Check (v3.8.0 mandatory docs)
        run: |
          chmod +x scripts/gate/check_docs_consistency.sh
          bash scripts/gate/check_docs_consistency.sh 2>&1 | tee docs_consistency.log
      - name: Doc Completeness Check (dedicated, v3.8.0+) [Issue #2941 supplement]
        run: |
          chmod +x scripts/gate/check_document_completeness.sh
          mkdir -p artifacts/gate/v3.8.0/document_completeness
          bash scripts/gate/check_document_completeness.sh v3.8.0 artifacts/gate/v3.8.0/document_completeness/ 2>&1 | tee document_completeness.log
      - name: Alpha Gate (SPEC-021)
        run: |
          mkdir -p artifacts/gate/v3.8.0
          bash scripts/gate/check_alpha_v380.sh 2>&1 | tee alpha_gate.log
      - name: RC/GA Gate — Unified 6-Dim (Issue #2882)
        run: |
          bash scripts/gate/check_rc_ga_gate.sh ga 2>&1 | tee rc_ga_gate.log
      - name: Test Plan Audit (Issue #2881 → mandatory via #2882)
        run: |
          mkdir -p artifacts/audit/v3.8.0
          bash scripts/gate/audit_testing.sh v3.8.0 ga artifacts/audit/v3.8.0 2>&1 | tee audit_testing.log
      - name: "D9 Full Gate Verification (8 dim: D1-D8 + cross-version + test plan + PR template)"
        run: |
          bash scripts/gate/check_full_gate_verification.sh 2>&1 | tee full_gate_verification.log
      - name: Gate summary
        if: always()
        run: |
          GATE_FAIL=$(grep -c '\[FAIL\]' gate_report.log 2>/dev/null || echo "0")
          COVERAGE_FAIL=$(grep -c 'FAIL\|failed' coverage_report.log 2>/dev/null || echo "0")
          EVIDENCE_FAIL=$(grep -c 'FAIL\|failed\|error' evidence_binding.log 2>/dev/null || echo "0")
          AFP_FAIL=$(grep -c 'FAIL\|failed\|error' anti_fabrication.log 2>/dev/null || echo "0")
          DOCS_FAIL=$(grep -c 'FAIL\|failed\|error' docs_consistency.log 2>/dev/null || echo "0")
          ALPHA_FAIL=$(grep -c '❌ FAIL' alpha_gate.log 2>/dev/null || echo "0")
          RC_GA_FAIL=$(grep -c '❌ FAIL\|blocker' rc_ga_gate.log 2>/dev/null || echo "0")
          AUDIT_FAIL=$(grep -c 'RESULT: FAIL' audit_testing.log 2>/dev/null || echo "0")
          D9_FAIL=$(grep -c '❌ FAIL\|exit 1' full_gate_verification.log 2>/dev/null || echo "0")
          echo "Gate: failed=$GATE_FAIL coverage=$COVERAGE_FAIL evidence=$EVIDENCE_FAIL alpha_gate=$ALPHA_FAIL rc_ga=$RC_GA_FAIL audit=$AUDIT_FAIL d9=$D9_FAIL"
          # SPEC-021: Evidence binding FAIL must block merge (Anti-Fabrication)
          if [ "$GATE_FAIL" -gt 0 ] || [ "$COVERAGE_FAIL" -gt 0 ] || [ "$EVIDENCE_FAIL" -gt 0 ] || [ "$AFP_FAIL" -gt 0 ] || [ "$DOCS_FAIL" -gt 0 ] || [ "$ALPHA_FAIL" -gt 0 ] || [ "$RC_GA_FAIL" -gt 0 ] || [ "$AUDIT_FAIL" -gt 0 ] || [ "$D9_FAIL" -gt 0 ]; then
            echo "L1 gate failed (incl. AFP / doc completeness / evidence binding / alpha gate / rc-ga gate / audit_testing / D9 full gate)"
            exit 1
          fi
          echo "All postcheck gates passed"
