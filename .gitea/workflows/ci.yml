name: Hermes Pipeline
run-name: ${{ gitea.ref_name }} - ${{ gitea.sha }}

on:
  push:
    branches:
      - develop/v2.8.0
      - develop/v3.7.0
      - beta/v2.8.0
      - ci/gitea-compat
      - ci/v2.8.0-*
  pull_request:
    branches:
      - develop/v2.8.0
      - develop/v3.7.0
      - beta/v2.8.0
      - ci/gitea-compat
      - ci/v2.8.0-*

env:
  CARGO_TERM_COLOR: always

# Combined lint + build: share one clone, build once
jobs:
  lint-build:
    runs-on: [hp-z6g4]
    steps:
      - name: Checkout
        run: |
          REPO="openclaw/sqlrustgo"
          git clone --depth=1 "http://192.168.0.252:3000/$REPO" repo
          cd repo
          git fetch --depth=1 origin "$GITEA_SHA"
          git checkout "$GITEA_SHA"
      - name: Clippy
        run: |
          cd repo
          cargo clippy --all-features -- -D warnings
      - name: Format check
        run: |
          cd repo
          cargo fmt --check --all
      - name: Build
        run: |
          cd repo
          cargo build --all-features

  test:
    runs-on: [hp-z6g4]
    needs: [lint-build]
    steps:
      - name: Checkout
        run: |
          REPO="openclaw/sqlrustgo"
          git clone --depth=1 "http://192.168.0.252:3000/$REPO" repo
          cd repo
          git fetch --depth=1 origin "$GITEA_SHA"
          git checkout "$GITEA_SHA"
      - name: Build
        run: |
          cd repo
          cargo build --all-features
      - name: Run tests
        run: |
          cd repo
          cargo test --all-features 2>&1 | tee test_report.log
      - name: Test summary
        if: always()
        run: |
          cd repo
          PASS=$(grep -c 'test result: ok' test_report.log 2>/dev/null || echo "0")
          FAIL=$(grep -c 'test result: FAILED' test_report.log 2>/dev/null || echo "0")
          echo "Tests: passed=$PASS failed=$FAIL"
          if [ "$FAIL" -gt 0 ]; then exit 1; fi

  postcheck:
    runs-on: [hp-z6g4]
    needs: [test]
    steps:
      - name: Checkout
        run: |
          REPO="openclaw/sqlrustgo"
          git clone --depth=1 "http://192.168.0.252:3000/$REPO" repo
          cd repo
          git fetch --depth=1 origin "$GITEA_SHA"
          git checkout "$GITEA_SHA"
      - name: Version detection
        id: version
        run: |
          cd repo
          # Detect version from branch or VERSION file
          VERSION="v3.7.0"
          if git rev-parse --verify origin/develop/v3.8.0 &>/dev/null; then
            VERSION="v3.8.0"
          elif git rev-parse --verify origin/develop/v3.7.0 &>/dev/null; then
            VERSION="v3.7.0"
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: Gate L1 — Code Quality
        run: |
          cd repo
          chmod +x gate/gate.sh
          bash gate/gate.sh "${version}" 2>&1 | tee gate_report.log
      - name: Gate L1 — Coverage
        run: |
          cd repo
          bash scripts/gate/check_coverage.sh 2>&1 | tee coverage_report.log
      - name: Evidence Binding Check
        run: |
          cd repo
          mkdir -p gate/evidence_binding_out
          bash scripts/gate/check_evidence_binding.sh "${version}" "gate/evidence_binding_out/" 2>&1 | tee evidence_binding.log
      - name: Gate summary
        if: always()
        run: |
          cd repo
          GATE_FAIL=$(grep -c '\[FAIL\]' gate_report.log 2>/dev/null || echo "0")
          COVERAGE_FAIL=$(grep -c 'FAIL\|failed' coverage_report.log 2>/dev/null || echo "0")
          EVIDENCE_FAIL=$(grep -c 'FAIL\|failed\|error' evidence_binding.log 2>/dev/null || echo "0")
          echo "Gate: failed=$GATE_FAIL coverage=$COVERAGE_FAIL evidence=$EVIDENCE_FAIL"
          if [ "$GATE_FAIL" -gt 0 ] || [ "$COVERAGE_FAIL" -gt 0 ]; then
            echo "L1 gate failed"
            exit 1
          fi
          echo "All postcheck gates passed"