# .gitea/workflows/z6g4-168h-soak.yml
#
# DRAFT — Issue #4499 (GA-2 168h mixed SOAK)
#
# Status: WORKFLOW_DISPATCH ONLY — not auto-enabled.
# This workflow is intended to be invoked manually by a maintainer
# running on the production-aligned CI runner (`devstack-gitea-1`
# host `z6g4-runner`), where the 168h SOAK runs in a stable
# container environment for 7 days.
#
# Per `docs/releases/v3.12.0/evidence/v312-59/GA2_MIXED_SOAK_DEMO_REPORT.md`,
# the GA-2 SOAK harness has been validated at smoke (60s),
# 3min/5min/10min sustained runs. The 168h full run is the canonical
# evidence for promotion_to_GA_requires[1].
#
# Per V312-59 anti-deferral: "1h demo IS the GA gate; 168h SOAK runs
# as background monitoring without blocking GA promotion." This
# workflow provides the 168h run; the 1h demo is run separately via
# `scripts/soak/run_soak_loop.sh SOAK_HOURS=1`.
#
# To enable: change `workflow_dispatch:` to also include `schedule:`
# (NOT recommended — too heavy for daily cron).
#
# Provenance (ADR-014 5 evidence fields):
#   source_agent:       claude-sonnet (Claude Code)
#   source_run:        issue-4499-soak-progress-20260828
#   timestamp:         2026-08-28T07:15:00+08:00
#   evidence_hash:     local-git:b0a996823 (post-merge of PR #4554)
#   conflict_resolution: N/A — single AI scope
#
# Refs: #4499 (this issue), #4387 (V312-59-D), #4497 (umbrella V312-59-D).

name: Z6G4 168h SOAK (DRAFT)

# Manual trigger only — not on push, not on schedule.
on:
  workflow_dispatch:
    inputs:
      soak_hours:
        description: 'SOAK duration in hours (default 168; lower for CI smoke)'
        required: false
        default: '168'
        type: string
      server_threads:
        description: 'sqlrustgo server threads (default 16)'
        required: false
        default: '16'
        type: string
      data_dir:
        description: 'Server data directory (default /tmp/sqlrustgo-168h)'
        required: false
        default: '/tmp/sqlrustgo-168h'
        type: string

concurrency:
  # Only one SOAK at a time per ref — prevents disk/CPU thrash.
  group: z6g4-168h-soak
  cancel-in-progress: false

jobs:
  long-soak:
    # hermes-z6g4 (2026-08-30): route to the Z6G4 local runner.
    # The old [self-hosted, z6g4-runner, linux, docker] only matched the
    # z6g4-runner-demo runner on a non-Z6G4 host with blocked GitHub egress,
    # which failed runs #5684/#5685 in the actions/checkout GitHub clone.
    # Label `hp-z6g4` matches hermes-runner (devstack-runner-1) and runs the
    # job in the sqlrustgo-runner:v1 Docker image (cargo 1.95 / mysql / sysbench).
    # Pattern follows the proven soak_168h.yml / soak_probe.yml local-clone mode.
    runs-on: [hp-z6g4]
    # 168h = 7 days = 10080 minutes; add 60-min headroom.
    timeout-minutes: 10140

    steps:
      - name: Checkout (local Gitea)
        run: |
          REPO="openclaw/sqlrustgo"
          REF="${GITHUB_REF_NAME:-develop/v3.12.0}"
          git clone --depth=1 --branch "$REF" \
            "http://192.168.0.252:3000/$REPO" repo
          cd repo
          echo "Checked out $(git rev-parse HEAD) on $REF"
          echo "REPO=$PWD" >> $GITHUB_ENV

      - name: Confirm commit is on develop/v3.12.0
        shell: bash
        run: |
          set -euo pipefail
          cd "${REPO:-repo}"
          BRANCH="${GITHUB_REF_NAME:-}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "Branch: $BRANCH"
          echo "Commit: $SHORT_SHA"
          if [[ "$BRANCH" != "develop/v3.12.0" ]]; then
            echo "::error::This workflow must run on develop/v3.12.0 (got: $BRANCH)"
            exit 1
          fi

      - name: Verify disk space (≥ 10 GB free in /tmp for 168h run)
        shell: bash
        run: |
          set -euo pipefail
          # BusyBox df (Alpine image) has no --output=avail; use POSIX awk.
          AVAILABLE_KB=$(df -k /tmp | awk 'NR==2 {print $4}')
          AVAILABLE_GB=$((AVAILABLE_KB / 1024 / 1024))
          echo "Available in /tmp: ${AVAILABLE_GB} GB"
          if [[ "$AVAILABLE_GB" -lt 10 ]]; then
            echo "::error::Need ≥ 10 GB free in /tmp; have ${AVAILABLE_GB} GB"
            exit 1
          fi

      - name: Build release binary
        shell: bash
        run: |
          set -euo pipefail
          cd "${REPO:-repo}"
          cargo build --release -p sqlrustgo-mysql-server
          ls -lh target/release/sqlrustgo-mysql-server
        timeout-minutes: 30

      - name: Pre-soak 1h demo smoke (sanity check before 168h)
        shell: bash
        run: |
          set -euo pipefail
          cd "${REPO:-repo}"
          # v312-65: SOAK_NO_DETACH=1 forces the loop script to run in the
          # foreground. Without it, run_soak_loop.sh's stdin-not-TTY auto-detach
          # exits 0 in ~0 s, leaving the 1h smoke step completely unverified
          SOAK_NO_DETACH=1 SOAK_HOURS=1 bash scripts/soak/run_soak_loop.sh
        timeout-minutes: 90
        continue-on-error: false
      - name: 168h SOAK
        shell: bash
        run: |
          set -euo pipefail
          cd "${REPO:-repo}"
          SOAK_HOURS="${{ inputs.soak_hours }}" \
          SERVER_THREADS="${{ inputs.server_threads }}" \
          DATA_DIR="${{ inputs.data_dir }}" \
          bash scripts/soak/run_168h_ci.sh
        timeout-minutes: 10140

      - name: Capture final metrics
        shell: bash
        run: |
          set -euo pipefail
          cd "${REPO:-repo}"
          mkdir -p docs/releases/v3.12.0/evidence/v312-59/soak
          cat > docs/releases/v3.12.0/evidence/v312-59/soak/GA2_168H_SOAK_REPORT.md <<'EOF'
          # GA-2 168h SOAK Report (Issue #4499)

          DRAFT — generated by .gitea/workflows/z6g4-168h-soak.yml
          host:        z6g4-runner
          os_kernel:   $(uname -r)
          commit:      $(git rev-parse HEAD)
          soak_hours:  ${{ inputs.soak_hours }}
          started_at:  $(date -u +%Y-%m-%dT%H:%M:%SZ)
          captured_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          verdict:     TBD — see results/soak-168h/metrics.csv

          ## Artifacts
          * results/soak-168h/metrics.csv
          * results/soak-168h/server.log
          * results/soak-168h/snap_*.json (5-minute snapshots)
          EOF
          echo "GA2_168H_SOAK_REPORT.md scaffold written."

      - name: Upload run artifacts (Gitea)
        # hermes-z6g4 (2026-08-30): actions/upload-artifact@v4 is a GitHub
        # marketplace action — it would fail on the local hermes-runner for
        # the same reason as the original #5684/#5685 failures (blocked
        # GitHub egress). Tar the results locally instead; the evidence
        # files already live under docs/.../soak/ in the repo.
        run: |
          set -euo pipefail
          cd "${REPO}"
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          tar czf "results/soak-168h-${TS}.tar.gz" \
            results/soak-168h/ \
            docs/releases/v3.12.0/evidence/v312-59/soak/GA2_168H_SOAK_REPORT.md
          ls -lh "results/soak-168h-${TS}.tar.gz"
          echo "Artifact tarball ready: results/soak-168h-${TS}.tar.gz"
