# .gitea/workflows/z6g4-tpch-sf1-cell-diff.yml
#
# DRAFT — Issue #4540 (TPC-H Q17 SF=1 cell-diff)
#
# Status: WORKFLOW_DISPATCH ONLY — not auto-enabled.
# This workflow is intended to be invoked manually by a maintainer
# running on the production-aligned CI runner (`devstack-gitea-1`
# host `z6g4-runner`), where the SF=1 fixture generation is ~10x
# faster than on a developer laptop (NVMe-backed disk).
#
# Per openspec/changes/issue-4540-tpch-q17-sf1-cell-diff/design.md §2
# (CI/Z6G4 runbook). The fixture generation may take 2-4 minutes
# on Z6G4 vs 20-40 minutes on dev. The Q17 query budget is 300s.
#
# To enable: change `workflow_dispatch:` only to also include
# `schedule:` (NOT recommended — too heavy for daily cron).
#
# Provenance (ADR-014 5 evidence fields):
#   source_agent:       claude-sonnet (Claude Code)
#   source_run:        issue-4540-tpch-sf1-cell-diff-20260827
#   timestamp:         2026-08-27T22:00:00+08:00
#   evidence_hash:     local-git:9b604a592 (post-merge of PR #4545)
#   conflict_resolution: N/A — single AI scope
#
# Refs: #4432 (Q17 perf), #4540 (this issue), #4502 (GA-5 oracle match),
#       #4497 (umbrella V312-59-D).

name: Z6G4 TPC-H SF=1 cell-diff (DRAFT)

# Manual trigger only — not on push, not on schedule.
on:
  workflow_dispatch:
    inputs:
      sf1_dir:
        description: 'SF=1 fixture directory (default /tmp/tpch-sf1)'
        required: false
        default: '/tmp/tpch-sf1'
        type: string
      backend:
        description: 'Fixture generation backend (tpch_data_gen or dbgen)'
        required: false
        default: 'tpch_data_gen'
        type: string

concurrency:
  # Only one run at a time per ref — prevents fixture-gen thrash.
  group: z6g4-tpch-sf1-cell-diff
  cancel-in-progress: false

jobs:
  sf1-cell-diff:
    # hermes-z6g4 (2026-08-30): route to the Z6G4 local runner (see
    # z6g4-168h-soak.yml for the full rationale).
    runs-on: [hp-z6g4]
    timeout-minutes: 120

    steps:
      - name: Fetch repo from local Gitea
        run: |
          cd /workspace
          set -euo pipefail
          git lfs install --skip-repo 2>/dev/null || true
          git clone --branch "${{ github.ref }}" --depth 1 \
            "http://192.168.0.252:3000/${{ github.repository }}.git" /workspace/repo
          git -C /workspace/repo lfs install 2>/dev/null || true
          git -C /workspace/repo lfs pull 2>/dev/null || true
          echo "workspace=/workspace" >> "$GITHUB_ENV"

      - name: Confirm commit is on develop/v3.12.0
        shell: bash
        run: |
          cd /workspace/repo
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-}"
          SHORT_SHA="$(git rev-parse --short HEAD)"
          echo "Branch: $BRANCH"
          echo "Commit: $SHORT_SHA"
          if [[ "$BRANCH" != "develop/v3.12.0" ]]; then
            echo "::error::This workflow must run on develop/v3.12.0 (got: $BRANCH)"
            exit 1
          fi

      - name: Verify disk space (≥ 2 GB free in /tmp)
        shell: bash
        run: |
          cd /workspace/repo
          set -euo pipefail
          AVAILABLE_KB=$(df --output=avail /tmp | tail -1 | tr -d ' ')
          AVAILABLE_MB=$((AVAILABLE_KB / 1024))
          echo "Available in /tmp: ${AVAILABLE_MB} MB"
          if [[ "$AVAILABLE_MB" -lt 2048 ]]; then
            echo "::error::Need ≥ 2048 MB free in /tmp; have ${AVAILABLE_MB} MB"
            exit 1
          fi

      - name: Generate SF=1 fixture (in-process tpch_data_gen)
        shell: bash
        run: |
          cd /workspace/repo
          set -euo pipefail
          SF1_DIR="${{ inputs.sf1_dir }}"
          BACKEND="${{ inputs.backend }}"
          echo "Generating SF=1 fixture at $SF1_DIR with backend=$BACKEND"
          bash scripts/generate_tpch_data.sh --sf 1 \
              --output "$SF1_DIR" \
              --backend "$BACKEND"
        timeout-minutes: 30

      - name: Verify row counts
        shell: bash
        run: |
          cd /workspace/repo
          set -euo pipefail
          SF1_DIR="${{ inputs.sf1_dir }}"
          bash scripts/generate_tpch_data.sh --sf 1 \
              --output "$SF1_DIR" \
              --check

      - name: Warm file_storage cache (non-Q17 query)
        shell: bash
        run: |
          cd /workspace/repo
          set -euo pipefail
          # Run Q1 first to warm file_storage cache; cold-cache Q17
          # distorts the elapsed metric (warmup penalty).
          # Implementation note: depends on sqlrustgo-mysql-server
          # being runnable; this is best-effort.
          echo "Cache warm-up: skipping in DRAFT (deferred to follow-up)."

      - name: Run TPC-H SF=1 baseline (Q17 perf capture)
        shell: bash
        run: |
          cd /workspace/repo
          set -euo pipefail
          SF1_DIR="${{ inputs.sf1_dir }}"
          mkdir -p docs/releases/v3.12.0/evidence/v312-58
          bash scripts/tpch_sf1_baseline.sh --sf1-dir "$SF1_DIR"
        timeout-minutes: 30

      - name: Capture cell-diff to evidence file (DRAFT scaffold)
        shell: bash
        run: |
          cd /workspace/repo
          set -euo pipefail
          mkdir -p docs/releases/v3.12.0/evidence/v312-58
          cat > docs/releases/v3.12.0/evidence/v312-58/issue-4540-sf1-cell-diff.md <<EOF
          # TPC-H Q17 SF=1 cell-diff (Z6G4 capture)
          DRAFT — generated by .gitea/workflows/z6g4-tpch-sf1-cell-diff.yml
          host:        z6g4-runner
          os_kernel:   $(uname -r)
          disk_type:   NVMe
          commit:      $(git rev-parse HEAD)
          sf1_dir:     ${{ inputs.sf1_dir }}
          backend:     ${{ inputs.backend }}
          captured_at: $(date -u +%Y-%m-%dT%H:%M:%SZ)
          verdict:     TBD — see docs/releases/v3.10.0/perf/SF1_BASELINE_REPORT.md
          EOF
          echo "DRAFT scaffold written. Replace with real values from the baseline report."

      - name: Upload evidence to Gitea issue #4432 (DRAFT)
        shell: bash
        run: |
          cd /workspace/repo
          set -euo pipefail
          # TODO: implement gitea-api post to issue #4432 once DRAFT
          # workflow is enabled. For now, just print the plan.
          echo "DRAFT: would post evidence to issue #4432 via Gitea API."
          echo "  Evidence: docs/releases/v3.12.0/evidence/v312-58/issue-4540-sf1-cell-diff.md"
          echo "  Source run: issue-4540-tpch-q17-sf1-cell-diff-20260827"

      - name: Upload run artifacts (Gitea)
        # hermes-z6g4 (2026-08-30): actions/upload-artifact@v4 is a GitHub
        # marketplace action — fails on the local hermes-runner (blocked
        # GitHub egress). Tar locally instead.
        run: |
          set -euo pipefail
          cd /workspace/repo
          TS="$(date -u +%Y%m%dT%H%M%SZ)"
          tar czf "results/sf1-cell-diff-${TS}.tar.gz" \
            results/ 2>/dev/null || tar czf "results/sf1-cell-diff-${TS}.tar.gz" .
          ls -lh "results/sf1-cell-diff-${TS}.tar.gz"
