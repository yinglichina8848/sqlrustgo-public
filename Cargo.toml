sqlrustgo-admin = { path = "crates/admin" }
sqlrustgo-storage = { path = "crates/storage" }
sqlrustgo-vector = { path = "crates/vector" }
sqlrustgo-mysql-server = { path = "crates/mysql-server" }
sha1 = "0.10"
clap = { version = "4", features = ["derive"] }

[package]
name = "sqlrustgo"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true

[features]
# Mirrors the storage crate's bin_storage_default feature.
# This allows the main crate to use #[cfg(feature = "bin_storage_default")]
# without triggering clippy's unexpected_cfg warning.
bin_storage_default = ["sqlrustgo-storage/bin_storage_default"]
# V313.3 profiling experiments; mirrors sqlrustgo-storage/v313_3_profile.
v313_3_profile = ["sqlrustgo-storage/v313_3_profile"]

[dependencies]
sqlrustgo-common.workspace = true
sqlrustgo-types.workspace = true
sqlrustgo-parser.workspace = true
sqlrustgo-planner.workspace = true
sqlrustgo-optimizer.workspace = true
sqlrustgo-executor.workspace = true
sqlrustgo-storage.workspace = true
sqlrustgo-cache.workspace = true
sqlrustgo-catalog.workspace = true
sqlrustgo-transaction.workspace = true
sqlrustgo-server.workspace = true
information-schema.workspace = true
tokio.workspace = true
async-trait.workspace = true
anyhow.workspace = true
thiserror.workspace = true
serde.workspace = true
log.workspace = true
tracing.workspace = true
env_logger.workspace = true
hex.workspace = true
bytes.workspace = true
lru-cache.workspace = true
ctrlc.workspace = true
serde_json.workspace = true
rayon.workspace = true
sqlrustgo-mysql-client.workspace = true
parking_lot.workspace = true


