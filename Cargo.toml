# SQLRustGo v3.11.0

[workspace]
members = [
    "crates/gis",
    "crates/distributed",
    "crates/common",
    "crates/parser",
    "crates/planner",
    "crates/optimizer",
    "crates/executor",
    "crates/storage",
    "crates/catalog",
    "crates/transaction",
    "crates/server",
    "crates/telemetry",
    "crates/network",
    "crates/bench",
    "crates/tools",
    "crates/sqlancer",
    "crates/transaction-stress",
    "crates/information-schema",
    "crates/query-stats",
    "crates/test-registry",
    "crates/test-runner",
    "crates/test-results",
    "crates/test-reporter",
    "crates/gmp",
    "crates/vector",
    "crates/rag",
    "crates/admin",
    "crates/cache",
    "crates/cli",
    "crates/mysql-client",
    "crates/mysql-server",
    "crates/sqlrustgo-cli",
    "crates/security",
    "crates/spill",
    "crates/sql-corpus",
    "crates/sqlrustgo_sqllogictest",
    "crates/types",
    "crates/wal-verification",
    "tools/compat-runner",
    "tools/xtask",
]

[workspace.package]
version = "3.11.0"
edition = "2021"
authors = ["SQLRustGo Team"]
license = "MIT"
[workspace.dependencies]
scopeguard = "1"
sqlrustgo-common = { path = "crates/common" }
rayon = "1.10"
flate2 = "1.0"
lz4 = "1.24"
zstd = "0.13"
chrono = "0.4"
sqlrustgo-types = { path = "crates/types" }
sqlrustgo-parser = { path = "crates/parser" }
sqlrustgo-planner = { path = "crates/planner" }
sqlrustgo-optimizer = { path = "crates/optimizer" }
sqlrustgo-executor = { path = "crates/executor" }
sqlrustgo-storage = { path = "crates/storage" }
sqlrustgo-catalog = { path = "crates/catalog" }
sqlrustgo-transaction = { path = "crates/transaction" }
sqlrustgo-server = { path = "crates/server" }
sqlrustgo-security = { path = "crates/security" }
sqlrustgo-telemetry = { path = "crates/telemetry" }
sqlrustgo-network = { path = "crates/network" }
sqlrustgo-gmp = { path = "crates/gmp" }
sqlrustgo-vector = { path = "crates/vector" }
sqlrustgo-sql-corpus = { path = "crates/sql-corpus" }
sqlrustgo-cache = { path = "crates/cache" }
sqlrustgo-mysql-server = { path = "crates/mysql-server" }
sqlrustgo-mysql-client = { path = "crates/mysql-client" }
sqlrustgo-cli = { path = "crates/sqlrustgo-cli" }
sqlrustgo-tools = { path = "crates/tools" }
information-schema = { path = "crates/information-schema" }
tracing = "0.1"
tracing-subscriber = { version = "0.1", features = ["env-filter"] }

tokio = { version = "1.0", features = ["full"] }
tonic = "0.14"
async-trait = "0.1"
anyhow = "1.0"
thiserror = "2.0"
serde = { version = "1.0", features = ["derive"] }
log = "0.4"
env_logger = "0.11"
hex = "0.4"
bytes = "1.0"
lru-cache = "0.1.2"
ctrlc = "3.5.2"
serde_json = "1.0"
tempfile = "3.25.0"
criterion = "0.5"
miniz_oxide = "0.7"
memmap2 = "0.9"
lz4_flex = "0.11"
rand = "0.8"
sha2 = "0.10"
hmac = "0.12"
pbkdf2 = { version = "0.12", features = ["simple"] }
fnv = "1.0"
proptest = "1.1"
arrow = { version = "58.1.0" }
parquet = { version = "58.1.0" }
rust_decimal = "1.0"
parking_lot = "0.12"
regex = "1"

[dev-dependencies]

criterion = "0.5"
tempfile = "3.25.0"
serde_yaml = "0.9"
sha2 = "0.10"
rand = "0.8"
proptest = "1.1"
regex = "1"
sqlrustgo-server = { path = "crates/server" }
sqlrustgo-transaction = { path = "crates/transaction" }
sqlrustgo-security = { path = "crates/security" }
sqlrustgo-telemetry = { path = "crates/telemetry" }
sqlrustgo-gmp = { path = "crates/gmp" }
