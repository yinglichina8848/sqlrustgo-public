name: R-Gate v3.8.0 — 5-Dimension Integrated Gate

# v3.8.0 modernized gate system to 5 dimensions (D1-D5).
# This workflow replaces the v2.9.0-era r-gate.yml that called deprecated scripts.
#
# Dimensions (per scripts/gate/check_rc_ga_gate.sh):
#   D1-Alpha   : Build + Test + Clippy + Format + Coverage + Governance
#   D2-Beta    : WAL Contract + Integration Gate
#   D3-SGL     : Layer-3 Semantic Gate (SGL-001~005)
#   D4-WAL     : WAL invariant validation (INV-1, INV-2, INV-3)
#   D5-DeepSeek: 10 Principles for RC/GA
#
# 5-Principle alignment (from COMPREHENSIVE_FEATURE_TRACKING.md):
#   P1: 有计划必有实现
#   P2: 有实现必有测试
#   P3: 测试必审
#   P4: 必须集成到门禁测试 ← THIS WORKFLOW ENFORCES THIS
#   P5: 未过必记

on:
  pull_request:
    branches: [develop/v3.8.0, main]
  push:
    branches: [develop/v3.8.0, main]

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ============================================================
  # Stage 1: Alpha Gate (D1-Alpha)
  # ============================================================
  alpha-gate:
    name: Alpha Gate (D1)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: "A1-A5: Standard checks"
        run: bash scripts/gate/check_alpha_v380.sh

      - name: Upload alpha artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: alpha-gate-artifacts
          path: artifacts/gate/v3.8.0/
          retention-days: 30

  # ============================================================
  # Stage 2: RC/GA Gate (D1-D5 integrated)
  # ============================================================
  rc-ga-gate:
    name: RC/GA Gate (D1-D5)
    runs-on: ubuntu-latest
    needs: alpha-gate
    if: github.event_name == 'push' || contains(github.event.pull_request.labels.*.name, 'rc-ready')
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo registry & target
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            target
          key: ${{ runner.os }}-cargo-${{ hashFiles('**/Cargo.lock') }}
          restore-keys: |
            ${{ runner.os }}-cargo-

      - name: Run 5-dim integrated gate
        run: |
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            # GA: full D1-D5 + L2-L3
            bash scripts/gate/check_rc_ga_gate.sh ga
          else
            # RC: D1-D4 + D5-Principles
            bash scripts/gate/check_rc_ga_gate.sh rc
          fi

      - name: Upload RC/GA artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: rc-ga-gate-artifacts
          path: artifacts/gate/v3.8.0/
          retention-days: 90

  # ============================================================
  # Stage 3: Test Inventory Audit (5-Principle P4 enforcement)
  # ============================================================
  test-inventory-audit:
    name: Test Inventory Audit (P4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Count tests in tests/ directory
        id: count_tests
        run: |
          TESTS_DIR_COUNT=$(find tests -name "*.rs" -type f 2>/dev/null | wc -l)
          echo "tests_dir_count=$TESTS_DIR_COUNT" >> $GITHUB_OUTPUT
          echo "Total test files: $TESTS_DIR_COUNT"

      - name: Count tests referenced in check_rc_ga_gate.sh
        id: count_referenced
        run: |
          REFERENCED=$(grep -E "cargo test --test" scripts/gate/check_rc_ga_gate.sh 2>/dev/null | wc -l)
          echo "referenced_count=$REFERENCED" >> $GITHUB_OUTPUT
          echo "Tests referenced in gate: $REFERENCED"

      - name: 'Check P4: 5-Principle "必须集成到门禁测试"'
        run: |
          TESTS_DIR_COUNT=${{ steps.count_tests.outputs.tests_dir_count }}
          REFERENCED=${{ steps.count_referenced.outputs.referenced_count }}
          INTEGRATION_RATIO=$(awk "BEGIN {printf \"%.1f\", ($REFERENCED / $TESTS_DIR_COUNT) * 100}")
          echo "Test integration ratio: ${INTEGRATION_RATIO}% ($REFERENCED/$TESTS_DIR_COUNT)"

          # 5-Principle P4 target: 95%+
          if [ "$INTEGRATION_RATIO" -lt "95" ]; then
            echo "::warning::5-Principle P4 violation: only ${INTEGRATION_RATIO}% of tests integrated to gate (target: 95%+)"
            echo "::warning::See COMPREHENSIVE_FEATURE_TRACKING.md §3 and issue #2874 (P0-1)"
            exit 1
          else
            echo "✅ 5-Principle P4 satisfied: ${INTEGRATION_RATIO}% ≥ 95%"
          fi

  # ============================================================
  # Stage 4: Cross-Version Debt Gate (4-Principle P5 enforcement)
  # ============================================================
  cross-version-debt:
    name: Cross-Version Debt Gate (P5)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Run cross-version debt gate
        run: bash scripts/gate/check_cross_version_debt.sh

      - name: Verify 0 ACTIVE debt
        run: |
          ACTIVE_COUNT=$(bash scripts/gate/check_cross_version_debt.sh 2>&1 | grep -c "ACTIVE" || true)
          echo "ACTIVE debt count: $ACTIVE_COUNT"
          if [ "$ACTIVE_COUNT" -gt "0" ]; then
            echo "::error::Cross-version debt has $ACTIVE_COUNT ACTIVE items - see INT5_PLUS_DEBT_INVENTORY.md"
            exit 1
          else
            echo "✅ Cross-version debt: 0 ACTIVE"
          fi

  # ============================================================
  # Merge Eligibility (gates merge based on all stages)
  # ============================================================
  merge-gate:
    name: Merge Eligibility (all stages)
    needs: [alpha-gate, test-inventory-audit, cross-version-debt]
    # rc-ga-gate is required only for push to main or rc-ready labels
    if: always() || contains(github.event.pull_request.labels.*.name, 'rc-ready')
    runs-on: ubuntu-latest
    steps:
      - name: Verify all required gates passed
        run: |
          echo "=== Gate Results ==="
          echo "alpha-gate:        ${{ needs.alpha-gate.result }}"
          echo "test-inventory:    ${{ needs.test-inventory-audit.result }}"
          echo "cross-version:     ${{ needs.cross-version-debt.result }}"
          if [ "${{ github.event_name }}" == "push" ] && [ "${{ github.ref }}" == "refs/heads/main" ]; then
            echo "rc-ga-gate:        ${{ needs.rc-ga-gate.result }}"
          fi

          if [ "${{ needs.alpha-gate.result }}" != "success" ] || \
             [ "${{ needs.test-inventory-audit.result }}" != "success" ] || \
             [ "${{ needs.cross-version-debt.result }}" != "success" ]; then
            echo "::error::Required gate(s) failed - merge blocked"
            exit 1
          fi

          echo "✅ All required gates passed - merge eligible"
