name: Benchmark Schedule

on:
  schedule:
    - cron: '0 0 * * 1'  # Monday at midnight UTC
  workflow_dispatch:  # Manual trigger

jobs:
  full-benchmark:
    name: Full Benchmark Suite
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Cache cargo
        uses: Swatinem/rust-cache@v2

      # NOTE (2026-10-01): this job used to run
      # `cargo build --release -p sqlrustgo-bench-cli` followed by
      # `sqlrustgo-bench-cli tpch|oltp|custom`. No package or binary named
      # `sqlrustgo-bench-cli` exists anywhere in the workspace: the bench crate
      # is `sqlrustgo-bench` (crates/bench) and it is a *library* — it exposes
      # `cli::BenchArgs` but declares no [[bin]]. Those steps therefore failed at
      # the build step, and the SF=1 / SF=10 steps were left as bare `mkdir`
      # calls producing empty result directories. The real, buildable benchmarks
      # are the criterion targets declared in the root Cargo.toml [[bench]]
      # entries.
      - name: Build criterion benchmarks
        run: |
          # Limit virtual memory to 8GB
          ulimit -v 8388608
          cargo bench --no-run

      - name: Run the criterion suite
        run: |
          mkdir -p benchmarks/results
          for t in parser_bench bench_insert bench_cbo bench_columnar; do
            cargo bench --bench "$t" 2>&1 | tee "benchmarks/results/${t}.txt"
          done

      - name: Upload results
        uses: actions/upload-artifact@v4
        with:
          name: benchmark-results-full
          path: benchmarks/results/
