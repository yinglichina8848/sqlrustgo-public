# Stage Control Framework — Version-Agnostic SSOT
#
# 单一真相来源 (SSOT) for SQLRustGo's 5-stage release lifecycle:
#   DRAFT → ALPHA → BETA → RC → GA
#
# This file is **version-agnostic** — it describes the framework, not a
# specific version's state. Per-version state lives in
# `docs/releases/vX.Y.Z/STAGE.yaml` (per-version override).
#
# Per the user (2026-07-01 governance audit):
#   "目前的 governance 是非常依赖版本和人力检查的,没有一个独立于版本的
#    draft, develop, alpha, beta, rc, ga 各阶段的控制体系和文档"
#
# This file is the answer: a single SSOT that every version's stage gate
# can reference. check_stage.sh (see scripts/gate/check_stage.sh) reads
# this file to determine which gates, artifacts, and branch rules apply
# to a given version, regardless of its name.
#
# ADR: ADR-015 (proposed, see docs/governance/adr/)
# Refs: #3667 (state snapshot), GOVERNANCE_COMPLIANCE_REPORT §7
#
# 2026-07-01 claude-macmini (governance audit 整改)
# ---

# =============================================================================
# Framework metadata
# =============================================================================
framework:
  version: "1.0.0"
  name: "SQLRustGo 5-Stage Release Control"
  stages: [DRAFT, ALPHA, BETA, RC, GA]
  ssot: true  # All other stage-related docs must reference this file
  schema_date: "2026-07-01"

# =============================================================================
# Stage definitions (version-agnostic)
# =============================================================================
# Each stage specifies:
#   order: 1-5 in lifecycle
#   description: what this stage means
#   branch_pattern: glob the current branch must match (null = any)
#   required_files: artifacts that must exist at this stage
#   required_gates: list of gate scripts to run (must all PASS)
#   optional_gates: list of gate scripts that are recommended but not blocking
#   promotion_rules: criteria that must be met to advance to next stage
#   merge_policy: who can merge / what review is required
#   doc_artifacts: documents that must exist for this stage
#   exit_criteria: explicit "ready to leave this stage" checklist
stages:
  DRAFT:
    order: 1
    description: "设计与架构阶段 (design + architecture + prototype)"
    branch_pattern: ["develop/v*", "feature/*", "feat/*"]
    required_files:
      - "docs/releases/v{VER}/VERSION_PLAN.md"
      - "docs/releases/v{VER}/ARCHITECTURE.md"
    required_gates:
      - "scripts/gate/check_docs_links.sh"
      - "cargo build --all-features"
    optional_gates:
      - "scripts/gate/check_arch_invariants.sh"
    merge_policy:
      reviewers: 1
      approval: any
      ci_required: [lint, build]
    doc_artifacts:
      - "VERSION_PLAN.md"
      - "ARCHITECTURE.md"
      - "ROADMAP.md"
    exit_criteria:
      - "Architecture design doc approved"
      - "All draft issues closed or promoted to ALPHA"
      - "First alpha tag cut: v{VER}-alpha1"

  ALPHA:
    order: 2
    description: "功能开发阶段 (active feature development, API may change)"
    branch_pattern: ["develop/v*"]
    required_files:
      - "docs/releases/v{VER}/CHANGELOG.md"
      - "docs/releases/v{VER}/RELEASE_NOTES.md"
      - "docs/releases/v{VER}/STAGE.yaml"
    required_gates:
      # 2026-07-11: v3.10.0 uses check_alpha_v310.sh (per-version gate following
      # v3.8.0's check_alpha_v380.sh pattern). v2.9.0's check_alpha.sh is
      # hardcoded with v2.9.0 paths and references crates that no longer exist
      # (sqlrustgo-sql-corpus, verification_report.json, 28-file integration).
      # Each version provides its own check_alpha_v{VER_short}.sh that
      # references the version's own worktree paths and gate set.
      - "scripts/gate/check_alpha_v{VER}.sh"
      - "scripts/gate/check_arch_invariants.sh"
      - "scripts/gate/check_arch3_no_bypass.sh"
      - "scripts/gate/check_coverage_v312.sh"
      - "scripts/gate/check_sql_corpus_gate.sh"
      - "scripts/gate/check_anti_ignore_gate.sh"
      - "cargo build --all-features"
      - "cargo test --all-features --lib"
      - "cargo fmt --check"
    optional_gates: []
    merge_policy:
      reviewers: 1
      approval: codeowner
      ci_required: [lint, build, test]
    doc_artifacts:
      - "CHANGELOG.md"
      - "RELEASE_NOTES.md"
      - "STAGE.yaml"
      - "FEATURE_MATRIX.md"
    exit_criteria:
      - "All alpha-targeted issues closed (tracked in STAGE.yaml)"
      - "Coverage >= {COVERAGE_MIN_ALPHA}%"
      - "No P0 bugs open"
      - "First beta tag cut: v{VER}-beta1"

  BETA:
    order: 3
    description: "功能冻结 + 完整性验证 (feature freeze, integration focus)"
    branch_pattern: ["develop/v*", "beta/v*"]
    required_files:
      - "docs/releases/v{VER}/STAGE.yaml"
      - "docs/releases/v{VER}/TEST_PLAN.md"
      - "docs/releases/v{VER}/FEATURE_CHECKLIST.md"
    required_gates:
      - "scripts/gate/check_beta_gate.sh"
      # 2026-08-09 V312-32: AFP v4 CHECK 1.5 forces target/sqlancer-report.json
      # + target/test-runner-report.json (V312-24 artifacts) at every gate run.
      - "scripts/gate/check_anti_fabrication.sh"
      - "scripts/gate/check_arch_invariants.sh"
      - "scripts/gate/check_arch3_no_bypass.sh"
      - "scripts/gate/check_arch_sem_debt.sh"
      - "scripts/gate/check_cross_version_debt.sh"
      - "scripts/gate/check_int_debt.sh"
      - "scripts/gate/check_coverage_v312.sh"
      - "scripts/gate/check_sql_corpus_gate.sh"
      - "scripts/gate/check_anti_ignore_gate.sh"
      - "cargo build --all-features"
      - "cargo test --all-features"
      - "cargo fmt --check"
      - "cargo clippy --all-features -- -D warnings"
    optional_gates: []
    merge_policy:
      reviewers: 2
      approval: codeowner + governance
      ci_required: [lint, build, test, full-gate]
    doc_artifacts:
      - "TEST_PLAN.md"
      - "FEATURE_CHECKLIST.md"
      - "STAGE.yaml"
      - "FEATURE_MATRIX.md"
    exit_criteria:
      - "All feature items CLOSED or DEFERRED (in debt-registry.yaml)"
      - "Coverage >= {COVERAGE_MIN_BETA}%"
      - "All B1-B5 hard checks PASS"
      - "All B-F1~B-F7 functional checks PASS"
      - "First RC tag cut: v{VER}-rc1"

  RC:
    order: 4
    description: "候选发布版本 (release candidate, critical-bug-fix only)"
    branch_pattern: ["develop/v*", "release/v*", "rc/v*"]
    required_files:
      - "docs/releases/v{VER}/STAGE.yaml"
      - "docs/releases/v{VER}/RELEASE_NOTES.md"
      - "docs/releases/v{VER}/CHANGELOG.md"
      - "docs/releases/v{VER}/GA_GATE_REPORT.md"
    required_gates:
      - "scripts/gate/check_rc_ga_gate.sh"
      - "scripts/gate/check_arch_invariants.sh"
      - "scripts/gate/check_arch3_no_bypass.sh"
      - "scripts/gate/check_integration_gate.sh"
      - "scripts/gate/check_anti_fabrication.sh"
      - "scripts/gate/check_arch_sem_debt.sh"
      - "scripts/gate/check_cross_version_debt.sh"
      - "scripts/gate/check_int_debt.sh"
      - "scripts/gate/check_full_gate_verification.sh"
      - "scripts/gate/check_coverage_v312.sh"
      - "scripts/gate/check_sql_corpus_gate.sh"
      - "scripts/gate/check_anti_ignore_gate.sh"
      - "cargo build --all-features"
      - "cargo test --all-features"
      - "cargo fmt --check"
      - "cargo clippy --all-features -- -D warnings"
    optional_gates:
      - "scripts/gate/check_architecture_freeze.sh"
      - "scripts/gate/check_gate_self_verification.sh"
    merge_policy:
      reviewers: 2
      approval: codeowner + governance + human-architect
      ci_required: [lint, build, test, full-gate, anti-fab]
    doc_artifacts:
      - "RELEASE_NOTES.md"
      - "RELEASE_GATE_CHECKLIST.md"
      - "PERFORMANCE_TARGETS.md"
      - "STAGE.yaml"
      - "EVIDENCE_STATUS.md"
    exit_criteria:
      - "All RC{N} release-blocking bugs closed"
      - "All 5 dimensions (D1-D5) PASS"
      - "Tag v{VER}-rcN cut, no P0 bugs since"
      - "GA promotion approved by human architect"

  GA:
    order: 5
    description: "正式发布版本 (general availability, hotfix only)"
    branch_pattern: ["main", "release/v*", "hotfix/v*"]
    required_files:
      # #5439: the state expectations used to be glued onto the path
      # ("STAGE.yaml (state=GA)"), which made the entry **unresolvable**:
      # 3 of the 5 GA required files were reported MISS although the files
      # were sitting right there in the release directory. The expectation
      # now lives in `required_file_expectations` and the path stays a path.
      - "docs/releases/v{VER}/STAGE.yaml"
      - "docs/releases/v{VER}/RELEASE_NOTES.md"
      - "docs/releases/v{VER}/GA_GATE_REPORT.md"
      - "docs/releases/v{VER}/GA_RELEASE_TIMELINE.md"
      - "docs/releases/v{VER}/CHANGELOG.md"
    required_file_expectations:
      "docs/releases/v{VER}/STAGE.yaml": "current_stage must be GA"
      "docs/releases/v{VER}/RELEASE_NOTES.md": "must be the GA release notes"
      "docs/releases/v{VER}/CHANGELOG.md": "must contain the GA entry"
    required_gates:
      - "scripts/gate/check_rc_ga_gate.sh ga"  # full mode
      - "scripts/gate/check_arch_invariants.sh"
      - "scripts/gate/check_arch3_no_bypass.sh"
      - "scripts/gate/check_integration_gate.sh"
      - "scripts/gate/check_anti_fabrication.sh"
      - "scripts/gate/check_arch_sem_debt.sh"
      - "scripts/gate/check_cross_version_debt.sh"
      - "scripts/gate/check_int_debt.sh"
      - "scripts/gate/check_full_gate_verification.sh"
      - "scripts/gate/check_drift_not_pass.sh"
      - "scripts/gate/check_architecture_freeze.sh"
      - "scripts/gate/check_gate_self_verification.sh"
      - "scripts/gate/check_gate_test_integrity.sh"
      - "scripts/gate/check_coverage_v312.sh"
      - "scripts/gate/check_sql_corpus_gate.sh"
      - "scripts/gate/check_anti_ignore_gate.sh"
      - "cargo build --all-features"
      - "cargo test --all-features"
      - "cargo fmt --check"
      - "cargo clippy --all-features -- -D warnings"
    optional_gates:
      # #5439: both entries used to be dangling references — the scripts
      # `check_soak_gate.sh` and `check_p13_soak.sh` do not exist in the
      # repository. A gate list that names scripts which are not there is
      # a promise nobody can keep. The real soak gates are listed instead;
      # `check_p13_soak_test.sh` is the G7 gate (#5438).
      - "scripts/gate/check_p13_soak_test.sh"
      - "scripts/gate/check_chaos_soak.sh"
    merge_policy:
      reviewers: 3
      approval: codeowner + governance + human-architect + release-manager
      ci_required: [lint, build, test, full-gate, anti-fab, soak, stability]
    doc_artifacts:
      # #5439: resolved **relative to the version's release directory**
      # (rule R3 in scripts/gate/stage_config_common.sh). The state
      # expectations used to be glued onto the names, which made them
      # unresolvable.
      - "RELEASE_NOTES.md"
      - "GA_GATE_REPORT.md"
      - "GA_RELEASE_TIMELINE.md"
      - "STAGE.yaml"
      - "EVIDENCE_STATUS.md"
      - "POST_GA_PLAN.md"
    exit_criteria:
      - "All 5 dimensions + stability gates PASS"
      - "GA gate report signed by human architect"
      - "GA tag cut: v{VER}"
      - "Merge to main + release branch created"

# =============================================================================
# Stage transition rules (version-agnostic)
# =============================================================================
transitions:
  DRAFT_to_ALPHA:
    trigger: "first alpha tag cut: v{VER}-alpha1"
    required_artifacts_added_in_ALPHA:
      - "CHANGELOG.md"
      - "RELEASE_NOTES.md"
      - "STAGE.yaml"
    requires_human_approval: true
  ALPHA_to_BETA:
    trigger: "all alpha-targeted issues closed + coverage >= COVERAGE_MIN_ALPHA"
    requires_human_approval: true
  BETA_to_RC:
    trigger: "all B-F1~B-F7 functional checks PASS + first RC tag cut"
    requires_human_approval: true
  RC_to_GA:
    trigger: "GA gate report signed by human architect"
    requires_human_approval: true
  GA_to_NEXT_VERSION_DRAFT:
    trigger: "POST_GA_PLAN.md exists + next version branch created"
    requires_human_approval: true

# =============================================================================
# Version-agnostic coverage / quality thresholds
# =============================================================================
# Each version can override these in their STAGE.yaml
thresholds:
  COVERAGE_MIN_DRAFT: null  # not enforced
  COVERAGE_MIN_ALPHA: 50
  COVERAGE_MIN_BETA: 75
  COVERAGE_MIN_RC: 80
  COVERAGE_MIN_GA: 85
  CLIPPY_WARNINGS_MAX: 0
  FMT_DRIFT_MAX: 0
  DOC_LINKS_BROKEN_MAX: 0
  IGNORE_TESTS_MAX_PER_CATEGORY:
    KNOWN_BUG: 5
    KNOWN_GAP: 20
    SOAK: 10
    PERF_BENCHMARK: 20
    MANUAL_ORACLE: 5

# =============================================================================
# Branch role mapping
# =============================================================================
# Reference: docs/governance/BRANCH_GOVERNANCE.md
branches:
  develop_vX_Y_Z:    { stage: ALPHA_or_BETA_or_RC,  mergeable: true,  protected: true  }
  beta_vX_Y_Z:       { stage: BETA,                 mergeable: true,  protected: true  }
  rc_vX_Y_Z:         { stage: RC,                   mergeable: true,  protected: true  }
  release_vX_Y_Z:   { stage: RC_or_GA,             mergeable: true,  protected: true  }
  feature_X:         { stage: DRAFT_or_ALPHA,      mergeable: true,  protected: false }
  fix_X:             { stage: any,                  mergeable: true,  protected: false }
  main:              { stage: GA_only,              mergeable: false, protected: true  }
  hotfix_vX_Y_Z:     { stage: GA,                  mergeable: true,  protected: true  }

# =============================================================================
# Common artifacts (all stages)
# =============================================================================
common_required_files:
  - "AGENTS.md"
  - "docs/governance/INDEX.md"
  - "docs/governance/STAGE_CONFIG.yaml"
  - "docs/governance/debt/debt-registry.yaml"
  - "docs/governance/adr/INDEX.md"

# =============================================================================
# Gate definitions (G1-G16) — version-agnostic mapping
# =============================================================================
# Each gate is a specific concern (TPC-H baseline, ARCH-3 VtuGuard, etc).
# The per-stage required_gates above reference these by file path; this
# section provides the G-numbering for governance traceability and ADR
# cross-references.
#
# ⚠️ THE G NUMBER IS AN ALIAS, NOT THE CRITERION  (#5437)
# ---------------------------------------------------------------
# The authoritative GA criterion is the **`required_gates` script-path list**
# of the GA stage block above. It is **one** list, in **one** file.
# The G-numbers here exist for traceability and ADR cross-references only.
#
# Before #5437 the repository gave **four different counts** and **three
# mutually exclusive G semantics** for "how many GA gates are there":
#
#   STAGE_CONFIG.yaml required_gates (GA)        = 20 items  (16 scripts + 4 cargo)
#   STAGE_CONFIG.yaml's own "GA requires: G1-G16" = 16 items  ← contradicted the list above
#   GATE_CONDITIONS.md's GA Gate section          =  6 items  (G1~G6, a different axis)
#   CONVERGENCE_TRACKER.md's "G1-G16" table       = 16 items
#
# ⇒ Any GA conclusion phrased as "G1-G16 all PASS" was **unauditable**:
#   a reviewer counting gates got a different number depending on which
#   document they trusted.
#
# The rule now:
#   * the GA criterion is `stages.GA.required_gates` — say so, and say it
#     here so the file stops contradicting itself;
#   * a G number must name a script that is **recognisable from the G's own
#     name** (see scripts/gate/stage_config_common.sh, rule R4). That is
#     what makes "G7 (24h Soak) -> the full-gate aggregator" detectable.
#
# Per-version: V390_TEST_PLAN.md (and siblings) provide version-specific
# detail (work-effort, scenarios, perf targets). STAGE_CONFIG.yaml only
# records the **name -> script** mapping, which is constant.
#
# Refs:
#   - V390_TEST_PLAN.md (v3.9.0 G1-G16 detail, 481 lines)
#   - V390_TEST_PLAN_SUPPLEMENT_PERF.md (G11-G15 detail)
#   - V390_TEST_PLAN_ROUND2_REVIEW.md (G13/G16 rebalance)
#   - GATE_CONDITIONS.md (Hard/Soft classification)
#
# #5438: G5/G7/G8/G9/G10 used to point at scripts that had nothing to do
# with what the G number names (Soak -> the full-gate aggregator, Crash
# Matrix -> the drift detector, Upgrade -> the cross-version debt ledger,
# Audit Log -> the anti-fabrication check, Savepoint -> the architecture
# semantic-debt gate). Each corrected mapping now points at a script that
# declares its own G number in its header, so the mapping is checkable
# rather than merely plausible.
gate_definitions:
  G1:  # TPC-H 22/22 baseline (regression)
    name: "TPC-H 22/22 baseline (regression)"
    script: "scripts/gate/check_g1_tpch_baseline.sh"
    alternative: "scripts/gate/check_g1_tpch_22_22.sh"
    type: regression
    stage_min: ALPHA  # must pass from ALPHA onward
  G2:  # INT-2 ParallelExecutor integration
    name: "INT-2 ParallelExecutor integration"
    # #5438: was `check_int_debt.sh` — the cross-version INT **debt
    # ledger**, which tracks whether INT-1~INT-4 carry a remediation
    # plan. It is not the INT-2 integration gate. The INT-2 gate
    # declares itself ("INT-2 (#3171) ParallelExecutor main-path G2
    # gate").
    script: "scripts/gate/check_int2_no_orphan.sh"
    additional_scripts:
      - "scripts/gate/check_int_debt.sh"
    type: e2e+perf
    stage_min: BETA
  G3:  # INT-3 Single Expression
    name: "INT-3 Single Expression (expr merge)"
    # #5438: was `check_int_debt.sh` (the debt ledger, not the gate).
    # The INT-3 gate declares itself ("INT-3 (#3170) Single Expression
    # Engine G3 gate").
    script: "scripts/gate/check_int3_single_expr.sh"
    additional_scripts:
      - "scripts/gate/check_int_debt.sh"
    type: unit+regression
    stage_min: BETA
  G4:  # ARCH-3 VtuGuard main path
    name: "ARCH-3 VtuGuard main path (P0-1 Blocker-3)"
    script: "scripts/gate/check_arch3_no_bypass.sh"
    type: unit+gate-automated
    stage_min: ALPHA  # per ADR-006a: VtuGuard must be enforced from ALPHA
  G5:  # SEM-1 Savepoint MVCC
    name: "SEM-1 Savepoint MVCC snapshot restore"
    # #5438: was `check_arch_sem_debt.sh` — the architecture semantic-debt
    # gate, not the savepoint gate. The savepoint gate declares itself
    # ("SEM-1 (#3172) Savepoint G5 gate").
    script: "scripts/gate/check_sem1_savepoint.sh"
    type: unit+e2e
    stage_min: BETA
  G6:  # Backup/Restore 100+ scenarios
    name: "Backup/Restore 100+ scenarios"
    script: "scripts/gate/check_backup_restore.sh"
    type: unit+e2e
    stage_min: BETA
  G7:  # 24h Soak (compressed-time)
    name: "24h Soak (compressed-time, real 24h pending)"
    # #5438: was `check_full_gate_verification.sh` — the full-gate
    # AGGREGATOR, which validates that gates are wired, not that a soak
    # ran. The soak gate declares itself ("P1-3 (#3175) Soak Test G7
    # gate").
    script: "scripts/gate/check_p13_soak_test.sh"
    type: long-running
    stage_min: RC
    note: "Per V390_TEST_PLAN_ROUND2_REVIEW: real 24h only at RC/GA, compressed-time for early stages"
  G8:  # Crash Matrix 100+ scenarios
    name: "Crash Matrix 100+ scenarios (kill -9 / OOM / disk full)"
    # #5438: was `check_drift_not_pass.sh` — the drift detector, which has
    # nothing to do with crash scenarios. The crash gate declares itself
    # ("P1-2 (#3174) Crash Test Framework G8 gate").
    script: "scripts/gate/check_p12_crash_test.sh"
    type: unit+mock
    stage_min: RC
  G9:  # Upgrade Test
    name: "Upgrade Test (v3.6/v3.7/v3.8 -> v3.9, 50+ paths)"
    # #5438: was `check_cross_version_debt.sh` — the cross-version DEBT
    # ledger, which is a bookkeeping check, not an upgrade run. The upgrade
    # gate declares itself ("P1-4 (#3176) Upgrade Test G9 gate").
    script: "scripts/gate/check_p14_upgrade_test.sh"
    type: automated
    stage_min: RC
  G10: # Audit Log + Time Travel
    name: "Audit Log + Time Travel (40+ tests)"
    # #5438: was `check_anti_fabrication.sh` — the anti-fabrication check.
    # G10 covers TWO concerns and therefore TWO gates; both declare
    # themselves ("P2-1 (#3177) Audit Log G10 gate" / "P2-2 (#3178) Time
    # Travel Query G10 gate").
    script: "scripts/gate/check_p21_audit_log.sh"
    additional_scripts:
      - "scripts/gate/check_p22_time_travel.sh"
    type: unit+e2e
    stage_min: RC
  G11: # QPS/TPS Benchmark
    name: "QPS/TPS Benchmark"
    script: "scripts/gate/check_g11_qps.sh"
    type: perf
    stage_min: RC
  G12: # Sysbench OLTP
    name: "Sysbench OLTP"
    script: "scripts/gate/check_g12_sysbench.sh"
    type: industry-benchmark
    stage_min: RC
  G13: # 24h+ Stability (real)
    name: "24h+ Stability (real, hardware-blocked)"
    script: "scripts/gate/check_g13_stability.sh"
    type: long-running-real
    stage_min: GA
    note: "Per #3265/#3266: 72h/168h real SOAK blocked on hardware. GA gate only requires 24h minimum."
  G14: # Real Crash Test
    name: "Real Crash Test (process-level kill -9)"
    script: "scripts/gate/check_g14_real_crash.sh"
    type: process-level
    stage_min: RC
  G15: # Performance Report
    name: "Performance Report (GA acceptance)"
    script: "scripts/gate/check_g15_perf_report.sh"
    type: report
    stage_min: GA
  G16: # Compatibility
    name: "Compatibility (v3.8 -> v3.9 upgrade path)"
    script: "scripts/gate/check_g16_compatibility.sh"
    type: upgrade
    stage_min: GA

# The authoritative GA criterion is `stages.GA.required_gates` above —
# **20 items** (16 gate scripts + 4 cargo commands) as of #5437.
#
# The G-numbers in `gate_definitions` below are **aliases** for
# traceability and ADR cross-references. They are NOT a second, competing
# list of GA gates, and "GA requires G1-G16" is **not** a valid restatement
# of the criterion: G1~G16 name sixteen *concerns*, while the GA stage
# requires sixteen *scripts* plus four cargo commands — the two sets are
# related, but they are not the same set.
#
# Cross-reference:
#   - ALPHA requires: G4 (VtuGuard)
#   - BETA requires: G2, G3, G4, G5, G6
#   - RC requires: G4-G16 (all except G13 if hardware-blocked)
#   - GA requires: the `required_gates` list of the GA stage block above
#     (the scripts for G1~G16 plus the architecture/debt/coverage/corpus
#     gates and the four cargo commands)
#
# (The actual required_gates in each stage block above uses script paths,
# not G-numbers, because the framework reads the YAML, not the G-labels.)

