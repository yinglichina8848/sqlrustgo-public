  # ---- v313-16: V313-followup PRs landed before v3.12.0 GA (gitea-252 sync 2026-09-07) ----
  # These four testdata files were added by V313-followup PRs (#4155, #4156) plus
  # generic DuckDB sample/test fixtures. They were never in the Round-9 closed
  # registry because they did not exist when the registry was finalized (Aug 12).
  # The executor implements quantile_disc/cont (PR #4155) but the result type is
  # Float even for integer-valued discrete quantiles; the sqllogictest fixture
  # expects Integer ('1' not '1.0'). The delete tests trigger the engine's
  # distributed-transaction participant lock — a nested BEGIN TRANSACTION
  # collides with the first auto-txn and emits 'Transaction already in progress'.
  # All four are scoped to v3.13.0 and tagged `kind: v313_followup` so the
  # B6_SQLLOGICTEST_OPEN_EXCLUSIONS gate accepts them as legitimate new entries
  # (stale-open items without this tag are still rejected).
  - id: sqllogictest-quantile-simple-v313
    file: quantile_simple.test
    status: open
    kind: v313_followup
    failure_summary: "quantile_disc / quantile_cont returns Float (e.g. 1.0) for integer-valued discrete quantiles where sqllogictest fixture expects Integer (1)"
    root_cause: "PR #4155 implementation always returns Float-typed result; sqllogictest normalizer compares '1.0' vs '1' verbatim without Float→Int coercion"
    follow_up_issue: "#4155 [V313-followup-2] quantile_disc / quantile_cont single-fraction form"
    owner: openclaw
    v3.12_blocking: false
    v3.13_expiry: 2026-12-31
    close_boundary: "cargo run -p sqlrustgo_sqllogictest -- --filter quantile_simple exits 0 AND PASS [quantile_simple.test]"
    verification_2026_09_07: "FAIL [quantile_simple.test]  expected '1' got '1.0' for quantile_disc(x, 0.10)"

  - id: sqllogictest-percentile-cont-simple-v313
    file: percentile_cont_simple.test
    status: open
    kind: v313_followup
    failure_summary: "PERCENTILE_CONT(...) WITHIN GROUP returns Float where sqllogictest fixture expects Integer for boundary fraction=0.0"
    root_cause: "PR #4156 PERCENTILE_CONT always returns Float-typed result; sqllogictest normalizer compares '1.0' vs '1' verbatim"
    follow_up_issue: "#4156 PERCENTILE_CONT WITHIN GROUP ordered-set aggregate"
    owner: openclaw
    v3.12_blocking: false
    v3.13_expiry: 2026-12-31
    close_boundary: "cargo run -p sqlrustgo_sqllogictest -- --filter percentile_cont_simple exits 0 AND PASS [percentile_cont_simple.test]"
    verification_2026_09_07: "FAIL [percentile_cont_simple.test]  expected '1' got '1.0' for PERCENTILE_CONT(0.0) WITHIN GROUP (ORDER BY x)"

  - id: sqllogictest-delete-test-delete-root-v313
    file: delete__test_delete.test
    status: open
    kind: v313_followup
    failure_summary: "BEGIN TRANSACTION nested inside auto-tx returns 'Transaction already in progress'"
    root_cause: "Engine auto-opens a distributed-transaction participant context for every statement; nested BEGIN TRANSACTION collides with the existing participant lock (participant.rs:58 'locks.contains_key(&gid)')"
    follow_up_issue: "#4155-duplicate-testdata  [V313-followup-2] DuckDB sample tests landed before executor maturity"
    owner: openclaw
    v3.12_blocking: false
