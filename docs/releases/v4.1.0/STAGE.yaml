# ============================================================================
# 2026-10-04 总控协调：14+1 个 open issue 的并行开发路径
# ----------------------------------------------------------------------------
# 总控 issue: #4950
#
# 本段只做两件事：(1) 记录 issue 之间的**文件所有权边界**——哪些能同时
# 开工、哪些必须排队；(2) 记录分析过程中核实的**三处根因更正**与一项
# 新发现。每个子项的根因/方案/验收标准在各自 issue 内，本段不重复。
#
# ⚠️ 下面三处更正会改变修复方向，不可按子 issue 原文实施：
#   · #4945 原文说 current_tx_id 被误用作 AUTO_INCREMENT 计数器——**不成立**。
#     实际是有**两个独立的 MAX-scan 分配器**（engine_dml.rs:490-508 与
#     engine.rs:1992-2008），应合并而非改造 current_tx_id。
#   · #4946 原文说"无周期性 flush"——成立但**不够**。WalStorage::commit_transaction
#     （wal_storage.rs:876-916）在记 checkpoint 后**立即截断 WAL**，而对应快照
#     尚未写出，崩溃后重放拿不到。drain_pending_flushes(:948) 零调用方。
#   · #4947 原文说"改用 scan_with_filter"——**当前编译不过**。该方法带泛型故
#     受 Self: Sized 约束，而 TriggerExecutor 持有 Arc<RwLock<dyn StorageEngine>>。
#
# 新发现 #4951：crates/storage/src/file_storage.rs:405-413 的
#   as_mut_self(&self) -> &mut Self（25 处调用）与已修的 WalStorage::as_inner_mut
#   是**完全相同**的逃逸口，位于生产默认后端。现有守卫测试只扫 wal_storage.rs，
#   故未覆盖。
# ============================================================================
