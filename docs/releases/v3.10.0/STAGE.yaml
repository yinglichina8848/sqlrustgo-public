# Branch protection rules (this version)
# =============================================================================
# 2026-07-11: Gitea branch protection APPLIED for develop/v3.10.0 (rule id
# applied via POST /api/v1/repos/.../branch_protections). Mirrors the
# protection pattern used for develop/v3.5.0..v3.9.0 in BRANCH_GOVERNANCE.md §2.2.
# Verified by 4 negative tests:
#   1) non-fast-forward direct push -> rejected (block_on_outdated_branch=true)
#   2) force push -> rejected (enable_force_push=false)
#   3) feature branch push -> succeeds (unprotected, as designed)
#   4) PR #3739 merged via /api/v1/repos/.../pulls/{n}/merge (no direct push)
branch_protection:
  develop_v3_10_0:
    gitea_rule: "develop/v3.10.0"
    priority: 0
    enable_push: false                  # direct push blocked
    push_whitelist_usernames: ["openclaw"]  # admin override (for emergency hotfix)
    enable_force_push: false            # force push rejected (verified)
    required_approvals: 2               # BETA: PR needs 2 approvals (updated 2026-07-13)
    block_on_rejected_reviews: true     # rejected reviews block merge
    block_on_outdated_branch: true      # branch must be up-to-date (verified)
    dismiss_stale_approvals: true       # new push invalidates old approvals
    enable_status_check: true
    status_check_contexts: [lint, build, docs-links, cargo-build]
    require_signed_commits: false
    block_admin_merge_override: false   # admin can still bypass (audit logged)
    applied_at: "2026-07-11"
    applied_via: "POST /api/v1/repos/openclaw/sqlrustgo/branch_protections"
  feature_X:
    gitea_rule: "UNPROTECTED"  # feature/* follows BRANCH_GOVERNANCE.md §2.2
    allow_force_push: false
    allow_deletion: false

