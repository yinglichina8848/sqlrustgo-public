## GA Decision

```
ga_decision: conditional_pass
```

### Rationale

v3.7.0 is explicitly scoped as a **"Session-level transaction SQL engine"** (not MVCC-complete, not WAL-integrated).

The following are **excluded from v3.7.0 scope** by design:
- WAL / Crash Recovery (INT-1)
- Full MVCC / ACID (OC-2)
- VTU in mysql-server (INT-2)
- Execution path unification (INT-4)
- expr crate consolidation (INT-3)

These are tracked as INT-1 through INT-4 and deferred to v3.8.0.

### Required conditions ALL PASS → GA = PASS with documented exclusions

