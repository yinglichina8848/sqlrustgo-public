## Schema Compliance

All claims follow G-04_CLAIM_PROVENANCE_SPEC.md v1.0 schema.

Required fields enforced:
- [x] claim_id (unique, kebab-case)
- [x] title (string)
- [x] type (enum: architectural_risk | release_conclusion | deferral_decision)
- [x] status (enum: asserted | supported | verified | disproven | mitigated)
- [x] findings[] (>=1 per G-04.2)
- [x] evidence.* (commit_sha required for supported/verified)
- [x] claim_source_refs (Issue/PR/Wiki — marked as NOT evidence)

