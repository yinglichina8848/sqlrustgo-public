## Finding: execute_insert Direct Storage Call

**Finding ID**: FIND-INT1-001

### Location
```
file: crates/executor/src/execution_engine.rs
function: execute_insert
line_range: "120-145"
```

### Observation
```rust
// CURRENT PATH (v3.7.0):
pub fn execute_insert(&self, ctx: &ExecCtx, plan: &InsertPlan) -> Result<usize> {
    let storage = self.storage.read();
    storage.insert(...)?;  // ← No WAL append
    Ok(rows_affected)
}
```

INSERT goes directly to `storage.insert()` without passing through TransactionManager or WAL.

### Expected Path (after PR-830)
```rust
pub fn execute_insert(&self, ctx: &ExecCtx, plan: &InsertPlan) -> Result<usize> {
    let txn = self.txn_manager.begin(ctx.session_id)?;
    txn.append_wal(WriteRecord::Insert(...))?;  // WAL staging
    let result = self.storage.insert(...)?;
    txn.commit()?;
    Ok(result)
}
```

