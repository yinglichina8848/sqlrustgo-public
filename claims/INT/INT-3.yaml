## Finding: Expression Evaluation Duplicated Across Code Paths

**Finding ID**: FIND-INT3-001

### Location
```
file: crates/executor/src/expression.rs
file: crates/planner/src/expr.rs
file: crates/optimizer/src/expr_opt.rs
```

### Observation

Expression evaluation logic is duplicated in multiple crates:
- `executor::expression` — runtime evaluation
- `planner::expr` — planning-time evaluation  
- `optimizer::expr_opt` — optimization-time evaluation

Each has its own Expr enum and evaluation logic. No shared expr crate.

