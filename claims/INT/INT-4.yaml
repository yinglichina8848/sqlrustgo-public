## Finding: mysql-server Uses ExecutionEngine with Hard-coded MemoryStorage

**Finding ID**: FIND-INT4-001

### Location
```
file: crates/mysql-server/src/lib.rs
function: MySqlServer::execute_query
line_range: "200-280"
```

### Observation

```rust
// mysql-server path (v3.7.0):
impl MySqlServer {
    pub fn execute_query(&self, query: &str) -> Result<RowSet> {
        let engine = ExecutionEngine::new(self.storage.clone());
        // storage is MemoryStorage — hard-coded, not swappable
        let result = engine.execute_raw(query)?;  // ← bypasses Planner
        Ok(result)
    }
}
```

