## Finding: Storage.insert Called From ExecutionEngine, Not Storage Layer

**Finding ID**: FIND-INT4-003

### Location
```
file: crates/executor/src/execution_engine.rs
function: execute_insert
line_range: "120-145"
```

### Observation

This finding overlaps with INT-1 (DML bypasses WAL). Here the concern is:
```rust
// execution_engine.rs line ~130:
storage.insert(...);  // Direct storage call from execution layer
```
storage.insert is called from execution_engine.rs, not from a dedicated storage layer.

