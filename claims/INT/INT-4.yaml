## Finding: bench-cli Uses LocalExecutor with Swappable Storage

**Finding ID**: FIND-INT4-002

### Location
```
file: tools/bench-cli/src/main.rs
function: run_benchmark
```

### Observation

bench-cli uses a different path than mysql-server:
- bench-cli → LocalExecutor → StorageEngine (swappable)
- mysql-server → ExecutionEngine → MemoryStorage (hard-coded)

This creates a dual-path problem where SQL behavior may differ between the two clients.

### Evidence

#### commit_sha
```
EMPTY
```

#### file_refs
```
- path: tools/bench-cli/src/main.rs
  finding: "LocalExecutor used with swappable storage backend"
```

