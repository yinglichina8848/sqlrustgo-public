## Finding: ParallelVolcanoExecutor Not in Primary Execution Path

**Finding ID**: FIND-INT2-001

### Location
```
file: crates/executor/src/lib.rs
function: (parallel_volcano_executor module exists but unused)
line_range: unknown
```

### Observation

ParallelVolcanoExecutor exists in the codebase but is NOT invoked by mysql-server execution path.

```
mysql-server → ExecutionEngine → LocalExecutor → StorageEngine
                                                     ↑
                                         ParallelVolcanoExecutor is HERE
                                         (never called from above)
```

bench-cli uses LocalExecutor which contains VTU/SIMD optimizations, but mysql-server uses ExecutionEngine directly.

